        function checkMolecularGeometry() {
            const data = getMolecularGeometryData();
            if (!data) {
                stepPhysicalProperties();
                return;
            }

            const focus = document.getElementById('geomFocusAtom')?.value || '';
            const domains = document.getElementById('geomDomains')?.value || '';
            const eGeometry = document.getElementById('geomEGeometry')?.value || '';
            const mGeometry = document.getElementById('geomMGeometry')?.value || '';
            const angle = document.getElementById('geomAngle')?.value || '';

            if (!focus || !domains || !eGeometry || !mGeometry || !angle) {
                addTutorMessage("Por favor, completa los cinco apartados de geometría molecular antes de comprobar.");
                return;
            }

            currentStepAttempts++;

            const shapeLabels = {
                lineal: 'Lineal', linear: 'Lineal', angular: 'Angular', plano_triangular: 'Plano triangular',
                piramide_triangular: 'Pirámide triangular', tetraedrica: 'Tetraédrica'
            };
            const focusText = focus === 'any' ? 'cualquiera de los dos átomos' : focus;
            const geomAngleEl = document.getElementById('geomAngle');
            const angleTextSelected = geomAngleEl?.options?.[geomAngleEl.selectedIndex]?.text || angle;
            inputArea.innerHTML = '';
            addUserMessage(`Geometría: átomo de referencia ${focusText}; ${domains} pares de e⁻; geometría electrónica ${shapeLabels[eGeometry] || eGeometry}; geometría molecular ${shapeLabels[mGeometry] || mGeometry}; ángulo ${angleTextSelected}.`);

            const okFocus = data.isDiatomic ? (focus === 'any' || focus === data.center || focus === currentScenario.builder.periph[0]) : (focus === data.expectedFocus);
            const okDomains = parseInt(domains) === data.electronDomains;
            const okEGeometry = eGeometry === data.electronGeometry;
            const okMGeometry = mGeometry === data.molecularGeometry;
            const okAngle = angle === data.angle;

            safeSetTimeout(() => {
                if (okFocus && okDomains && okEGeometry && okMGeometry && okAngle) {
                    try {
                        renderMolecularGeometryOnStage(false);
                    } catch (err) {
                        console.error('Error al dibujar la geometría molecular:', err);
                        renderLewisStructureOnStage();
                    }
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Muy bien!</b> La geometría electrónica es <b>${shapeLabels[data.electronGeometry] || data.electronGeometry}</b> y la geometría molecular es <b class="text-red-600 font-bold">${shapeLabels[data.molecularGeometry] || data.molecularGeometry}</b>, con un ángulo de enlace de <b>${data.angleText}</b>.`);
                    showContinueButton('stepMolecularPolarity()', 'Continuar a polaridad');
                } else {
                    if (currentStepAttempts >= 3) {
                        try {
                            renderMolecularGeometryOnStage(false);
                        } catch (err) {
                            console.error('Error al dibujar la geometría molecular:', err);
                            renderLewisStructureOnStage();
                        }
                        const focusCorrect = data.expectedFocus === 'any' ? 'cualquiera de los dos átomos' : data.center;
                        addTutorMessage(`Has usado los 3 intentos. Debemos fijarnos en <b>${focusCorrect}</b>. Hay <b>${data.electronDomains}</b> pares de electrones alrededor. La geometría electrónica correcta es <b>${shapeLabels[data.electronGeometry] || data.electronGeometry}</b>, la geometría molecular es <b class="text-red-600 font-bold">${shapeLabels[data.molecularGeometry] || data.molecularGeometry}</b> y el ángulo es <b>${data.angleText}</b>.`);
                        showContinueButton('stepMolecularPolarity()', 'Continuar a polaridad');

                        let hints = [];
                        if (!okFocus) hints.push(data.expectedFocus === 'any' ? 'en una molécula diatómica puedes fijarte en cualquiera de los dos átomos' : 'fíjate en el átomo central de la estructura de Lewis');
                        if (!okDomains) hints.push('cuenta enlaces alrededor del átomo central y también sus pares libres');
                        if (!okEGeometry) hints.push('la geometría electrónica considera todas las zonas de electrones: enlaces y pares solitarios');

                        if (!okAngle) hints.push('relaciona el ángulo con la geometría y recuerda que los pares libres suelen cerrar el ángulo');

        function renderDiatomicPolarityOnStage(showDipoles = false) {
            if (!currentScenario || !currentScenario.builder || !stageContent) return;
            const data = getMolecularGeometryData();
            const b = currentScenario.builder;
            const a = b.center;
            const c = b.periph[0];
            const formulaHtml = formatChemicalFormulaHTML(currentScenario.form);
            const polarBond = isBondConsideredPolar(a, c);
            const leftX = 170, rightX = 290, y = 160;
            const enA = electronegativityDB[a] || 0;
            const enC = electronegativityDB[c] || 0;
            const lessX = enA <= enC ? leftX : rightX;
            const moreX = enA > enC ? leftX : rightX;
            let dipoleSvg = '';
            let deltaSvg = '';

            if (showDipoles && polarBond) {
                const sense = getBondDipoleSense(a, c);
                const startX = sense === 'A_to_B' ? leftX + 38 : rightX - 38;
                const endX = sense === 'A_to_B' ? rightX - 38 : leftX + 38;
                dipoleSvg = `
                    <line x1="${startX}" y1="${y - 36}" x2="${endX}" y2="${y - 36}" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#netDipoleArrowSmall)" stroke-linecap="round"/>
                    <text x="${(startX + endX) / 2}" y="${y - 60}" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-size="18" font-weight="900">μ</text>
                `;
                deltaSvg = `
                    <text x="${lessX}" y="${y - 44}" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-size="17" font-weight="900">δ+</text>
                    <text x="${moreX}" y="${y - 44}" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-size="17" font-weight="900">δ−</text>
                `;
            }

            stageContent.innerHTML = `
                <div class="fade-in w-full flex flex-col items-center justify-center">
                    <div class="mb-1 text-center">
                        <div class="text-sm font-bold text-slate-500 uppercase tracking-wide">Polaridad molecular</div>
                        <div class="text-2xl font-extrabold text-indigo-700">${formulaHtml}</div>
                    </div>
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-1.5">
                        <svg viewBox="0 0 460 240" width="100%" style="max-width: 420px; height: auto; max-height: 360px;">
                            <defs>
                                <marker id="netDipoleArrowSmall" markerWidth="4.2" markerHeight="4.2" refX="3.9" refY="2.1" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L4.2,2.1 L0,4.2 z" fill="#7c3aed"></path>
                                </marker>
                            </defs>
                            <line x1="${leftX + 28}" y1="${y}" x2="${rightX - 28}" y2="${y}" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
                            ${dipoleSvg}
                            ${deltaSvg}
                            <g>

        function getElectronegativityPolarityInfoHTML(data = null) {
            if (!currentScenario || currentScenario.type !== 'covalent' || !currentScenario.builder) return '';
            const b = currentScenario.builder;
            const symbols = [...new Set([b.center, ...(b.periph || [])])]
                .filter(sym => elementsDB[sym] && elementsDB[sym].type === 'nonmetal');
            const rows = symbols.map(sym => {
                const en = electronegativityDB[sym];
                return `<b>${sym}</b>: χ(${sym})=${en?.toFixed(2) ?? '—'}`;
            });
            if (!rows.length) return '';
            return `<br><br><b>Electronegatividades de Pauling de los no metales implicados:</b><br>${rows.join('; ')}`;
        }

        function getElectronegativityShortHintHTML(data = null) {
            return getElectronegativityPolarityInfoHTML(data).replace('<br><br>', '');
        }

        function stepMolecularPolarity(isRetry = false, prev = {}) {
            if (!isRetry) currentStepAttempts = 0;
            const data = getMolecularGeometryData();
            if (!data) {
                stepPhysicalProperties();
                return;
            }

            if (data.isDiatomic) {
                renderLewisStructureOnStage();
            } else {
                renderMolecularGeometryOnStage(false);
            }

            safeSetTimeout(() => {
                if (!isRetry) {
                    addTutorMessage(`${data.isDiatomic ? 'Ahora vamos con la <b>polaridad molecular</b>: en una molécula diatómica, basta con decidir si el enlace entre los dos átomos es polar o apolar.' : 'Ahora vamos con la <b>polaridad molecular</b>: primero piensa si los enlaces individuales son polares y después si sus dipolos se anulan o no según la geometría.'}${getElectronegativityPolarityInfoHTML(data)}`);
                }

                inputArea.innerHTML = `
                    <div class="flex flex-col space-y-1 fade-in font-sans text-slate-800">
                        <div class="bg-slate-50 border border-slate-200 rounded p-1.5 space-y-1">

                            <label class="text-[14px] font-bold text-slate-600 block">2) Según la geometría, ¿la molécula es polar?</label>
                            <select id="moleculePolarity" class="border border-slate-300 rounded px-2 py-1 focus:ring-2 outline-none w-full text-sm bg-white text-slate-800">

                                <option value="polar" ${prev.moleculePolarity === 'polar' ? 'selected' : ''}>Molécula polar</option>

        function checkMolecularPolarity() {
            const data = getMolecularGeometryData();
            if (!data) {
                stepPhysicalProperties();
                return;
            }

            const bondPolarity = document.getElementById('bondPolarity').value;
            const moleculePolarity = document.getElementById('moleculePolarity').value;
            if (!bondPolarity || !moleculePolarity) {
                addTutorMessage("Por favor, completa los dos apartados de polaridad antes de comprobar.");
                return;
            }

            currentStepAttempts++;
            inputArea.innerHTML = '';
            const expectedBond = data.individualBondsPolar ? 'yes' : 'no';
            const expectedMol = data.moleculePolar ? 'polar' : 'apolar';
            const userBondText = bondPolarity === 'yes' ? 'enlaces polares' : 'enlaces apolares';
            const userMolText = moleculePolarity === 'polar' ? 'molécula polar' : 'molécula apolar';
            addUserMessage(`Polaridad: ${userBondText}; ${userMolText}.`);

            const prettyShape = {
                lineal: 'lineal', angular: 'angular', plano_triangular: 'plana triangular',
                piramide_triangular: 'piramidal triangular', tetraedrica: 'tetraédrica'
            };
            const center = currentScenario.builder.center;
            const uniqPeriph = [...new Set(currentScenario.builder.periph)];
            const bondLabel = uniqPeriph.map(sym => `${center}–${sym}`).join(', ');

            safeSetTimeout(() => {
                if (bondPolarity === expectedBond && moleculePolarity === expectedMol) {
                    if (data.isDiatomic) renderDiatomicPolarityOnStage(true); else renderMolecularGeometryOnStage(true);
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Correcto!</b> Has relacionado bien la polaridad de los enlaces con la geometría molecular. Ahora vamos a estudiar las <b>fuerzas o interacciones entre partículas</b>.`);
                    showContinueButton('stepParticleAttractions()', 'Seguir con interacciones entre partículas');
                } else {
                    if (currentStepAttempts >= 3) {
                        let bondText = data.individualBondsPolar
                            ? `los enlaces <b>${bondLabel}</b> son polares`
                            : `los enlaces <b>${bondLabel}</b> son apolares o muy poco polares`;
                        let molText = '';
                        if (data.moleculePolar) {
                            molText = `la molécula es <b class="text-red-600 font-bold">polar</b> porque su geometría ${prettyShape[data.geometry]} no anula los dipolos de enlace`;
                        } else if (data.individualBondsPolar) {
                            molText = `la molécula es <b class="text-red-600 font-bold">apolar</b> porque su geometría ${prettyShape[data.geometry]} hace que los dipolos se anulen`;
                        } else {
                            molText = `la molécula es <b class="text-red-600 font-bold">apolar</b> porque no presenta dipolos apreciables`;
                        }
                        if (data.isDiatomic) renderDiatomicPolarityOnStage(true); else renderMolecularGeometryOnStage(true);
                        addTutorMessage(`Has agotado tus 3 intentos. En este caso, ${bondText} y ${molText}.${getElectronegativityPolarityInfoHTML(data)}`);
                        showContinueButton('stepParticleAttractions()', 'Seguir con interacciones entre partículas');
                    } else {
                        let hint = 'Compara primero si cada enlace es polar y, después, decide si la geometría cancela o no los dipolos.';
                        if (!data.individualBondsPolar) {
                            hint = `Fíjate primero en los valores de electronegatividad de los no metales implicados.<br>${getElectronegativityShortHintHTML(data)}`;
                        } else if (data.moleculePolar) {
                            hint = `La molécula presenta enlaces polares. Ahora piensa si la geometría ${prettyShape[data.geometry]} deja un reparto asimétrico de esos dipolos.<br>${getElectronegativityShortHintHTML(data)}`;
                        } else {
                            hint = `La molécula presenta enlaces polares, pero su geometría ${prettyShape[data.geometry]} puede repartirlos de forma simétrica.<br>${getElectronegativityShortHintHTML(data)}`;
                        }
                        addTutorMessage(`No exactamente.<br><br><b>Pista:</b> ${hint}`);
                        stepMolecularPolarity(true, { bondPolarity, moleculePolarity });
                    }
                }
            }, 800);
        }

        // --- INTERACCIONES ENTRE PARTÍCULAS ---
        function getParticleAttractionData() {
            const type = currentScenario.type;
            const labels = {
                london: 'Fuerzas de dispersión de London',
                dipole: 'Fuerzas dipolo-dipolo',
                hydrogen: 'Puentes de hidrógeno',
                ion_ion: 'Atracción electrostática ion-ion',
                metallic: 'Atracción electrostática entre cationes y e⁻ deslocalizados',
                covalent_network: 'Enlaces covalentes de la red'
            };
            const intensityLabels = {
                muy_debil: 'Muy débiles', debil: 'Débiles', media: 'Intermedias', fuerte: 'Fuertes', muy_fuerte: 'Muy fuertes'
            };
            let expected = [];
            let intensity = 'debil';
            let explanation = '';
            let mainConcept = '';
            if (type === 'covalent') {
                const g = getMolecularGeometryData();
                expected = ['london'];
                intensity = 'muy_debil';
                mainConcept = 'Fuerzas intermoleculares';
                explanation = 'En las sustancias covalentes moleculares las partículas son moléculas independientes. Entre ellas actúan fuerzas intermoleculares.';
                if (g && g.moleculePolar) {
                    expected.push('dipole');
                    intensity = 'debil';
                    if (currentScenario.form === 'PH3') {
                        explanation += ' En la fosfina, la polaridad molecular es débil pero no nula; por eso, además de London, añadimos fuerzas dipolo-dipolo. No añadimos puentes de hidrógeno porque el H no está unido a N, O ni F.';
                    } else {
                        explanation += ' Como la molécula es polar, además de London aparecen fuerzas dipolo-dipolo.';
                    }
                } else {
                    explanation += ' En este caso, el subtipo presente es London.';
                }
                const b = currentScenario.builder;
                const hasHBond = b && b.periph.some(sym => (b.center === 'H' && ['N', 'O', 'F'].includes(sym)) || (sym === 'H' && ['N', 'O', 'F'].includes(b.center)));
                if (hasHBond) {
                    expected.push('hydrogen');
                    intensity = 'media';
                    explanation += ' Además, al existir enlaces H–N, H–O o H–F, también aparecen puentes de hidrógeno. Dentro de las fuerzas intermoleculares, los puentes de hidrógeno se consideran relativamente fuertes o intermedios; aun así, siguen siendo mucho más débiles que un enlace covalente de red, una red iónica o un enlace metálico.';
                }
            } else if (type === 'ionic') {
                expected = ['ion_ion']; intensity = 'fuerte'; mainConcept = 'Atracción electrostática entre iones';
                explanation = 'En los compuestos iónicos las partículas son iones positivos y negativos ordenados en una red. La atracción electrostática ion-ion es fuerte como norma general didáctica.';
            } else if (type === 'metallic') {
                expected = ['metallic']; intensity = 'fuerte'; mainConcept = 'Atracción electrostática entre cationes y e⁻ deslocalizados';
                explanation = 'En las sustancias metálicas hay cationes metálicos cohesionados por una nube de electrones deslocalizados. En esta escala general se considera una interacción fuerte, aunque algunos metales concretos pueden presentar interacciones muy resistentes.';
            } else if (type === 'covalent_atomic') {
                expected = ['covalent_network']; intensity = 'muy_fuerte'; mainConcept = 'Enlaces covalentes de la red';
                explanation = 'En las sustancias covalentes atómicas no hay moléculas independientes: toda la red está unida por enlaces covalentes, muy fuertes.';
            } else if (type === 'none') {
                expected = ['london']; intensity = 'muy_debil'; mainConcept = 'Fuerzas de dispersión de London';
                explanation = 'En los gases nobles las partículas son átomos aislados. No forman moléculas ni enlaces; solo aparecen fuerzas de dispersión de London muy débiles. Aunque son apolares, su solubilidad en disolventes apolares suele ser muy baja y aumenta al bajar en el grupo: He < Ne < Ar < Kr < Xe.';
            }
            return { expected, intensity, labels, intensityLabels, explanation, mainConcept };
        }

        function getInteractionStrengthScaleNote() {
            return `<div class="mt-1 p-1.5 bg-amber-50 border border-amber-200 rounded text-slate-700 text-sm leading-snug">

                como la <b>atracción electrostática entre cationes y e⁻ deslocalizados</b>.
                Solo los <b>enlaces covalentes de red</b> se consideran <b>muy fuertes</b>.
                Puede haber excepciones según la sustancia concreta.
            </div>`;
        }

                                <option value="">Selecciona...</option>
                                <option value="muy_debil" ${prev.intensity === 'muy_debil' ? 'selected' : ''}>Muy débiles</option>
                                <option value="debil" ${prev.intensity === 'debil' ? 'selected' : ''}>Débiles</option>
                                <option value="media" ${prev.intensity === 'media' ? 'selected' : ''}>Intermedias</option>
                                <option value="fuerte" ${prev.intensity === 'fuerte' ? 'selected' : ''}>Fuertes</option>
                                <option value="muy_fuerte" ${prev.intensity === 'muy_fuerte' ? 'selected' : ''}>Muy fuertes</option>

                        <button onclick="checkParticleAttractions()" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-1.5 rounded shadow-md transition-colors font-sans">Comprobar Interacciones</button>
                    </div>`;

        function checkParticleAttractions() {
            const data = getParticleAttractionData();
            const selected = Array.from(document.querySelectorAll('.attractionCheck:checked')).map(el => el.value).sort();
            const intensity = document.getElementById('attractionIntensity').value;
            if (!selected.length || !intensity) {
                addTutorMessage('Por favor, marca al menos una interacción y selecciona la intensidad antes de comprobar.');
                return;
            }
            currentStepAttempts++;
            inputArea.innerHTML = '';
            const selectedText = selected.map(k => data.labels[k]).join(', ');
            addUserMessage(`Interacciones: ${selectedText}. Intensidad: ${data.intensityLabels[intensity]}.`);
            const expectedSorted = [...data.expected].sort();
            const okForces = selected.length === expectedSorted.length && selected.every((v, i) => v === expectedSorted[i]);
            const okIntensity = intensity === data.intensity;
            safeSetTimeout(() => {
                if (okForces && okIntensity) {
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Correcto!</b> ${data.explanation}${getInteractionStrengthScaleNote()}`);
                    showContinueButton('stepPhysicalProperties()', 'Seguir con propiedades físicas');
                } else if (currentStepAttempts >= 3) {
                    const expectedText = expectedSorted.map(k => data.labels[k]).join(', ');
                    addTutorMessage(`Has agotado tus 3 intentos. Las interacciones correctas son: <b class="text-red-600 font-bold">${expectedText}</b>. Intensidad predominante: <b class="text-red-600 font-bold">${data.intensityLabels[data.intensity]}</b>.<br><br>${data.explanation}${getInteractionStrengthScaleNote()}`);
                    showContinueButton('stepPhysicalProperties()', 'Seguir con propiedades físicas');
                } else {
                    let hint = 'Piensa primero en qué partículas existen y luego en si esas partículas presentan o no polaridad.';
                    if (currentScenario.type === 'covalent') hint = 'Todas las moléculas presentan London. Después valora si, por su polaridad, aparece alguna interacción adicional más intensa.';
                    if (currentScenario.type === 'ionic') hint = 'Aquí no hay moléculas independientes, sino una red de iones de signo opuesto.';
                    if (currentScenario.type === 'metallic') hint = 'La cohesión del metal no depende de moléculas, sino de cationes y electrones deslocalizados.';
                    if (currentScenario.type === 'covalent_atomic') hint = 'Aquí no hablamos de moléculas, sino de una red continua de enlaces covalentes.';
                    addTutorMessage(`No exactamente.<br><br><b>Pista:</b> ${hint}`);
                    stepParticleAttractions(true, { forces: selected, intensity });
                }
            }, 800);
        }

            inputArea.innerHTML = `

        }

        function isPolarMolecular(sc) {
            const isHomo = sc.e1 === sc.e2;
            const apolarMolecules = ['H2', 'N2', 'O2', 'F2', 'Cl2', 'Br2', 'I2', 'CH4', 'CF4', 'CCl4', 'CBr4', 'CI4', 'SiH4', 'SiF4', 'SiCl4', 'SiBr4', 'SiI4', 'CO2', 'CS2'];
            return !isHomo && !apolarMolecules.includes(sc.form);
        }

        function getExpectedPropertiesQualitative(sc) {
            const type = sc.type;
            let state = 'Sólido'; 
            let qualMelting = 'Alto';
            let qualBoiling = 'Alto';
            let condS = 'Aislante'; 
            let condL = 'Aislante';
            let solWater = 'insoluble';
            let solApolar = 'insoluble';
            let tough = 'fragil';
            let duct = 'nula';
            let hard = 'duro';
            let therm = 'mala';
            let optic = 'vitreo';

            if (type === 'none') { 
                state = 'Gas';
                qualMelting = 'Muy bajo';
                qualBoiling = 'Muy bajo';
                condS = 'aislante';
                condL = 'aislante';
                solWater = 'insoluble';
                solApolar = 'insoluble';
                tough = 'no_aplica';
                text = ''; // Declaración segura para prevenir ReferenceError
                duct = 'no_aplica';
                hard = 'no_aplica';
                therm = 'mala';
                optic = 'transparente_incoloro';
            } else if (type === 'metallic') { 
                state = 'Sólido'; 
                qualMelting = 'Alto';
                qualBoiling = 'Alto';
                condS = 'conductor';
                condL = 'conductor';
                solWater = (['Li', 'Na', 'K', 'Rb', 'Cs', 'Ca', 'Sr', 'Ba'].includes(sc.e1)) ? 'reacciona' : 'insoluble';
                solApolar = 'insoluble';
                tough = 'tenaz';
                duct = 'alta';
                hard = 'variable';
                therm = 'excelente';
                optic = 'metalico';
            } else if (type === 'covalent_atomic') { 
                state = 'Sólido'; 
                qualMelting = 'Muy alto';
                qualBoiling = 'Muy alto';
                condS = 'aislante';
                condL = 'aislante';
                solWater = 'insoluble';
                solApolar = 'insoluble';
                tough = 'fragil';
                duct = 'nula';
                hard = 'muy_duro';
                therm = sc.form === 'SiO2' ? 'media_baja' : 'excepcional';
                optic = 'adamantino';
            } else if (type === 'ionic') { 
                state = 'Sólido'; 
                qualMelting = 'Alto';
                qualBoiling = 'Alto';
                condS = 'aislante';
                condL = 'conductor';
                solWater = 'soluble';
                solApolar = 'insoluble';
                tough = 'fragil';
                text = '';
                duct = 'nula';
                hard = 'duro';
                therm = 'mala';
                optic = 'vitreo';
            } else if (type === 'covalent') { 
                state = (['I2', 'P4', 'S8'].includes(sc.form)) ? 'Sólido' : (['H2O', 'Br2'].includes(sc.form)) ? 'Líquido' : 'Gas';
                qualMelting = 'Bajo';
                qualBoiling = 'Bajo';
                condS = 'aislante';
                condL = 'aislante';
                if (sc.form === 'PH3') {
                    // Fosfina: polar débil, gas a temperatura ambiente,
                    // ligeramente soluble en agua y con afinidad por disolventes orgánicos/apolares.
                    solWater = 'poco_soluble';
                    solApolar = 'soluble';
                } else if (isPolarMolecular(sc)) {
                    solWater = 'soluble';
                    solApolar = 'insoluble';
                } else {
                    solWater = 'insoluble';
                    solApolar = 'soluble';
                }
                tough = (state === 'Gas' || state === 'Líquido') ? 'no_aplica' : 'fragil';
                duct = (state === 'Gas' || state === 'Líquido') ? 'no_aplica' : 'nula';
                hard = (state === 'Gas' || state === 'Líquido') ? 'no_aplica' : 'blando';
                therm = 'mala';
                optic = 'transparente_mate';
            }

            return { state, qualMelting, qualBoiling, condS, condL, solWater, solApolar, tough, duct, hard, therm, optic };
        }

        function checkPhysicalProperties() {
            currentStepAttempts++;
            const type = currentScenario.type;
            const expectedQual = getExpectedPropertiesQualitative(currentScenario);

            let expectedValueState = '';
            let expectedValueMB = '';
            let expectedValueCondS = '';
            let expectedValueCondL = (type === 'ionic' || type === 'metallic') ? 'conductor' : 'aislante';
            
            if (type === 'none') { expectedValueState = 'gases'; expectedValueMB = 'muy_bajos'; expectedValueCondS = 'aislante'; }
            else if (type === 'covalent') { expectedValueState = 'sol_liq_gas'; expectedValueMB = 'bajos'; expectedValueCondS = 'aislante'; }
            else if (type === 'ionic') { expectedValueState = 'solidos'; expectedValueMB = 'altos'; expectedValueCondS = 'aislante'; }
            else if (type === 'metallic') { expectedValueState = 'solidos'; expectedValueMB = 'altos'; expectedValueCondS = 'conductor'; }
            else if (type === 'covalent_atomic') { expectedValueState = 'solidos'; expectedValueMB = 'muy_altos'; expectedValueCondS = 'aislante'; }

            // Manejo de solubilidad metálica para validación general
            let expectedValueSolWater = expectedQual.solWater;
            if (type === 'metallic') expectedValueSolWater = 'reacciona'; 

            const expectedValueTough = expectedQual.tough;
            const expectedValueDuct = expectedQual.duct;
            const expectedValueHard = expectedQual.hard;
            const expectedValueTherm = expectedQual.therm;
            const expectedValueOptic = expectedQual.optic;

            const stateSelect = document.getElementById('prop_state');
            const mbSelect = document.getElementById('prop_melting_boiling');
            const condSSelect = document.getElementById('prop_condS');
            const condLSelect = document.getElementById('prop_condL');
            const solWaterSelect = document.getElementById('prop_sol_water');
            const solApolarSelect = document.getElementById('prop_sol_apolar');
            const toughSelect = document.getElementById('prop_tough');
            const ductSelect = document.getElementById('prop_duct');
            const hardSelect = document.getElementById('prop_hard');
            const thermSelect = document.getElementById('prop_therm');
            const opticSelect = document.getElementById('prop_optic');
            
            const state = stateSelect ? stateSelect.value : '';
            const mb = mbSelect ? mbSelect.value : '';
            const condS = condSSelect ? condSSelect.value : '';
            const condL = condLSelect ? condLSelect.value : '';
            const solW = solWaterSelect ? solWaterSelect.value : '';
            const solA = solApolarSelect ? solApolarSelect.value : '';
            const tough = toughSelect ? toughSelect.value : '';
            const duct = ductSelect ? ductSelect.value : '';
            const hard = hardSelect ? hardSelect.value : '';
            const therm = thermSelect ? thermSelect.value : '';
            const optic = opticSelect ? opticSelect.value : '';
            
            if (!state || !mb || !condS || !condL || !solW || !solA || !tough || !duct || !hard || !therm || !optic) {
                addTutorMessage("Por favor, selecciona una respuesta en todos los desplegables antes de validar.");
                return;
            }

            inputArea.innerHTML = '';
            addUserMessage("Verificando las 11 propiedades predichas...");

            let errors = [];
            
            const validateField = (selectEl, val, expected, name) => {
                if (!selectEl) return;
                if (val !== expected) {
                    errors.push(name);
                    selectEl.value = ''; // Resetea solo lo que está mal
                    selectEl.classList.add('border-red-400', 'bg-red-50');
                    selectEl.classList.remove('border-emerald-400', 'bg-emerald-50', 'text-emerald-800', 'font-semibold', 'border-slate-300');
                } else {
                    selectEl.disabled = true; // Bloquea y marca de verde lo que está bien
                    selectEl.classList.remove('border-red-400', 'bg-red-50', 'text-slate-800', 'border-slate-300');
                    selectEl.classList.add('border-emerald-400', 'bg-emerald-50', 'text-emerald-800', 'font-semibold');
                }
            };

            validateField(stateSelect, state, expectedValueState, "Estado físico");
            validateField(mbSelect, mb, expectedValueMB, "Puntos de Fusión/Ebullición");
            validateField(condSSelect, condS, expectedValueCondS, "Conductividad eléctrica (Sólido)");
            validateField(condLSelect, condL, expectedValueCondL, "Conductividad eléctrica (fundido o disolución acuosa)");
            validateField(solWaterSelect, solW, expectedValueSolWater, "Solubilidad en AGUA");
            validateField(solApolarSelect, solA, expectedQual.solApolar, "Solubilidad en APOLARES");
            validateField(toughSelect, tough, expectedValueTough, "Tenacidad");
            validateField(ductSelect, duct, expectedValueDuct, "Ductilidad y Maleabilidad");
            validateField(hardSelect, hard, expectedValueHard, "Dureza");
            validateField(thermSelect, therm, expectedValueTherm, "Conductividad térmica");
            validateField(opticSelect, optic, expectedValueOptic, "Aspecto visual y Brillo");

            safeSetTimeout(() => {
                if (errors.length === 0) {
                    addTutorMessage("<b class='text-red-600 font-bold'>¡Deducción magistral!</b> Has completado el informe total. Ahora vamos a insistir un poco más en la relación entre propiedades y fuerzas entre partículas.");
                    showContinueButton('stepForcesToMeltBoil()', 'Seguir con fuerzas a vencer');
                } else {
                    if (currentStepAttempts >= 3) {
                        const correctPairs = [
                            [stateSelect, expectedValueState, "Estado físico"],
                            [mbSelect, expectedValueMB, "Puntos de fusión y ebullición"],
                            [condSSelect, expectedValueCondS, "Conductividad eléctrica en sólido"],
                            [condLSelect, expectedValueCondL, "Conductividad eléctrica en líquido o disolución"],
                            [solWaterSelect, expectedValueSolWater, "Solubilidad en agua"],
                            [solApolarSelect, expectedQual.solApolar, "Solubilidad en disolventes apolares"],
                            [toughSelect, expectedValueTough, "Tenacidad"],
                            [ductSelect, expectedValueDuct, "Ductilidad y maleabilidad"],
                            [hardSelect, expectedValueHard, "Dureza"],
                            [thermSelect, expectedValueTherm, "Conductividad térmica"],
                            [opticSelect, expectedValueOptic, "Aspecto visual y brillo"]
                        ];

                        const getOptionText = (selectEl, value) => {
                            if (!selectEl) return value;
                            const opt = Array.from(selectEl.options).find(o => o.value === value);
                            return opt ? opt.textContent : value;
                        };

                        correctPairs.forEach(([selectEl, expected]) => {
                            if (!selectEl) return;
                            selectEl.value = expected;
                            selectEl.disabled = true;
                            selectEl.classList.remove('border-red-400', 'bg-red-50', 'text-slate-800', 'border-slate-300');
                            selectEl.classList.add('border-emerald-400', 'bg-emerald-50', 'text-emerald-800', 'font-semibold');
                        });

                        const correctList = correctPairs
                            .map(([selectEl, expected, label]) => `<li><b>${label}:</b> ${getOptionText(selectEl, expected)}</li>`)
                            .join('');

                        let extraExplanation = '';
                        if (type === 'covalent_atomic') {
                            extraExplanation = '<br><br><b>Clave para redes covalentes atómicas como el diamante:</b> son sólidos, con PF/PE muy altos y dureza muy alta porque habría que romper una red de enlaces covalentes. No son dúctiles ni maleables; suelen ser frágiles.';
                        }

                        addTutorMessage(`Has agotado tus 3 intentos. Estas son las <b class="text-red-600 font-bold">propiedades correctas</b>:<br><ul class="list-disc pl-5 mt-1">${correctList}</ul>${extraExplanation}<br><br>Ahora vamos a reforzar qué fuerzas o enlaces explican estos cambios macroscópicos.`);
                        showContinueButton('stepForcesToMeltBoil()', 'Seguir con fuerzas a vencer');
                    } else {
                        if (currentStepAttempts === 1) {
                            addTutorMessage(`Cuidado, hay errores en los siguientes campos: <b class="text-indigo-600">${errors.join(', ')}</b>.<br><br>Vuelve a revisar la ficha recordando que el comportamiento físico es un reflejo directo de la estructura microscópica de la sustancia.`);
                        } else {
                            let helperHint = "";
                            if (errors.includes("Conductividad eléctrica (Sólido)") || errors.includes("Conductividad eléctrica (fundido o disolución acuosa)")) {
                                helperHint += "• <b>Pista conductividad:</b> En sólido conducen los metales por electrones deslocalizados. En sustancias iónicas no conduce el sólido, pero sí el fundido o la disolución acuosa porque hay iones libres.<br>";
                            }
                            if (errors.includes("Solubilidad en AGUA") || errors.includes("Solubilidad en APOLARES")) {
                                if (type === 'none') {
                                    helperHint += "• <b>Pista solubilidad:</b> Los gases nobles son apolares y solo presentan fuerzas de London. Por eso son prácticamente insolubles en agua y solo muy poco solubles en disolventes apolares; la solubilidad aumenta al bajar en el grupo: He < Ne < Ar < Kr < Xe.<br>";
                                } else if (currentScenario.form === 'PH3') {
                                    helperHint += "• <b>Pista solubilidad:</b> La fosfina es polar débil, pero no forma puentes de hidrógeno fuertes con el agua; por eso la tratamos como <b>poco soluble en agua</b>, no como muy soluble. Al ser una molécula pequeña y poco polar, también puede disolverse en disolventes orgánicos/apolares.<br>";
                                } else {
                                    helperHint += "• <b>Pista solubilidad:</b> 'Lo semejante disuelve a lo semejante'. El agua es polar y disuelve redes iónicas o moléculas asimétricas con polos (polares). Los disolventes apolares (como el hexano) disuelven moléculas simétricas sin polos (apolares). Las redes gigantes (metálicas o atómicas) no se disuelven en ninguno de los dos.<br>";
                                }
                            }
                            if (errors.includes("Tenacidad") || errors.includes("Dureza") || errors.includes("Ductilidad y Maleabilidad")) {
                                if (type === 'ionic') helperHint += "• <b>Pista mecánica:</b> Imagina la red alternada de cargas + y -. Si la golpeas o intentas deformarla, se mueve una capa y las cargas del mismo signo quedan frente a frente. ¡Exacto, se repelerán y el cristal estallará! Por tanto, no se deforman plásticamente (ductilidad nula) y se quiebran al instante (frágiles).<br>";
                                else if (type === 'metallic') helperHint += "• <b>Pista mecánica:</b> Los metales tienen un mar de electrones libre que actúa como un pegamento flexible. Si los golpeas (impacto) resisten sin romperse (tenaces), y si los estiras o aplastas, se adaptan a la nueva forma sin que la red se rompa (altamente dúctiles y maleables).<br>";
                                else if (type === 'covalent_atomic') helperHint += "• <b>Pista mecánica:</b> Las redes atómicas gigantes como el diamante son las más duras, pero sus enlaces son fijos y ultrarrígidos. Si aplicas un golpe seco muy fuerte, no pueden absorber la energía y se parten (frágiles). Por supuesto, tampoco puedes deformarlos en hilos (ductilidad nula).<br>";
                                else helperHint += "• <b>Pista mecánica:</b> Las moléculas pequeñas se mantienen unidas por fuerzas débiles, por lo que en estado sólido no soportan golpes (frágiles) ni se pueden estirar (ductilidad nula). En estado gas o líquido, estas propiedades no aplican.<br>";
                            }
                            if (errors.includes("Conductividad térmica") || errors.includes("Aspecto visual y Brillo")) {
                                if (type === 'none') helperHint += "• <b>Pista termo/óptica:</b> Los gases nobles no transmiten bien el calor al estar separados, y al ser gases puros no absorben luz (son incoloros y transparentes).<br>";
                                else if (type === 'covalent') helperHint += "• <b>Pista termo/óptica:</b> Al tener moléculas independientes que vibran débilmente, son malos conductores del calor. Visualmente pueden ser gases/líquidos transparentes o sólidos blandos de aspecto mate y ceroso.<br>";
                                else if (type === 'ionic') helperHint += "• <b>Pista termo/óptica:</b> Los iones fijos no transmiten bien la vibración térmica (malos conductores). Visualmente forman cristales translúcidos o polvos con brillo vítreo.<br>";
                                else if (type === 'metallic') helperHint += "• <b>Pista termo/óptica:</b> Su mar de electrones deslocalizados permite conducir electricidad y calor en sólido y también en estado fundido. No es un electrolito: conduce por electrones, no por iones disueltos.<br>";
                                else if (type === 'covalent_atomic') helperHint += "• <b>Pista termo/óptica:</b> ¡Ojo con el calor! Su red ultrarrígida propaga las vibraciones térmicas a la perfección (excepcional conductor térmico). Ópticamente, su red dispersa la luz dando un brillo adamantino (como el diamante) o resinoso opaco.<br>";
                            }
                            
                            addTutorMessage(`Cuidado, hay errores en los siguientes campos: <b class="text-indigo-600">${errors.join(', ')}</b>.<br><br>${helperHint || 'Vuelve a revisar la ficha analizando los enlaces de la red.'}`);
                        }
                        stepPhysicalProperties(true);
                    }
                }
            }, 800);
        }

        function getForceFamilyForScenario() {
            const type = currentScenario.type;
            const attraction = getParticleAttractionData();
            if (type === 'covalent') {
                return {
                    mode: 'molecular',
                    expected: [...attraction.expected],
                    label: 'Fuerzas intermoleculares entre moléculas',
                    explanation: `Para separar o desplazar moléculas hay que vencer fuerzas intermoleculares. En este caso, los subtipos presentes son: ${attraction.expected.map(k => attraction.labels[k]).join(', ')}.${attraction.expected.includes('hydrogen') ? ' Los puentes de hidrógeno son de las fuerzas intermoleculares más intensas, pero no equivalen a romper enlaces covalentes, iónicos ni metálicos.' : ''}`
                };
            }
            if (type === 'ionic') return { mode: 'network', expected: ['ion_ion'], label: 'Atracciones electrostáticas ion-ion de la red', explanation: 'La sustancia está formada por una red de iones. Para fundirla, hervirla o rayarla hay que vencer atracciones electrostáticas fuertes entre iones de signo opuesto.' };
            if (type === 'metallic') return { mode: 'network', expected: ['metallic'], label: 'Atracción electrostática entre cationes y e⁻ deslocalizados', explanation: 'La cohesión del metal depende de la atracción electrostática fuerte entre cationes y e⁻ deslocalizados.' };
            if (type === 'covalent_atomic') return { mode: 'network', expected: ['covalent_network'], label: 'Enlaces covalentes de la red', explanation: 'En una red covalente gigante no hay moléculas independientes: la estructura está unida por enlaces covalentes de la propia red.' };
            return { mode: 'atomic', expected: ['london_atoms'], label: 'Fuerzas de dispersión de London', explanation: 'Las partículas son átomos aislados de gas noble y solo se atraen mediante fuerzas de dispersión de London. Son apolares, pero al tener interacciones muy débiles se disuelven muy poco; la solubilidad en disolventes apolares aumenta al bajar en el grupo.' };
        }

        function renderForceBreakingActivity(kind = 'phase', isRetry = false, prev = []) {
            if (!isRetry) currentStepAttempts = 0;
            const force = getForceFamilyForScenario();
            const title = kind === 'phase'
                ? 'Ahora vamos a relacionar las propiedades físicas con el modelo microscópico: para fundir o hervir una sustancia, ¿qué fuerzas o enlaces hay que vencer?'

        function stepForcesToMeltBoil(isRetry = false, prev = []) {
            renderForceBreakingActivity('phase', isRetry, prev);
        }

        function stepForcesToScratch(isRetry = false, prev = []) {
            renderForceBreakingActivity('scratch', isRetry, prev);
        }

        function checkForceBreakingActivity(kind = 'phase') {
            const force = getForceFamilyForScenario();
            const selected = Array.from(document.querySelectorAll('.forceBreakCheck:checked')).map(el => el.value).sort();
            if (!selected.length) {
                addTutorMessage('Selecciona al menos una opción antes de comprobar.');
                return;
            }
            currentStepAttempts++;
            inputArea.innerHTML = '';
            const allLabels = {
                london: 'Fuerzas de dispersión de London',
                dipole: 'Fuerzas dipolo-dipolo',
                hydrogen: 'Puentes de hidrógeno',
                ion_ion: 'Atracciones electrostáticas ion-ion de la red',
                metallic: 'Atracción electrostática entre cationes y e⁻ deslocalizados',
                covalent_network: 'Enlaces covalentes de la red',
                london_atoms: 'Fuerzas de dispersión de London'
            };
            addUserMessage(`${kind === 'phase' ? 'Para fundir o hervir' : 'Para rayar el sólido'} hay que vencer: ${selected.map(k => allLabels[k]).join(', ')}.`);
            const expected = [...force.expected].sort();
            const ok = selected.length === expected.length && selected.every((v, i) => v === expected[i]);
            safeSetTimeout(() => {
                if (ok) {
                    const intro = kind === 'phase'
                        ? '¡Correcto! Para fundir o hervir esta sustancia hay que vencer ese tipo de interacción o enlace.'
                        : '¡Correcto! Para rayar el sólido se altera localmente ese mismo tipo de interacción o enlace que mantiene unidas sus partículas.';
                    addTutorMessage(`<b class="text-red-600 font-bold">${intro}</b> ${force.explanation}`);
                    if (kind === 'phase') {
                        safeSetTimeout(() => stepForcesToScratch(), 1400);
                    } else {
                        safeSetTimeout(() => showFinalReport(), 1400);
                    }
                } else if (currentStepAttempts >= 3) {
                    const expectedText = expected.map(k => allLabels[k]).join(', ');
                    addTutorMessage(`Has agotado tus 3 intentos. La respuesta correcta es: <b class="text-red-600 font-bold">${expectedText}</b>.<br><br>${force.explanation}`);
                    if (kind === 'phase') {
                        safeSetTimeout(() => stepForcesToScratch(), 1700);
                    } else {
                        safeSetTimeout(() => showFinalReport(), 1700);
                    }
                } else {
                    let hint = 'Piensa si la sustancia está formada por moléculas independientes o por una red continua.';
                    if (force.mode === 'molecular') hint = 'En sustancias moleculares debes señalar el concepto general de fuerzas intermoleculares y, además, los subtipos presentes.';
                    addTutorMessage(`No exactamente.<br><br><b>Pista:</b> ${hint}`);
                    if (kind === 'phase') stepForcesToMeltBoil(true, selected);
                    else stepForcesToScratch(true, selected);
                }
            }, 800);
        }

            // Si por alguna razón extraña la combinación no está (Ej: Na3P), calculamos un valor exacto pero realista.
            if (sc.type === 'ionic') {
                const a1 = elementsDB[sc.e1];
                const a2 = elementsDB[sc.e2];
                const isO = sc.e2 === 'O';
                const isN = sc.e2 === 'N';
                const isH = sc.e2 === 'H';
                
                const baseM = isO ? 2400 : (isN ? 1800 : (isH ? 650 : 780));
                const variation = (a1.z * 4) + (a2.z * 2);
                const exactM = baseM - variation; 
                const exactB = exactM + (isO || isN ? 850 : 620);
                let solText = (isO || isN) ? 'Insoluble / Reacciona' : (isH ? 'Reacciona violentamente' : 'Muy soluble (aprox. 400 g/L)');
                
                return {
                    m: `${exactM} ºC`,
                    b: `${exactB} ºC`,
                    d: `${1800 + variation * 15} kg/m³`,
                    sol: solText
                };
            }

            return { m: 'N/A', b: 'N/A', d: 'N/A', sol: 'Variable' };
        }

            let expectedValueState = '';
            if (currentScenario.type === 'none') { expectedValueState = 'Gases'; }
            else if (currentScenario.type === 'covalent') { expectedValueState = 'Sólidos, líquidos o gases'; }
            else { expectedValueState = 'Sólidos'; }

            let expectedValueCondS = currentScenario.type === 'metallic' ? 'Buen conductor' : 'Aislante (No conduce)';
            let expectedValueCondL = (currentScenario.type === 'metallic' || currentScenario.type === 'ionic') ? 'Buen conductor como electrolito' : 'Aislante (No conduce)';

            let expectedValueSolWater = '';
            if (qualExpected.solWater === 'soluble') expectedValueSolWater = 'Sí se disuelve';
            else if (qualExpected.solWater === 'reacciona') expectedValueSolWater = 'Reacciona violentamente';
            else expectedValueSolWater = 'Insoluble';

            let expectedValueSolApolar = qualExpected.solApolar === 'soluble' ? 'Sí se disuelve' : 'Insoluble';

            let expectedValueToughText = '';
            if (qualExpected.tough === 'no_aplica') expectedValueToughText = 'No aplica';
            else if (qualExpected.tough === 'fragil') expectedValueToughText = 'Frágil / Quebradizo';
            else if (qualExpected.tough === 'tenaz') expectedValueToughText = 'Tenaz (Resiste impactos)';

            let expectedValueDuctText = '';
            if (qualExpected.duct === 'no_aplica') expectedValueDuctText = 'No aplica';
            else if (qualExpected.duct === 'nula') expectedValueDuctText = 'Nula (No dúctil ni maleable)';
            else if (qualExpected.duct === 'alta') expectedValueDuctText = 'Muy alta (Dúctiles y Maleables)';

            let expectedValueHardText = '';
            if (qualExpected.hard === 'no_aplica') expectedValueHardText = 'No aplica';
            else if (qualExpected.hard === 'blando') expectedValueHardText = 'Blando';
            else if (qualExpected.hard === 'duro') expectedValueHardText = 'Duro';
            else if (qualExpected.hard === 'variable') expectedValueHardText = 'Variable (Blando a Duro)';
            else if (qualExpected.hard === 'muy_duro') expectedValueHardText = 'Extremadamente duro';

            let expectedValueThermText = '';
            if (qualExpected.therm === 'mala') expectedValueThermText = currentScenario.type === 'ionic' ? 'Mala a moderada (Aislante)' : 'Mala (Aislante térmico)';
            else if (qualExpected.therm === 'media_baja') expectedValueThermText = 'Media-baja';
            else if (qualExpected.therm === 'excelente') expectedValueThermText = 'Excelente conductor térmico';
            else if (qualExpected.therm === 'excepcional') expectedValueThermText = 'Excepcionalmente alta (Red rígida)';

            let expectedValueOpticText = '';
            if (qualExpected.optic === 'transparente_incoloro') expectedValueOpticText = 'Transparentes e incoloros';
            else if (qualExpected.optic === 'transparente_mate') expectedValueOpticText = 'Transparente (fluidos) o Mate/Ceroso (sólidos)';
            else if (qualExpected.optic === 'vitreo') expectedValueOpticText = 'Brillo vítreo / Cristalino';
            else if (qualExpected.optic === 'metalico') expectedValueOpticText = 'Brillo metálico (Reflejantes / Opacos)';
            else if (qualExpected.optic === 'adamantino') expectedValueOpticText = 'Brillo adamantino o resinoso/opaco';

            if (isNone) {
                formulaTypeStr = 'Símbolo atómico';
                formatHtml = a1.sym;
                massStr = `${a1.mass.toFixed(2)} u`;
                totalMass = a1.mass.toFixed(2);
                sustType = 'Sustancia simple (Gas noble)';
                microType = 'Átomos sueltos gaseosos';
            } else if (isMetallic) {
                formulaTypeStr = 'Símbolo atómico';
                formatHtml = a1.sym;
                massStr = `${a1.mass.toFixed(2)} u`;
                totalMass = a1.mass.toFixed(2);
                sustType = 'Sustancia simple metálica';
                microType = 'Cristal metálico (red)';
            } else if (isCovalentAtomic) {
                formulaTypeStr = isHomo ? 'Símbolo atómico' : 'Fórmula unidad';
                formatHtml = isHomo ? a1.sym : `${a1.sym}<sub>${c1 > 1 ? c1 : ''}</sub>${a2.sym}<sub>${c2 > 1 ? c2 : ''}</sub>`;
                massStr = isHomo ? `${a1.mass.toFixed(2)} u` : `${c1}&middot;${a1.mass.toFixed(2)} u + ${c2}&middot;${a2.mass.toFixed(2)} u`;
                totalMass = (c1 * a1.mass + c2 * a2.mass).toFixed(2);
                sustType = isHomo ? 'Sustancia simple (Sólido de red covalente)' : 'Compuesto químico (Sólido de red covalente)';
                microType = 'Red cristalina de átomos neutros (Red gigante)';
            } else {
                formulaTypeStr = isIonic ? 'Fórmula unidad' : 'Fórmula molecular';
                formatHtml = isHomo 
                    ? `${currentScenario.e1}${(c1 + c2) > 1 ? `<sub>${c1 + c2}</sub>` : ''}`
                    : `${currentScenario.e1}${c1 > 1 ? `<sub>${c1}</sub>` : ''}${currentScenario.e2}${c2 > 1 ? `<sub>${c2}</sub>` : ''}`;
                massStr = isHomo
                    ? `${c1+c2}&middot;${a1.mass.toFixed(2)} u`
                    : `${c1}&middot;${a1.mass.toFixed(2)} u + ${c2}&middot;${a2.mass.toFixed(2)} u`;
                totalMass = (c1 * a1.mass + c2 * a2.mass).toFixed(2);
                
                sustType = isIonic ? 'Compuesto iónico' : (isHomo ? 'Sustancia simple covalente molecular' : 'Compuesto covalente molecular');
                microType = isIonic ? 'Cristal iónico (red)' : 'Moléculas';
            }

            const formattedTotal = totalMass.replace('.', ',');

            let reasoning = '';
            if (isNone) {
                reasoning = `<div><span class="font-bold">${a1.sym}</span> (Z=${a1.z}): ➔ <span class="font-mono">${a1.conf}</span> ➔ Tiene su nivel de valencia completo (${a1.val} e⁻). Es estable por sí solo y no forma enlaces.</div>`;
            } else if (isMetallic) {
                reasoning = `<div><span class="font-bold">${a1.sym}</span> (Z=${a1.z}): ➔ <span class="font-mono">${a1.conf}</span> ➔ Cede sus ${a1.val} e⁻ de valencia a una "nube electrónica" común, formando una red metálica estable.</div>`;
            } else if (isCovalentAtomic) {
                if (isHomo) {
                    reasoning = `<div><span class="font-bold">${a1.sym}</span> (Z=${a1.z}): ➔ <span class="font-mono">${a1.conf}</span> ➔ Con ${a1.val} e⁻ de valencia y ${getUnpairedSafe(a1)} e⁻ desapareados, comparte electrones en todas direcciones para formar una red covalente gigante.</div>`;
                } else {
                    reasoning = `<div><span class="font-bold">${a1.sym}</span> (Z=${a1.z}): <span class="font-mono">${a1.conf}</span> <br><span class="font-bold">${a2.sym}</span> (Z=${a2.z}): <span class="font-mono">${a2.conf}</span> <br>➔ Comparten sus electrones desapareados de forma direccional e infinita, creando una red cristalina covalente.</div>`;
                }
            } else if (isIonic) {
                let e1Change = a1.val;
                let e2Need = a2.sym === 'H' ? 1 : 8 - a2.val;
                let c1Format = e1Change === 1 ? '+' : e1Change + '+';
                let c2Format = e2Need === 1 ? '-' : e2Need + '-';
                
                reasoning = `
                    <div class="mb-1"><span class="font-bold">${a1.sym}</span> (Z=${a1.z}): ➔ <span class="font-mono">${a1.conf}</span> ➔ Pierde ${e1Change} e⁻ de valencia ➔ <b>${a1.sym}<sup>${c1Format}</sup></b></div>
                    <div><span class="font-bold">${a2.sym}</span> (Z=${a2.z}): ➔ <span class="font-mono">${a2.conf}</span> ➔ Gana ${e2Need} e⁻ para aparear sus orbitales ➔ <b>${a2.sym}<sup>${c2Format}</sup></b></div>
                `;
            } else {
                let e1Need = a1.sym === 'H' ? 1 : (8 - a1.val);
                let e2Need = a2.sym === 'H' ? 1 : (8 - a2.val);
                if (isHomo) {
                    reasoning = `
                        <div><span class="font-bold">${a1.sym}</span> (Z=${a1.z}): ➔ <span class="font-mono">${a1.conf}</span> ➔ Cada átomo de ${a1.sym} tiene ${getUnpairedSafe(a1)} e⁻ desapareados. Necesitan compartir ${e1Need} e⁻ para estabilizarse.</div>
                    `;
                } else {
                    reasoning = `
                        <div class="mb-1"><span class="font-bold">${a1.sym}</span> (Z=${a1.z}): ➔ <span class="font-mono">${a1.conf}</span> ➔ Necesita compartir ${e1Need} e⁻.</div>
                        <div><span class="font-bold">${a2.sym}</span> (Z=${a2.z}): ➔ <span class="font-mono">${a2.conf}</span> ➔ Necesita compartir ${e2Need} e⁻.</div>
                    `;
                }
            }

            let visualBlock = '';
            let visualTitle = '';
            
            if (isNone) {
                visualTitle = 'Configuración de gas noble:';
                let lpCount = a1.sym === 'He' ? 1 : 4;
                let dotHtml = '';
                if(lpCount === 1) dotHtml = `<div class="lp-dot" style="top: -6px; left: 50%; transform: translateX(-50%);">··</div>`;
                else dotHtml = `
                    <div class="lp-dot" style="top: -6px; left: 50%; transform: translateX(-50%);">··</div>
                    <div class="lp-dot" style="bottom: -6px; left: 50%; transform: translateX(-50%);">··</div>
                    <div class="lp-dot" style="left: -6px; top: 50%; transform: translateY(-50%) rotate(90deg);">··</div>
                    <div class="lp-dot" style="right: -6px; top: 50%; transform: translateY(-50%) rotate(90deg);">··</div>
                `;
                visualBlock = `<div class="lewis-cell atom-box center-atom-placed mx-auto mt-4" style="cursor:default;">${a1.sym} ${dotHtml}</div>`;
            } else if (isMetallic) {
                visualTitle = 'Red metálica (Nube de electrones):';
                let charge = a1.val === 1 ? '+' : a1.val + '+';
                visualBlock = `
                    <div class="flex gap-1.5 justify-center mt-4 items-center">
                        <div class="w-12 h-12 rounded-full bg-blue-100 border-2 border-blue-400 flex items-center justify-center font-bold text-blue-800 shadow-sm">${a1.sym}<sup>${charge}</sup></div>
                        <div class="w-8 h-8 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center text-xs font-bold text-slate-500">e⁻</div>
                        <div class="w-12 h-12 rounded-full bg-blue-100 border-2 border-blue-400 flex items-center justify-center font-bold text-blue-800 shadow-sm">${a1.sym}<sup>${charge}</sup></div>
                    </div>
                `;
            } else if (isCovalentAtomic) {
                visualTitle = 'Red covalente gigante tridimensional (unidad básica):';
                visualBlock = generateStaticLewisHTML(currentScenario);
                visualBlock += `<div class="text-[11px] text-slate-500 mt-1.5 italic text-center max-w-sm">Las líneas discontinuas indican que los enlaces continúan hacia otros átomos, formando una red infinita hiperestable.</div>`;
            } else if (isIonic) {
                visualTitle = 'Iones que forman la red:';
                let e1Change = a1.val;
                let e2Need = a2.sym === 'H' ? 1 : 8 - a2.val;
                let ion1 = `${a1.sym}<sup>${e1Change === 1 ? '+' : e1Change + '+'}</sup>`;
                let ion2 = `${a2.sym}<sup>${e2Need === 1 ? '-' : e2Need + '-'}</sup>`;
                visualBlock = `<div class="text-2xl font-bold font-serif text-indigo-700 bg-indigo-50 p-4 rounded-lg inline-block border border-indigo-200 mt-1">
                    [${ion1}]${c1 > 1 ? `<sub>${c1}</sub>` : ''}  [${ion2}]${c2 > 1 ? `<sub>${c2}</sub>` : ''}
                   </div>`;
            } else {
                visualTitle = 'Estructura de Lewis ideal:';
                visualBlock = generateStaticLewisHTML(currentScenario);
            }

            const realData = getRealNumericalProperties(currentScenario);
            const exceptionMsg = getExceptionText(currentScenario.form);
            const exceptionHtml = exceptionMsg ? `
                <div class="mt-4 bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm text-sm text-amber-900 leading-relaxed font-sans">
                    ${exceptionMsg}
                </div>
            ` : '';
            
            // Obtenemos la foto o el icono para la Polaroid
            const photoBlock = getMacroscopicImage(currentScenario, qualExpected.state);

            safeSetTimeout(() => {
                stageContent.innerHTML = `
                    <div class="fade-in w-full text-left bg-white p-4 overflow-y-auto max-h-[500px]">
                        <h3 class="text-xl font-bold text-slate-800 mb-1 pb-2 border-b-2 border-indigo-500 font-sans">Resolución Final: ${currentScenario.desc}</h3>
                        
                        <div class="text-sm bg-slate-50 p-3 rounded border border-slate-200 mb-1 font-mono text-slate-700">
                            ${reasoning}
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm mb-1.5 font-sans">
                            <div>
                                <p><span class="font-semibold text-indigo-600">Tipo de sustancia:</span> <br> ${sustType}</p>
                            </div>
                            <div>
                                <p><span class="font-semibold text-indigo-600">Estructura microscópica:</span> <br> ${microType}</p>
                            </div>
                            <div class="md:col-span-2">
                                <p><span class="font-semibold text-indigo-600">Masa ${isIonic || (isCovalentAtomic && !isHomo) ? 'fórmula' : (isMetallic || isNone || (isCovalentAtomic && isHomo) ? 'atómica' : 'molecular')} (${isMetallic || isNone || (isCovalentAtomic && isHomo) ? '<i>A</i><sub>r</sub>' : '<i>M</i><sub>r</sub>'}):</span> <br> 
                                ${isNone || isMetallic || (isCovalentAtomic && isHomo) ? '' : massStr + ' = '}<b>${formattedTotal} u</b></p>
                            </div>
                        </div>

                        <!-- FICHA COMPARA DE PROPIEDADES REALES -->
                        <div class="mb-1.5 font-sans">
                            <h4 class="font-bold text-slate-700 mb-1.5 border-b pb-1 text-sm"><i class="fas fa-microscope mr-2 text-indigo-500"></i>Ficha de Propiedades Físicas Reales</h4>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs border-collapse text-slate-800 font-sans">
                                    <thead>
                                        <tr class="bg-indigo-50 text-indigo-950 font-bold">
                                            <th class="p-2 border">Propiedad Física</th>
                                            <th class="p-2 border">Regla General Deducida</th>
                                            <th class="p-2 border bg-emerald-50 text-emerald-950 font-bold">Valor Específico Real (${formatChemicalFormulaHTML(currentScenario.form)})</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-slate-700">
                                        <tr>
                                            <td class="p-2 border font-bold">Estado físico (Tª ambiente)</td>
                                            <td class="p-2 border">${expectedValueState}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${qualExpected.state}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Punto de Fusión (PF)</td>
                                            <td class="p-2 border">${qualExpected.qualMelting}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${realData.m}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Punto de Ebullición (PE)</td>
                                            <td class="p-2 border">${qualExpected.qualBoiling}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${realData.b}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Conductividad (sólido)</td>
                                            <td class="p-2 border">${expectedValueCondS}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${currentScenario.type === 'metallic' ? 'Muy conductor (Mar de e⁻)' : 'Aislante (No conduce)'}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Conductividad (líquido o disolución acuosa)</td>
                                            <td class="p-2 border">${expectedValueCondL}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${(currentScenario.type === 'metallic' || currentScenario.type === 'ionic') ? 'Buen conductor por electrones deslocalizados' : 'Aislante (No conduce)'}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Solubilidad en Agua (Polar)</td>
                                            <td class="p-2 border">${expectedValueSolWater}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${realData.sol}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Solubilidad en Apolares (ej. Hexano)</td>
                                            <td class="p-2 border">${expectedValueSolApolar}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${qualExpected.solApolar === 'soluble' ? 'Muy soluble' : 'Insoluble'}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Tenacidad (Comportamiento a golpes)</td>
                                            <td class="p-2 border">${expectedValueToughText}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${expectedValueToughText}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Ductilidad y Maleabilidad</td>
                                            <td class="p-2 border">${expectedValueDuctText}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${expectedValueDuctText}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Dureza (Resistencia al rayado)</td>
                                            <td class="p-2 border">${expectedValueHardText}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${expectedValueHardText}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Conductividad Térmica</td>
                                            <td class="p-2 border">${expectedValueThermText}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${expectedValueThermText}</td>
                                        </tr>
                                        <tr>
                                            <td class="p-2 border font-bold">Aspecto visual y Brillo</td>
                                            <td class="p-2 border">${expectedValueOpticText}</td>
                                            <td class="p-2 border bg-emerald-50/30 font-semibold text-emerald-800">${expectedValueOpticText}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            ${exceptionHtml}
                        </div>

                        <div class="text-center mt-6 flex flex-col items-center">
                            <h4 class="font-semibold text-slate-600 mb-1">${visualTitle}</h4>
                            ${visualBlock}
                            <div class="mt-8 bg-indigo-50 px-8 py-1.5 rounded-xl border border-indigo-200 shadow-sm min-w-[200px]">
                                <span class="text-xs font-bold text-indigo-500 uppercase tracking-wider block mb-1">${formulaTypeStr}</span>
                                <span class="text-4xl font-serif font-bold text-indigo-900">${formatHtml}</span>
                            </div>
                            
                            <!-- IMAGEN REAL O REPRESENTATIVA / ASPECTO MACROSCÓPICO -->
                            <div class="mt-8 mb-1 flex justify-center w-full">
                                <div class="bg-white p-3 shadow-lg border border-slate-200 rounded-xl max-w-[340px] w-full relative group">
                                    <div class="absolute -top-3 -left-3 w-8 h-8 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-camera text-slate-300 text-2xl"></i></div>
                                    <div class="bg-slate-100 h-56 w-full flex items-center justify-center overflow-hidden rounded-lg border border-slate-200">
                                        ${photoBlock}
                                    </div>
                                    <div class="mt-4 mb-1 text-center text-lg text-slate-600 font-serif italic">
                                        Imagen real o representativa / aspecto macroscópico (${formatChemicalFormulaHTML(currentScenario.form)})
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                `;

                addTutorMessage("He generado el reporte completo con la ficha de propiedades en la pizarra. ¡Revísalo! Cuando estés listo, haz clic en \"Nuevo Par\" arriba para otro desafío.");
            }, 1000);
        }

        // --- MANEJADORES DEL CONSTRUCTOR DRAG & DROP Y UTILIDADES ---
        window.handleDragStart = function(ev, id) {
            ev.dataTransfer.setData("text/plain", id);
        };
        window.allowDrop = function(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        };
        window.dragLeave = function(ev) {
            ev.currentTarget.classList.remove('drag-over');
        };
        window.handleDropEvent = function(ev, targetPos) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            
            const draggedId = ev.dataTransfer.getData("text/plain");
            if (!draggedId) return;

            const atomObj = builderState.allAtoms.find(a => a.id === draggedId);
            if (!atomObj) return;

            let oldPos = null;
            builderState.inventory = builderState.inventory.filter(a => a.id !== draggedId);
            for (let key of ['center', 0, 1, 2, 3]) {
                if (builderState.placed[key] && builderState.placed[key].id === draggedId) {
                    oldPos = key;
                    builderState.placed[key] = null;
                    break;
                }
            }

            if (oldPos !== null && oldPos !== 'center') builderState.bonds[oldPos] = 0; 
            if (oldPos === 'center') builderState.bonds = [0,0,0,0];

            if (targetPos === 'inventory') {
                builderState.inventory.push(atomObj);
            } else {
                const existing = builderState.placed[targetPos];
                if (existing) builderState.inventory.push(existing);
                builderState.placed[targetPos] = atomObj;
            }
            renderBuilderUI();
        };

        window.cycleBond = function(index) {
            if (!builderState.placed['center'] || !builderState.placed[index]) return; 
            builderState.bonds[index] = (builderState.bonds[index] + 1) % 4; 
            renderBuilderUI();
        };

        window.cycleLp = function(pos) {
            let maxLp = 0;
            const diatomicCap = getDiatomicLonePairCap(pos);
            if (diatomicCap !== null) {
                maxLp = diatomicCap;
            } else if (pos === 'center') {
                const occupiedDirs = [0, 1, 2, 3].reduce((acc, idx) => acc + (builderState.placed[idx] ? 1 : 0), 0);
                maxLp = Math.max(0, 4 - occupiedDirs);
            } else {
                maxLp = builderState.placed[pos] ? 3 : 0;
            }
            builderState.lp[pos] = (builderState.lp[pos] + 1) % (maxLp + 1);
            renderBuilderUI();
        };
        
        window.resetLewisBoard = function() {
            const b = currentScenario.builder;
            builderState.allAtoms = [];
            let aId = 0;
            builderState.allAtoms.push({ id: `a${aId++}`, sym: b.center });
            b.periph.forEach(sym => { builderState.allAtoms.push({ id: `a${aId++}`, sym: sym }); });
            
            builderState.inventory = [...builderState.allAtoms];
            builderState.placed = { center: null, 0: null, 1: null, 2: null, 3: null };
            builderState.bonds = [0, 0, 0, 0];
            builderState.lp = { center: 0, 0: 0, 1: 0, 2: 0, 3: 0 };
            renderBuilderUI();
        };

        // --- INICIALIZAR AL CARGAR ---
        window.onload = () => {
            fillScenarioSelector();
            initSimulation();
        };
    </script>
</body>
</html
