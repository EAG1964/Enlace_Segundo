<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace Químico y Sustancias Químicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos para el Constructor Interactivo Drag & Drop y el Informe Final */
        .lewis-board {
            display: grid;
            grid-template-columns: 42px 32px 42px 32px 42px;
            grid-template-rows: 42px 32px 42px 32px 42px;
            gap: 3px;
            background: #ffffff;
            padding: 0.8rem;
            border-radius: 1rem;
            border: 2px dashed #cbd5e1;
            margin: 0 auto;
        }
        .lewis-cell { display: flex; align-items: center; justify-content: center; }
        .atom-box {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            font-weight: bold; font-size: 1.05rem;
            line-height: 1; /* Centrado óptico de la fuente */
            position: relative;
            user-select: none;
            color: #1e293b;
        }
        
        /* Zona de drop */
        .dropzone { border: 2px dashed #94a3b8; background: #f8fafc; transition: all 0.2s; }
        .dropzone.drag-over { background: #e0e7ff; border-color: #6366f1; transform: scale(1.05); }
        
        /* Átomos arrastrables */
        .draggable-atom {
            cursor: grab;
            background: #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s;
        }
        .draggable-atom:active { cursor: grabbing; transform: scale(0.95); }
        
        .center-atom-placed { background: #e0e7ff; border-color: #818cf8; cursor: pointer; }
        .center-atom-placed:active { transform: scale(0.95); }
        
        .periph-atom-placed { background: #f8fafc; border-color: #94a3b8; cursor: pointer; }
        .periph-atom-placed:active { transform: scale(0.95); }

        /* Enlaces Perfectamente Centrados */
        .bond-box { background: transparent; border-radius: 4px; user-select: none; transition: background 0.2s;}
        .bond-box-active { cursor: pointer; background: #f1f5f9; }
        .bond-box-active:hover { background: #e2e8f0; }
        .bond-h { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: stretch; padding: 0 3px; gap: 3px; }
        .bond-v { width: 100%; height: 100%; display: flex; flex-direction: row; justify-content: center; align-items: stretch; padding: 3px 0; gap: 3px; }
        .bond-line-h { height: 3px; background-color: #3b82f6; border-radius: 9999px; width: 100%; }
        .bond-line-v { width: 3px; background-color: #3b82f6; border-radius: 9999px; height: 100%; }

        /* Pares Solitarios */
        .lp-dot {
            position: absolute; color: #ef4444; font-size: 1.15rem; line-height: 0;
            letter-spacing: 1px; font-weight: bold; pointer-events: none;
        }
        
        /* Auto Scroll */
        html { scroll-behavior: smooth; }

        /* Licencia y Badge */
        .licencia-bloque { margin-top: 6px; background: #f1f5f9; color: #475569; font-size: 12px; text-align: center; border-radius: 8px; padding: 6px; border: 1px solid #e2e8f0; width: 100%; }
        .badge-container { margin-bottom: 3px; display: flex; justify-content: center; align-items: center; }

        /* Evita que los formularios largos oculten el botón de comprobación */
        #input-area {
            max-height: 55%;
            overflow-y: auto;
            flex-shrink: 0;
        }
    
        /* Compactación específica del bloque inferior derecho de actividades */
        #input-area {
            padding-top: 0.35rem !important;
            padding-bottom: 0.35rem !important;
        }
        #input-area > div {
            gap: 0.35rem !important;
        }
        #input-area .bg-slate-50,
        #input-area .bg-white {
            padding-top: 0.35rem !important;
            padding-bottom: 0.35rem !important;
        }
        #input-area label {
            margin-bottom: 0.15rem !important;
        }
        #input-area select,
        #input-area input[type="text"],
        #input-area input[type="number"] {
            padding-top: 0.25rem !important;
            padding-bottom: 0.25rem !important;
            min-height: 1.9rem !important;
        }
        #input-area button {
            padding-top: 0.4rem !important;
            padding-bottom: 0.4rem !important;
            min-height: 2rem !important;
        }
        #input-area .space-y-1 > :not([hidden]) ~ :not([hidden]),
        #input-area .space-y-1 > :not([hidden]) ~ :not([hidden]),
        #input-area .space-y-1 > :not([hidden]) ~ :not([hidden]) {
            margin-top: 0.35rem !important;
        }
        #input-area .grid {
            gap: 0.4rem !important;
        }
        #input-area .ml-4,
        #input-area .ml-5 {
            margin-left: 0.9rem !important;
        }

    
        /* Compactación específica de la actividad P/G/Configuración orbital */
        #input-area [data-activity="electron-config"] {
            gap: 0.3rem !important;
        }
        #input-area [data-activity="electron-config"] .ec-card {
            padding-top: 0.28rem !important;
            padding-bottom: 0.28rem !important;
        }
        #input-area [data-activity="electron-config"] .ec-grid {
            gap: 0.35rem !important;
        }
        #input-area [data-activity="electron-config"] label {
            margin-bottom: 0.05rem !important;
            line-height: 1.05 !important;
        }
        #input-area [data-activity="electron-config"] input {
            padding-top: 0.18rem !important;
            padding-bottom: 0.18rem !important;
            min-height: 1.55rem !important;
            height: 1.55rem !important;
        }
        #input-area [data-activity="electron-config"] button {
            padding-top: 0.35rem !important;
            padding-bottom: 0.35rem !important;
            min-height: 1.85rem !important;
        }

    
        /* Compactación extra de burbujas del chat del tutor */
        #chat-box > div {
            margin-bottom: 0.15rem !important;
        }
        #chat-box > div > div {
            padding-top: 0.25rem !important;
            padding-bottom: 0.25rem !important;
            line-height: 1.18 !important;
        }

    
        /* Ajuste global para que los bloques izquierdo y derecho quepan mejor al 100% */
        @media (min-width: 768px) {
            .md\:w-3\/5.bg-white,
            .md\:w-2\/5.bg-slate-100 {
                height: min(590px, calc(100vh - 105px)) !important;
            }
        }
        #stage-content {
            min-height: 0 !important;
        }
        #stage-content > div {
            max-height: 100% !important;
        }
        #stage-content svg {
            max-height: 295px !important;
        }
        #chat-box {
            min-height: 0 !important;
        }
        #input-area {
            max-height: 365px !important;
            overflow-y: auto !important;
        }
        .licencia-bloque {
            padding-top: 0.35rem !important;
            padding-bottom: 0.35rem !important;
        }

    
        /* Modelo 3D microscópico didáctico */
        .micro3d-card {
            width: 100%;
            max-width: 610px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
            padding: 0.65rem;
            margin: 0 auto;
        }
        .micro3d-title {
            font-weight: 800;
            color: #334155;
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .micro3d-subtitle {
            font-size: 0.73rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 0.12rem;
        }
        .micro3d-svg {
            width: 100%;
            max-height: 350px;
            overflow: visible;
        }
        .micro3d-vibrate { animation: microVibrate 1.25s ease-in-out infinite alternate; transform-origin: center; }
        .micro3d-float-a { animation: microFloatA 4.2s ease-in-out infinite alternate; }
        .micro3d-float-b { animation: microFloatB 4.8s ease-in-out infinite alternate; }
        .micro3d-float-c { animation: microFloatC 5.2s ease-in-out infinite alternate; }
        .micro3d-rotate { animation: microRotate 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
        .micro3d-electron { animation: microElectron 3.2s lineal infinite; }
        .micro3d-electron2 { animation: microElectron2 3.8s lineal infinite; }
        .micro3d-pulse { animation: microPulse 1.5s ease-in-out infinite alternate; }
        @keyframes microVibrate { from { transform: translate(-1px, 0.5px); } to { transform: translate(1px, -0.5px); } }
        @keyframes microFloatA { from { transform: translate(-8px, 3px); } to { transform: translate(10px, -6px); } }
        @keyframes microFloatB { from { transform: translate(8px, -2px); } to { transform: translate(-9px, 5px); } }
        @keyframes microFloatC { from { transform: translate(-3px, -6px); } to { transform: translate(5px, 7px); } }
        @keyframes microRotate { from { transform: rotate(-5deg) translateY(1px); } to { transform: rotate(5deg) translateY(-1px); } }
        @keyframes microElectron { from { transform: translateX(-50px); opacity: 0.4; } 50% { opacity: 1; } to { transform: translateX(58px); opacity: 0.45; } }
        @keyframes microElectron2 { from { transform: translate(48px, -3px); opacity: 0.45; } 50% { opacity: 1; } to { transform: translate(-55px, 5px); opacity: 0.45; } }
        @keyframes microPulse { from { opacity: 0.35; } to { opacity: 0.85; } }

    
        /* Visor Three.js real para modelos microscópicos 3D */
        .micro3d-three-card {
            width: 100%;
            max-width: 520px;
            background: #020617;
            background: #020617;
            background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
            padding: 0.26rem 0.26rem 0.18rem;
            margin: 0 auto;
            color: #ffffff;
        }
        .micro3d-three-title {
            text-shadow: 0 1px 1px rgba(0,0,0,0.28);
            text-align: center;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.05;
            margin-bottom: 0.05rem; font-size: 1.02rem;
        }
        .micro3d-three-subtitle {
            text-shadow: 0 1px 1px rgba(0,0,0,0.22);
            text-align: center;
            font-size: 0.76rem;
            color: #e2e8f0;
            margin-bottom: 0.12rem;
        }

        .micro3d-three-title,
        .micro3d-three-subtitle {
            background: #020617 !important;
            color: #ffffff !important;
            opacity: 1 !important;
            position: relative;
            z-index: 2;
        }
        .micro3d-three-subtitle {
            color: #e2e8f0 !important;
        }
        #micro3d-three-container {
            width: 100%;
            height: 455px;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #0a1128;
            border: 1px solid rgba(255,255,255,0.12);
            position: relative;
            touch-action: none;
        }
        .micro3d-overlay {
            position: absolute;
            left: 8px;
            top: 8px;
            background: rgba(15,23,42,0.72);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.55rem;
            padding: 0.24rem 0.36rem;
            font-size: 0.67rem;
            line-height: 1.05;
            max-width: 58%;
            pointer-events: none;
        }
        
        .micro3d-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.22rem 0.45rem;
            margin-top: 0.06rem;
            font-size: 0.66rem;
            color: #334155;
        }
        .micro3d-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            padding: 0.10rem 0.38rem 0.10rem 0.20rem;
            line-height: 1;
        }
        .micro3d-legend-dot {
            width: 0.74rem;
            height: 0.74rem;
            border-radius: 999px;
            border: 1px solid rgba(15,23,42,0.18);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.55);
            flex: 0 0 auto;
        }

        .micro3d-note {
            display: none;
        }
        .micro3d-unit-lewis {
            margin: 0.25rem auto 0.45rem auto;
            width: fit-content;
            max-width: 100%;
            background: rgba(248,250,252,0.96);
            border: 1px solid #cbd5e1;
            border-radius: 0.8rem;
            padding: 0.22rem 0.32rem 0.18rem;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(15,23,42,0.10);
        }
        .micro3d-unit-lewis-title {
            text-align: center;
            font-size: 0.68rem;
            line-height: 1.05;
            color: #475569;
            font-weight: 700;
            margin-bottom: 0.16rem;
        }
        .micro3d-unit-lewis .lewis-board {
            transform: scale(0.76);
            transform-origin: top center;
            margin: -0.45rem -0.55rem -0.58rem;
        }

    
        /* Scroll y compactación de la ficha de propiedades físicas en la pizarra */
        #stage-content {
            min-height: 0 !important;
        }
        #stage-content .physical-props-card {
            max-height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            padding-right: 0.4rem !important;
        }
        #stage-content .physical-props-card select {
            min-height: 1.85rem !important;
            padding-top: 0.2rem !important;
            padding-bottom: 0.2rem !important;
        }
        #stage-content .physical-props-card label {
            line-height: 1.1 !important;
        }

    
        /* Chat del tutor: texto alineado a la izquierda */
        #chat-box > div > div {
            text-align: left !important;
        }

    
        /* Lewis compacto: evita scroll en la pizarra durante el constructor */
        .lewis-stage-compact {
            max-height: 100%;
            overflow: hidden;
        }
        .lewis-stage-compact .lewis-board {
            transform: scale(0.96);
            transform-origin: center center;
        }

    
        .micro3d-overlay:empty {
            display: none;
        }

    
        .micro3d-three-card.micro3d-diamond-compact {
            padding: 0.22rem !important;
            max-width: 520px;
        }
        .micro3d-diamond-compact .micro3d-three-title {
            text-shadow: 0 1px 1px rgba(0,0,0,0.28);
            font-size: 0.86rem !important;
            line-height: 1.05 !important;
            margin-bottom: 0.02rem !important;
        }
        .micro3d-diamond-compact .micro3d-three-subtitle {
            text-shadow: 0 1px 1px rgba(0,0,0,0.22);
            font-size: 0.66rem !important;
            line-height: 1.05 !important;
            margin-bottom: 0.16rem !important;
        }
        .micro3d-diamond-compact .micro3d-legend {
            margin-top: 0.12rem !important;
            gap: 0.15rem 0.35rem !important;
            font-size: 0.66rem !important;
        }
        .micro3d-diamond-compact .micro3d-legend-dot {
            width: 0.62rem !important;
            height: 0.62rem !important;
        }
        .micro3d-diamond-compact .micro3d-legend-item {
            padding: 0.08rem 0.32rem 0.08rem 0.18rem !important;
        }
        .micro3d-diamond-compact .micro3d-note {
            display: none !important;
        }

    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-3 shadow-sm text-center">
        <h1 class="text-2xl font-bold"><i class="fas fa-flask mr-2"></i> Enlace Químico y Sustancias Químicas</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 max-w-5xl flex flex-col gap-6 mt-4">
        
        <div class="flex flex-col md:flex-row gap-2">
            <!-- Pizarra (Stage) -->
            <div class="flex-grow md:w-3/5 bg-white rounded-xl shadow-lg border border-slate-200 p-6 flex flex-col">
                <div class="flex flex-col space-y-4 mb-1.5 pb-2 border-b border-slate-100">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-slate-700">Pizarra de Trabajo</h2>
                        <div class="flex space-x-2">
                            <button onclick="resetCurrentSimulation()" class="text-sm bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-1 px-3 rounded-full transition-colors border border-amber-300 shadow-sm flex items-center" title="Reiniciar el par actual desde cero">
                                <i class="fas fa-undo mr-1"></i> Reiniciar
                            </button>
                            <button onclick="initSimulation()" class="text-sm bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold py-1 px-3 rounded-full transition-colors border border-indigo-300 shadow-sm flex items-center" title="Generar un nuevo par de elementos aleatorio">
                                <i class="fas fa-random mr-1"></i> Nuevo Par
                            </button>
                        </div>
                    </div>
                    
                    <!-- Selector Desplegable de Escenarios -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center space-y-1 sm:space-y-0 sm:space-x-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider"><i class="fas fa-list mr-1"></i> Elegir caso de estudio:</label>
                        <select id="scenarioSelector" onchange="selectSpecificScenario(this.value)" class="flex-grow w-full border border-slate-300 rounded p-1.5 text-xs bg-white text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- Generado dinámicamente -->
                        </select>
                    </div>
                </div>
                
                <div id="stage-content" class="flex-grow flex flex-col items-center justify-center text-center overflow-y-auto overflow-x-hidden">
                    <!-- Atoms will be injected here -->
                </div>
            </div>

            <!-- Tutor Chat (Interaction) -->
            <div class="md:w-2/5 bg-slate-100 rounded-xl shadow-inner border border-slate-200 flex flex-col overflow-hidden h-[590px]">
                <div class="bg-slate-200 px-3 py-0.5 border-b border-slate-300 font-semibold text-slate-700 flex items-center">
                    <i class="fas fa-robot text-indigo-500 mr-2 text-xl"></i> Tutor Químico
                </div>
                <div id="chat-box" class="flex-grow overflow-y-auto px-1.5 py-0.5 space-y-0.5 relative scroll-smooth">
                    <!-- Chat messages injected here -->
                </div>
                <div id="input-area" class="px-1.5 py-0.5 bg-white border-t border-slate-200">
                    <!-- Interactive inputs injected here -->
                </div>
            </div>
        </div>

        <!-- Licencia y Contador Global de Visitas -->
        <div class="licencia-bloque shadow-sm mt-0.5">
            <div class="badge-container">
                <img src="https://visitor-badge.laobi.icu/badge?page_id=EAG1964.phychem.lab&left_text=Visitas&left_color=gray&right_color=blue" alt="Visitas">
            </div>
            Autor: <strong>EAG1964</strong> | 2026 | <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es" target="_blank" class="text-indigo-600 font-semibold hover:underline">CC BY-NC-SA 4.0</a>
        </div>

    </main>

    <script>
        // --- GESTIÓN DE TIMEOUTS SEGUROS ---
        let activeTimeouts = [];
        
        function safeSetTimeout(callback, delay) {
            const id = setTimeout(() => {
                activeTimeouts = activeTimeouts.filter(t => t !== id);
                callback();
            }, delay);
            activeTimeouts.push(id);
            return id;
        }

        function clearAllTimeouts() {
            activeTimeouts.forEach(clearTimeout);
            activeTimeouts = [];
        }

        // --- REFERENCIAS DOM ---
        const stageContent = document.getElementById('stage-content');
        const chatBox = document.getElementById('chat-box');
        const inputArea = document.getElementById('input-area');

        // --- FUNCIONES DE CHAT Y AUTODESPLAZAMIENTO ---
        function scrollToBottom() {
            if (!chatBox) return;
            const scroll = () => {
                chatBox.scrollTop = chatBox.scrollHeight;
            };
            requestAnimationFrame(scroll);
            setTimeout(scroll, 50);
            setTimeout(scroll, 200);
            setTimeout(scroll, 500);
        }

        // Observador para scroll automático en TODOS los pasos y cambios
        if (chatBox && inputArea) {
            const scrollObserver = new MutationObserver(() => {
                scrollToBottom();
            });
            scrollObserver.observe(chatBox, { childList: true, subtree: true });
            scrollObserver.observe(inputArea, { childList: true, subtree: true });
        }

        // --- RESPUESTA DE USUARIO ---
        function addUserMessage(text) {
            if (!chatBox) return;
            chatBox.innerHTML += `
                <div class="flex justify-end fade-in mb-0.5">
                    <div class="bg-indigo-100 text-indigo-900 rounded-tl-md rounded-tr-md rounded-bl-md px-2 py-1 w-[98%] shadow-sm text-sm break-words font-sans text-left leading-tight">
                        ${text}
                    </div>
                </div>
            `;
        }

        // --- RESPUESTA DEL TUTOR ---
        function addTutorMessage(text) {
            if (!chatBox) return;
            chatBox.innerHTML += `
                <div class="flex justify-start fade-in mb-0.5">
                    <div class="bg-white border border-slate-200 text-slate-800 rounded-tr-md rounded-br-md rounded-bl-md px-2 py-1 w-[98%] shadow-sm text-sm break-words font-sans text-left leading-tight">
                        ${text}
                    </div>
                </div>
            `;
        }

        function showContinueButton(nextAction, label = 'Seguir') {
            if (!inputArea) return;
            inputArea.innerHTML = `
                <div class="flex flex-col fade-in font-sans space-y-1">
                    <button onclick="${nextAction}" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded shadow-md transition-colors font-sans">
                        ${label}
                    </button>
                </div>
            `;
        }

        // --- BASE DE DATOS DE ELEMENTOS Y ESCENARIOS ---
        const elementsDB = {
            // Metales Alcalinos (Grupo 1)
            'Li': { z: 3, sym: 'Li', name: 'Litio', type: 'metal', p: 2, g: 1, val: 1, unpaired: 1, conf: '1s² 2s¹', mass: 6.94 },

        function fillScenarioSelector() {

                if (groups[groupKey]) {

                }
            });

            const defaultOpt = document.createElement('option');
            defaultOpt.value = 'random';
            defaultOpt.textContent = 'Seleccionar un caso aleatorio';
            selector.appendChild(defaultOpt);

            Object.keys(groups).forEach(key => {
                const optGroup = document.createElement('optgroup');
                optGroup.label = groups[key].label;
                
                groups[key].items.forEach(item => {
                    const option = document.createElement('option');

                    optGroup.appendChild(option);
                });
                
                selector.appendChild(optGroup);
            });
        }

        // --- GESTIÓN DE ENLACES DE LEWIS MÓVILES ---
        window.handleDragStart = function(ev, id) {
            ev.dataTransfer.setData("text/plain", id);
        };
        window.allowDrop = function(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        };
        window.dragLeave = function(ev) {
            ev.currentTarget.classList.remove('drag-over');
        };
        window.handleDropEvent = function(ev, targetPos) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            
            const draggedId = ev.dataTransfer.getData("text/plain");
            if (!draggedId) return;

            const atomObj = builderState.allAtoms.find(a => a.id === draggedId);
            if (!atomObj) return;

            let oldPos = null;
            builderState.inventory = builderState.inventory.filter(a => a.id !== draggedId);
            for (let key of ['center', 0, 1, 2, 3]) {
                if (builderState.placed[key] && builderState.placed[key].id === draggedId) {
                    oldPos = key;
                    builderState.placed[key] = null;
                    break;
                }
            }

            if (oldPos !== null && oldPos !== 'center') builderState.bonds[oldPos] = 0; 
            if (oldPos === 'center') builderState.bonds = [0,0,0,0];

            if (targetPos === 'inventory') {
                builderState.inventory.push(atomObj);
            } else {
                const existing = builderState.placed[targetPos];
                if (existing) builderState.inventory.push(existing);
                builderState.placed[targetPos] = atomObj;
            }
            renderBuilderUI();
        };

        window.cycleBond = function(index) {
            if (!builderState.placed['center'] || !builderState.placed[index]) return; 
            builderState.bonds[index] = (builderState.bonds[index] + 1) % 4; 
            renderBuilderUI();
        };

        window.cycleLp = function(pos) {
            let maxLp = 0;
            const diatomicCap = getDiatomicLonePairCap(pos);
            if (diatomicCap !== null) {
                maxLp = diatomicCap;
            } else if (pos === 'center') {
                const occupiedDirs = [0, 1, 2, 3].reduce((acc, idx) => acc + (builderState.placed[idx] ? 1 : 0), 0);
                maxLp = Math.max(0, 4 - occupiedDirs);
            } else {
                maxLp = builderState.placed[pos] ? 3 : 0;
            }
            builderState.lp[pos] = (builderState.lp[pos] + 1) % (maxLp + 1);
            renderBuilderUI();
        };
        
        window.resetLewisBoard = function() {
            const b = currentScenario.builder;
            builderState.allAtoms = [];
            let aId = 0;
            builderState.allAtoms.push({ id: `a${aId++}`, sym: b.center });
            b.periph.forEach(sym => { builderState.allAtoms.push({ id: `a${aId++}`, sym: sym }); });
            
            builderState.inventory = [...builderState.allAtoms];
            builderState.placed = { center: null, 0: null, 1: null, 2: null, 3: null };
            builderState.bonds = [0, 0, 0, 0];
            builderState.lp = { center: 0, 0: 0, 1: 0, 2: 0, 3: 0 };
            renderBuilderUI();
        };

        function initSimulation() {
            const randIndex = Math.floor(Math.random() * scenarios.length);
            currentScenario = scenarios[randIndex];
            
            const selector = document.getElementById('scenarioSelector');
            if (selector) selector.value = randIndex;
            
            startScenario();
        }

        function resetCurrentSimulation() {
            if (currentScenario) {
                startScenario();
            }
        }

        function startScenario() {
            clearAllTimeouts(); 
            chatBox.innerHTML = '';
            inputArea.innerHTML = '';
            currentStepAttempts = 0;
            
            const atom1 = elementsDB[currentScenario.e1];

            if (isHomo) {

        // --- SELECCIÓN DE TIPO DE ELEMENTO ---
        function stepElementType(a1, a2, prev1 = '', prev2 = '') {
            currentStepAttempts = (prev1 === '') ? 0 : currentStepAttempts;
            const isHomo = currentScenario.e1 === currentScenario.e2;
            
            if (prev1 === '') {
                addTutorMessage(`Antes de determinar el tipo de enlace, ¿puedes clasificar ${isHomo ? 'el elemento' : 'cada elemento'}?`);
            }
            
            let html = `<div class="flex flex-col space-y-4 fade-in">`;
            
            html += `

                            <option value="metal" ${prev2 === 'metal' ? 'selected' : ''}>Metal</option>
                            <option value="nonmetal" ${prev2 === 'nonmetal' ? 'selected' : ''}>No metal</option>
                            <option value="metalloid" ${prev2 === 'metalloid' ? 'selected' : ''}>Metaloide</option>

        function checkElementType() {
            const isHomo = currentScenario.e1 === currentScenario.e2;
            const t1 = document.getElementById('elType1').value;
            const t2 = isHomo ? t1 : document.getElementById('elType2').value;

            if (!t1 || (!isHomo && !t2)) {
                addTutorMessage(`Por favor, selecciona una categoría ${isHomo ? 'para el elemento' : 'para ambos elementos'} antes de continuar.`);
                return;
            }

            currentStepAttempts++;
            const a1 = elementsDB[currentScenario.e1];
            const a2 = elementsDB[currentScenario.e2];
            
            const typeLabels = {
                'metal': 'Metal',
                'nonmetal': 'No metal',
                'metalloid': 'Metaloide',
                'noblegas': 'Gas noble'
            };

            inputArea.innerHTML = '';
            if(isHomo) {
                addUserMessage(`${a1.sym}: ${typeLabels[t1]}`);
            } else {
                addUserMessage(`${a1.sym}: ${typeLabels[t1]} | ${a2.sym}: ${typeLabels[t2]}`);
            }

            safeSetTimeout(() => {
                let errors = [];
                if (t1 !== a1.type) errors.push(`el <b>${a1.name}</b>`);
                if (!isHomo && t2 !== a2.type) errors.push(`el <b>${a2.name}</b>`);

                if (errors.length === 0) {
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Excelente!</b> Has clasificado correctamente ${isHomo ? 'el elemento' : 'ambos elementos'}.`);
                    if (currentScenario.type === 'none') {
                        stepValence(a1, a2); 
                    } else {
                        stepDetermineBond(); 
                    }
                } else {
                    if (currentStepAttempts >= 3) {
                        if(isHomo) {
                            addTutorMessage(`Has agotado tus 3 intentos. El ${a1.name} es un <b class="text-red-600 font-bold">${typeLabels[a1.type]}</b>.`);
                        } else {
                            addTutorMessage(`Has agotado tus 3 intentos. El ${a1.name} es un <b class="text-red-600 font-bold">${typeLabels[a1.type]}</b> y el ${a2.name} es un <b class="text-red-600 font-bold">${typeLabels[a2.type]}</b>.`);
                        }
                        safeSetTimeout(() => {
                            if (currentScenario.type === 'none') stepValence(a1, a2);
                            else stepDetermineBond();
                        }, 2500);
                    } else {
                        let hint = "Fíjate en su posición en la tabla periódica. Los metales están a la izquierda, los no metales a la derecha, los metaloides en la frontera diagonal y los gases nobles en la última columna.";
                        addTutorMessage(`Mmm, hay un error en la clasificación de ${errors.join(' y ')}. <br><br><b>Pista:</b> ${hint} ¡Inténtalo de nuevo!`);
                        stepElementType(a1, a2, t1, isHomo ? '' : t2);

        // --- DETERMINAR TIPO DE ENLACE ---
        function stepDetermineBond() {
            currentStepAttempts = 0;
            safeSetTimeout(() => {
                addTutorMessage(`Basándote en la clasificación que acabas de hacer, ¿qué <b>tipo de enlace</b> formarán?`);
                
                inputArea.innerHTML = `
                    <div class="flex flex-col space-y-1 fade-in font-sans">

            }, 1000);
        }

        function checkBond() {
            const selectEl = document.getElementById('bondTypeSelect');
            const selectedType = selectEl.value;

            if (!selectedType) {
                addTutorMessage("Por favor, selecciona una opción del menú desplegable antes de comprobar.");
                return;
            }

            inputArea.innerHTML = '';
            const bondLabels = {
                'ionic': 'Enlace Iónico',
                'covalent': 'Enlace Covalente',
                'metallic': 'Enlace Metálico',
                'none': 'No hay enlace'
            };
            
            const displaySelectedType = selectedType;
            addUserMessage(bondLabels[displaySelectedType] || "Covalente");
            currentStepAttempts++;

            const a1 = elementsDB[currentScenario.e1];
            const a2 = elementsDB[currentScenario.e2];
            const isHomo = currentScenario.e1 === currentScenario.e2;
            const isMetal1 = a1.type === 'metal';
            const isMetal2 = a2.type === 'metal';
            
            let actualType = '';
            if (a1.type === 'noblegas' || a2.type === 'noblegas') actualType = 'none';
            else if (isMetal1 && isMetal2) actualType = 'metallic';
            else if (isMetal1 !== isMetal2) actualType = 'ionic';
            else actualType = 'covalent';

            const isCorrectBond = (selectedType === 'covalent' && (currentScenario.type === 'covalent' || currentScenario.type === 'covalent_atomic')) ||
                                 (selectedType === currentScenario.type);

            safeSetTimeout(() => {
                if (isCorrectBond) {
                    if (currentScenario.type === 'none') {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Correcto!</b> Es un caso de <b class="text-red-600 font-bold">${bondLabels[selectedType]}</b>, ya que al tener su última capa completa, con ${a1.val} e⁻ de valencia, posee una <b>configuración electrónica estable</b> y no necesita unirse a otros átomos.`);
                    } else {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Correcto!</b> Es un caso de <b class="text-red-600 font-bold">${bondLabels[selectedType]}</b>.`);
                    }
                    
                    if (currentScenario.type === 'none') {
                        safeSetTimeout(() => stepAtomsBalance(a1, a2), 2500); 
                    } else {
                        stepValence(a1, a2);
                    }
                } else {
                    if (currentStepAttempts >= 3) {
                        let reason = "";
                        if (actualType === 'none') {
                            reason = "porque los gases nobles ya cumplen con la regla del octeto (o dueto para el Helio) al tener los electrones necesarios en su última capa para ser totalmente estables";
                        } else if (actualType === 'metallic') {
                            reason = "porque es la unión masiva entre átomos de un mismo metal";
                        } else if (currentScenario.type === 'covalent_atomic') {
                            reason = "porque es la unión entre no metales/metaloides que compartirán electrones, aunque en este caso se extiendan formando una red gigante";
                        } else if (isHomo) {
                            reason = "porque es la unión entre átomos del mismo no metal";
                        } else if (actualType === 'ionic') {
                            reason = `porque es la unión entre un metal (${isMetal1 ? a1.name : a2.name}) y un no metal (${!isMetal1 ? a1.name : a2.name})`;
                        } else {
                            reason = "porque es la unión entre dos no metales (o un no metal y un metaloide)";
                        }
                        const expectedLabel = (currentScenario.type === 'covalent_atomic') ? 'Enlace Covalente' : (bondLabels[currentScenario.type] || 'Enlace');
                        addTutorMessage(`Has agotado tus 3 intentos. La respuesta correcta es <b class="text-red-600 font-bold">${expectedLabel}</b>, ${reason}.`);
                        safeSetTimeout(() => {
                            if (currentScenario.type === 'none') stepAtomsBalance(a1, a2);
                            else stepValence(a1, a2);
                        }, 2500);
                    } else {
                        let hint = "";
                        if (currentStepAttempts === 1) {
                            hint = `No es correcto. Inténtalo de nuevo.`;
                        } else {
                            if (actualType === 'none') {
                                hint = `<b>Pista:</b> Recuerda que los gases nobles tienen una particularidad única con su última capa de electrones.`;
                            } else if (actualType === 'metallic') {
                                hint = `<b>Pista:</b> Recuerda cuál es el tipo de unión que se forma al agrupar átomos puros de un mismo metal.`;
                            } else if (currentScenario.type === 'covalent_atomic') {
                                hint = `<b>Pista:</b> Recuerda la unión entre no metales/metaloides como el carbono o silicio.`;
                            } else if (isHomo) {
                                hint = `<b>Pista:</b> Recuerda cuál es la unión entre átomos del mismo elemento no metálico.`;
                            } else {
                                hint = actualType === 'ionic' ? 
                                    `<b>Pista:</b> Recuerda cuál es la unión entre un metal (${isMetal1 ? a1.name : a2.name}) y un no metal (${!isMetal1 ? a1.name : a2.name}).` : 
                                    `<b>Pista:</b> Recuerda cuál es la unión entre dos no metales (o un no metal and un metaloide).`;
                            }

                        addTutorMessage(`${hint}`);
                        safeSetTimeout(() => {

                                    <select id="bondTypeSelect" class="border border-slate-300 rounded px-2 py-1 focus:ring-2 outline-none w-full text-sm bg-white text-slate-800">
                                        <option value="">Selecciona el tipo de enlace...</option>
                                        <option value="ionic" ${selectedType === 'ionic' ? 'selected' : ''}>Iónico</option>
                                        <option value="covalent" ${selectedType === 'covalent' ? 'selected' : ''}>Covalente</option>
                                        <option value="metallic" ${selectedType === 'metallic' ? 'selected' : ''}>Metálico</option>

                                </div>

        }

        // --- OBTENER VALENCIA Y CONFIGURACIÓN ---
        window.formatOrbitalNotation = function(el) {
            const map = {'0':'⁰', '1':'¹', '2':'²', '3':'³', '4':'⁴', '5':'⁵', '6':'⁶', '7':'⁷', '8':'⁸', '9':'⁹'};
            const unmap = {'⁰':'0', '¹':'1', '²':'2', '³':'3', '⁴':'4', '⁵':'5', '⁶':'6', '⁷':'7', '⁸':'8', '⁹':'9'};
            
            let val = el.value;
            // 1. Quitar todos los superíndices temporalmente para analizar la cadena limpia
            let unformatted = val.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, m => unmap[m]);
            
            // 2. Volver a aplicar superíndice SOLO a los números continuos que van detrás de s, p, d, f
            let formatted = unformatted.replace(/([spdf])(\d+)/gi, (match, p1, p2) => {
                let superscripts = p2.split('').map(d => map[d]).join('');
                return p1 + superscripts;
            });

            // 3. Reemplazar si hubo cambios manteniendo el cursor en su sitio
            if (val !== formatted) {
                const start = el.selectionStart;
                const end = el.selectionEnd;
                el.value = formatted;
                el.setSelectionRange(start, end);
            }
        };

                            </div>
                            <div class="md:col-span-2">
                                <label class="text-[14px] font-bold text-slate-500 mb-0.5 block">Conf. Orbital (ej: 1s² 2s²...):</label> 
                                <input type="text" id="conf1" value="${prev.conf1 || ''}" oninput="formatOrbitalNotation(this)" placeholder="1s² 2s² 2p⁶..." class="border border-slate-300 rounded p-1.5 w-full text-center focus:ring-2 outline-none bg-white text-slate-800 font-mono text-xs">

                            </div>

                                <input type="number" id="unp1" value="${prev.unp1 || ''}" min="0" max="7" class="border border-emerald-300 rounded p-1 w-full text-center focus:ring-2 outline-none bg-white text-slate-800 text-xs">
                            </div>

                    </div>
                `;

                if (!isHomo) {
                    html += `
                        <div class="bg-slate-50 p-3 rounded border border-slate-200">
                            <div class="font-bold text-teal-700 mb-1">${a2.sym} (Z = ${a2.z})</div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-1 text-slate-800">
                                <div>
                                    <label class="text-[14px] font-bold text-slate-500 mb-0.5 block">Periodo (P):</label> 
                                    <input type="number" id="p2" value="${prev.p2 || ''}" class="border border-slate-300 rounded p-1 w-full text-center focus:ring-2 outline-none bg-white text-slate-800 text-xs">

                                    <label class="text-[14px] font-bold text-slate-500 mb-0.5 block">Grupo (G):</label> 
                                    <input type="number" id="g2" value="${prev.g2 || ''}" class="border border-slate-300 rounded p-1 w-full text-center focus:ring-2 outline-none bg-white text-slate-800 text-xs">
                                </div>
                                <div class="md:col-span-2">
                                    <label class="text-[14px] font-bold text-slate-500 mb-0.5 block">Conf. Orbital (ej: 1s² 2s²...):</label> 
                                    <input type="text" id="conf2" value="${prev.conf2 || ''}" oninput="formatOrbitalNotation(this)" placeholder="1s² 2s² 2p⁶..." class="border border-slate-300 rounded p-1.5 w-full text-center focus:ring-2 outline-none bg-white text-slate-800 font-mono text-xs">
                                </div>
                                <div class="flex flex-col bg-red-50 p-1.5 rounded border border-red-200">
                                    <label class="font-bold text-red-600 text-[14px] mb-0.5 text-center">e⁻ valencia:</label> 
                                    <input type="number" id="val2" value="${prev.v2 || ''}" min="1" max="8" class="border border-red-300 rounded p-1 w-full text-center focus:ring-2 outline-none bg-white text-slate-800 text-xs">
                                </div>
                                <div class="flex flex-col bg-emerald-50 p-1.5 rounded border border-emerald-200">
                                    <label class="font-bold text-emerald-700 text-[14px] mb-0.5 text-center">e⁻ desap. (Hund):</label> 
                                    <input type="number" id="unp2" value="${prev.unp2 || ''}" min="0" max="7" class="border border-emerald-300 rounded p-1 w-full text-center focus:ring-2 outline-none bg-white text-slate-800 text-xs">
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `<div class="sticky bottom-0 bg-white pt-2 pb-1"><button onclick="checkValence()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded transition-colors font-sans shadow-md">Comprobar Datos</button></div></div>`;
                inputArea.innerHTML = html;
            }, 1000);
        }

        function getUnpairedSafe(el) {
            if (!el) return 0;
            if (typeof el.unpaired === 'number') return el.unpaired;
            // Seguridad para alcalinos ns¹: Li, Na, K, Rb, Cs, Fr.
            if (el.g === 1 && el.val === 1) return 1;
            return 0;
        }

        function checkValence() {
            const a1 = elementsDB[currentScenario.e1];
            const a2 = elementsDB[currentScenario.e2];
            const isHomo = currentScenario.e1 === currentScenario.e2;

            const rawP1 = document.getElementById('p1').value.trim();
            const rawG1 = document.getElementById('g1').value.trim();
            const rawConf1 = document.getElementById('conf1').value.trim();
            const rawV1 = document.getElementById('val1').value.trim();
            const rawUnp1 = document.getElementById('unp1').value.trim();

            const rawP2 = isHomo ? rawP1 : document.getElementById('p2').value.trim();
            const rawG2 = isHomo ? rawG1 : document.getElementById('g2').value.trim();
            const rawConf2 = isHomo ? rawConf1 : document.getElementById('conf2').value.trim();
            const rawV2 = isHomo ? rawV1 : document.getElementById('val2').value.trim();
            const rawUnp2 = isHomo ? rawUnp1 : document.getElementById('unp2').value.trim();

            if (!rawP1 || !rawG1 || !rawConf1 || !rawV1 || !rawUnp1 || (!isHomo && (!rawP2 || !rawG2 || !rawConf2 || !rawV2 || !rawUnp2))) {
                addTutorMessage("Por favor, rellena todos los campos antes de comprobar los datos.");
                return; 
            }

            currentStepAttempts++;

            const p1 = parseInt(rawP1) || 0;
            const g1 = parseInt(rawG1) || 0;
            const v1 = parseInt(rawV1) || 0;
            const unp1 = parseInt(rawUnp1) || 0;

            const p2 = isHomo ? p1 : (parseInt(rawP2) || 0);
            const g2 = isHomo ? g1 : (parseInt(rawG2) || 0);
            const v2 = isHomo ? v1 : (parseInt(rawV2) || 0);
            const unp2 = isHomo ? unp1 : (parseInt(rawUnp2) || 0);

            const cleanConf = (str) => {
                return str.toLowerCase().replace(/\s+/g, '')
                          .replace(/⁰/g, '0').replace(/¹/g, '1').replace(/²/g, '2').replace(/³/g, '3')
                          .replace(/⁴/g, '4').replace(/⁵/g, '5').replace(/⁶/g, '6').replace(/⁷/g, '7')
                          .replace(/⁸/g, '8').replace(/⁹/g, '9').replace(/\^/g, '');
            };
            
            const conf1 = cleanConf(rawConf1);
            const conf2 = cleanConf(rawConf2);
            const expectedConf1 = cleanConf(a1.conf);
            const expectedConf2 = cleanConf(a2.conf);

            inputArea.innerHTML = '';
            if (isHomo) {
                addUserMessage(`${a1.sym} -> P:${p1} | G:${g1} | Conf:${rawConf1} | Val:${v1} e⁻ | Desap:${unp1} e⁻`);
            } else {
                addUserMessage(`${a1.sym} -> P:${p1} | G:${g1} | Conf:${rawConf1} | Val:${v1} e⁻ | Desap:${unp1} e⁻`);
                addUserMessage(`${a2.sym} -> P:${p2} | G:${g2} | Conf:${rawConf2} | Val:${v2} e⁻ | Desap:${unp2} e⁻`);
            }

            safeSetTimeout(() => {
                let errors = [];
                let errA1 = [];
                let hasPeriodErr = false, hasGroupErr = false, hasConfErr = false, hasValErr = false, hasUnpErr = false;

                if (p1 !== a1.p) { errA1.push("periodo"); hasPeriodErr = true; }
                if (g1 !== a1.g) { errA1.push("grupo"); hasGroupErr = true; }
                if (conf1 !== expectedConf1) { errA1.push("configuración orbital"); hasConfErr = true; }
                if (v1 !== a1.val) { errA1.push("e⁻ de valencia"); hasValErr = true; }
                if (unp1 !== getUnpairedSafe(a1)) { errA1.push("e⁻ desapareados"); hasUnpErr = true; }
                if (errA1.length > 0) errors.push(`el <b class="text-red-600 font-bold">${a1.name}</b> (${errA1.join(', ')})`);

                if (!isHomo) {
                    let errA2 = [];
                    if (p2 !== a2.p) { errA2.push("periodo"); hasPeriodErr = true; }
                    if (g2 !== a2.g) { errA2.push("grupo"); hasGroupErr = true; }
                    if (conf2 !== expectedConf2) { errA2.push("configuración orbital"); hasConfErr = true; }
                    if (v2 !== a2.val) { errA2.push("e⁻ de valencia"); hasValErr = true; }
                    if (unp2 !== getUnpairedSafe(a2)) { errA2.push("e⁻ desapareados"); hasUnpErr = true; }
                    if (errA2.length > 0) errors.push(`el <b class="text-red-600 font-bold">${a2.name}</b> (${errA2.join(', ')})`);
                }

                if (errors.length === 0) {
                    addTutorMessage('<b class="text-red-600 font-bold">¡Impecable!</b> Has deducido correctamente la posición periódica, la configuración por orbitales y las propiedades de valencia y espín.');
                    if (currentScenario.type === 'none') {
                        stepDetermineBond(); 
                    } else {
                        stepElectrons(a1, a2); 
                    }
                } else {
                    if (currentStepAttempts >= 3) {
                        if (isHomo) {
                            addTutorMessage(`Has agotado tus 3 intentos. Los datos correctos son:<br><div class="mt-1 space-y-1"><b class="text-red-600 font-bold block">${a1.sym}: P:${a1.p}, G:${a1.g}, Conf: ${a1.conf}, ${a1.val} e⁻ val, ${getUnpairedSafe(a1)} e⁻ desap.</b></div>`);
                        } else {
                            addTutorMessage(`Has agotado tus 3 intentos. Los datos correctos son:<br><div class="mt-1 space-y-1"><b class="text-red-600 font-bold block">${a1.sym}: P:${a1.p}, G:${a1.g}, Conf: ${a1.conf}, ${a1.val} e⁻ val, ${getUnpairedSafe(a1)} e⁻ desap.</b><b class="text-red-600 font-bold block mt-1">${a2.sym}: P:${a2.p}, G:${a2.g}, Conf: ${a2.conf}, ${a2.val} e⁻ val, ${getUnpairedSafe(a2)} e⁻ desap.</b></div>`);
                        }
                        showContinueButton(currentScenario.type === 'none' ? 'stepDetermineBond()' : 'stepElectrons(elementsDB[currentScenario.e1], elementsDB[currentScenario.e2])', 'Seguir');
                        safeSetTimeout(() => {
                            if (inputArea && inputArea.querySelector('button')) return;
                            if (currentScenario.type === 'none') stepDetermineBond();
                            else stepElectrons(a1, a2);
                        }, 2500);
                    } else {
                        if (currentStepAttempts === 1) {
                            addTutorMessage(`Cuidado, hay algún error en ${errors.join(' y ')}. Revisa con calma la tabla periódica, el llenado cuántico de Moeller (Aufbau) y las reglas de espín.`);
                        } else {
                            let dynamicHints = [];
                            
                            if (hasPeriodErr) {
                                dynamicHints.push("• <b>Periodo:</b> El periodo (número de fila) corresponde al número cuántico principal (n) más alto ocupado por los electrones en la configuración.");
                            }
                            if (hasGroupErr) {
                                dynamicHints.push("• <b>Grupo:</b> Para los bloques s y p (representativos), el grupo se relaciona con los electrones de valencia (bloque s: g = e⁻ val; bloque p: g = 10 + e⁻ val; excepto el Helio que es grupo 18).");
                            }
                            if (hasConfErr) {
                                dynamicHints.push("• <b>Configuración orbital:</b> Asegúrate de que la suma de todos los superíndices (electrones) coincida exactamente con el número atómico Z. Llena en orden energético creciente: 1s, 2s, 2p, 3s, 3p, 4s, 3d...");
                            }
                            if (hasValErr) {
                                dynamicHints.push("• <b>e⁻ de valencia:</b> Suma únicamente los electrones que se encuentran en el nivel cuántico principal (n) más alto que hayas escrito.");
                            }
                            if (hasUnpErr) {
                                dynamicHints.push("• <b>e⁻ desapareados (Hund):</b> Dibuja las casillas cuánticas de la última subcapa (el subnivel s tiene 1 orbital, el subnivel p tiene 3 orbitales). Distribuye los electrones de uno en uno con espines paralelos antes de aparearlos.");
                            }

                            addTutorMessage(`Hay un error en ${errors.join(' y ')}. <br><br><b>Pistas del Tutor:</b> <br>${dynamicHints.join('<br>')}`);
                        }
                        
                        stepValence(a1, a2, { p1: rawP1, g1: rawG1, conf1: rawConf1, v1: rawV1, unp1: rawUnp1, p2: rawP2, g2: rawG2, conf2: rawConf2, v2: rawV2, unp2: rawUnp2 });
                    }
                }
            }, 800);
        }

        // --- DETERMINAR CAMBIOS EN ELECTRONES DE VALENCIA ---
        function stepElectrons(a1, a2, prev = {}) {
            if(Object.keys(prev).length === 0) currentStepAttempts = 0;
            const isHomo = currentScenario.e1 === currentScenario.e2;

            safeSetTimeout(() => {
                if (currentStepAttempts === 0) {
                    if (isHomo) {
                        addTutorMessage(`Aplicando la <b>Regla del Octeto (o Dueto)</b> para ser estables, ¿qué necesita hacer el elemento con sus electrones de valencia?`);
                    } else {
                        addTutorMessage(`Aplicando la <b>Regla del Octeto (o Dueto)</b> para ser estables, ¿qué necesita hacer cada átomo con sus electrones de valencia?`);
                    }
                }
                
                let html = `<div class="flex flex-col space-y-1 fade-in text-sm font-sans text-slate-800">`;
                
                html += `
                    <div class="bg-slate-50 p-3 rounded border border-slate-200">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <span class="font-bold text-indigo-700 w-8">${a1.sym}:</span>
                            <select id="action1" class="border border-slate-300 rounded p-1 flex-1 focus:ring-2 outline-none bg-white text-slate-800">
                                <option value="">Selecciona...</option>
                                <option value="pierde" ${prev.a1 === 'pierde' ? 'selected' : ''}>Pierde</option>
                                <option value="gana" ${prev.a1 === 'gana' ? 'selected' : ''}>Gana</option>
                                <option value="comparte" ${prev.a1 === 'comparte' ? 'selected' : ''}>Comparte</option>
                            </select>
                            <input type="number" id="ecount1" value="${prev.c1 || ''}" min="1" max="8" class="border border-slate-300 rounded p-1 w-12 text-center focus:ring-2 outline-none bg-white text-slate-800">
                            <span class="text-slate-600 font-semibold">e⁻</span>
                        </div>
                `;

                if (!isHomo) {
                    html += `
                        <div class="flex items-center gap-1.5">
                            <span class="font-bold text-teal-700 w-8">${a2.sym}:</span>
                            <select id="action2" class="border border-slate-300 rounded p-1 flex-1 focus:ring-2 outline-none bg-white text-slate-800">
                                <option value="">Selecciona...</option>
                                <option value="pierde" ${prev.a2 === 'pierde' ? 'selected' : ''}>Pierde</option>
                                <option value="gana" ${prev.a2 === 'gana' ? 'selected' : ''}>Gana</option>
                                <option value="comparte" ${prev.a2 === 'comparte' ? 'selected' : ''}>Comparte</option>
                            </select>
                            <input type="number" id="ecount2" value="${prev.c2 || ''}" min="1" max="8" class="border border-slate-300 rounded p-1 w-12 text-center focus:ring-2 outline-none bg-white text-slate-800">
                            <span class="text-slate-600 font-semibold">e⁻</span>
                        </div>
                    `;
                }

                html += `</div>
                    <button onclick="checkElectrons()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded mt-1 transition-colors font-sans">Verificar Estabilidad</button>
                </div>`;
                
                inputArea.innerHTML = html;
            }, 1000);
        }

        function checkElectrons() {
            currentStepAttempts++;
            const a1 = elementsDB[currentScenario.e1];
            const a2 = elementsDB[currentScenario.e2];
            const isIonic = currentScenario.type === 'ionic';
            const isMetallic = currentScenario.type === 'metallic';
            const isHomo = currentScenario.e1 === currentScenario.e2;

            const action1 = document.getElementById('action1').value;
            const ecount1 = parseInt(document.getElementById('ecount1').value) || 0;
            
            const action2 = isHomo ? action1 : document.getElementById('action2').value;
            const ecount2 = isHomo ? ecount1 : (parseInt(document.getElementById('ecount2').value) || 0);

            inputArea.innerHTML = '';
            if (isHomo) {
                addUserMessage(`${a1.sym}: ${action1 || '?'} ${ecount1} e⁻`);
            } else {
                addUserMessage(`${a1.sym}: ${action1 || '?'} ${ecount1} e⁻ | ${a2.sym}: ${action2 || '?'} ${ecount2} e⁻`);
            }

            const expected1 = {
                action: (isIonic || isMetallic) ? (a1.type === 'metal' ? 'pierde' : 'gana') : 'comparte',
                count: a1.type === 'metal' ? a1.val : (a1.sym === 'H' ? 1 : (8 - a1.val))
            };
            const expected2 = {
                action: (isIonic || isMetallic) ? (a2.type === 'metal' ? 'pierde' : 'gana') : 'comparte',
                count: a2.type === 'metal' ? a2.val : (a2.sym === 'H' ? 1 : (8 - a2.val))
            };

            const verbMap = { 'pierde': 'perder', 'gana': 'ganar', 'comparte': 'compartir' };

            safeSetTimeout(() => {
                let errors = [];
                if (action1 !== expected1.action || ecount1 !== expected1.count) errors.push(`lo que le ocurre al <b>${a1.sym}</b>`);
                if (!isHomo && (action2 !== expected2.action || ecount2 !== expected2.count)) errors.push(`lo que le ocurre al <b>${a2.sym}</b>`);

                if (errors.length === 0) {
                    if (isIonic) {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Muy bien!</b> En este enlace iónico, el metal cede sus electrones para formar cationes y el no metal los gana para formar aniones estables.`);
                        stepBuildIons(a1, a2);
                    } else if (isMetallic) {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Muy bien!</b> En el enlace metálico, los cationes del metal se mantienen fuertemente cohesionados gracias a los electrones deslocalizados.`);
                        stepBuildIons(a1, a2);
                    } else {
                        if (isHomo) {
                            addTutorMessage(`<b class="text-red-600 font-bold">¡Exacto!</b> Al ser átomos no metálicos, comparten sus electrones de valencia para completar sus respectivas capas externas.`);
                        } else {
                            addTutorMessage(`<b class="text-red-600 font-bold">¡Exacto!</b> Al ser ambos no metales, comparten electrones de valencia para completar el octeto (o dueto).`);
                        }
                        stepAtomsBalance(a1, a2);
                    }
                } else {
                    if (currentStepAttempts >= 3) {
                        if (isHomo) {
                            addTutorMessage(`Has agotado tus 3 intentos. La deducción correcta es:<br><div class="mt-1 space-y-1"><div>El <b>${a1.sym}</b> necesita <b class="text-red-600 font-bold">${verbMap[expected1.action]} ${expected1.count} e⁻</b>.</div></div>`);
                        } else {
                            addTutorMessage(`Has agotado tus 3 intentos. La deducción correcta es:<br><div class="mt-1 space-y-1"><div>El <b>${a1.sym}</b> necesita <b class="text-red-600 font-bold">${verbMap[expected1.action]} ${expected1.count} e⁻</b>.</div><div>El <b>${a2.sym}</b> necesita <b class="text-red-600 font-bold">${verbMap[expected2.action]} ${expected2.count} e⁻</b>.</div></div>`);
                        }
                        safeSetTimeout(() => {
                            if (isIonic || isMetallic) stepBuildIons(a1, a2);
                            else stepAtomsBalance(a1, a2);
                        }, 2500);
                    } else {
                        let hint = "";
                        
                        // Evaluar de forma diferenciada la naturaleza de los errores
                        const isAct1Wrong = action1 !== expected1.action;
                        const isQty1Wrong = action1 === expected1.action && ecount1 !== expected1.count;
                        const isAct2Wrong = !isHomo && (action2 !== expected2.action);
                        const isQty2Wrong = !isHomo && (action2 === expected2.action && ecount2 !== expected2.count);

                        const hasActionError = isAct1Wrong || isAct2Wrong;
                        const hasOnlyQtyError = !hasActionError && (isQty1Wrong || isQty2Wrong);

                        if (currentStepAttempts === 1) {
                            if (hasActionError) {
                                hint = "Revisa si la acción que has seleccionado (perder, ganar o compartir) es correcta según si el elemento es un metal o un no metal, y el tipo de enlace implicado.";
                            } else if (hasOnlyQtyError) {
                                hint = "¡Has acertado con el comportamiento (perder/ganar/compartir)! Sin embargo, la cantidad de electrones que indicas no es la correcta. Revisa los electrones de valencia que tiene cada elemento en su última capa y los que necesita para completarla.";
                            }
                        } else {
                            // Segundo intento
                            if (hasActionError) {
                                hint = (isIonic || isMetallic) ? 
                                    "Recuerda: En los enlaces iónicos o metálicos, los metales siempre <b>pierden</b> sus electrones de valencia, mientras que los no metales los <b>ganan</b> para alcanzar la estabilidad." :
                                    "Recuerda: En los enlaces covalentes, los no metales <b>comparten</b> electrones para completar su última capa de forma conjunta.";
                            } else if (hasOnlyQtyError) {
                                let specificTips = [];
                                if (isQty1Wrong) {
                                    if (a1.type === 'metal') {
                                        specificTips.push(`El metal <b>${a1.sym}</b> debe perder exactamente <b>todos</b> sus electrones de valencia (es decir, ${expected1.count} e⁻).`);
                                    } else {
                                        specificTips.push(`El no metal <b>${a1.sym}</b> debe ganar o compartir la cantidad exacta de electrones necesarios para llegar a 8 (o a 2 en el caso del H, Li o Be).`);
                                    }
                                }
                                if (isQty2Wrong) {
                                    if (a2.type === 'metal') {
                                        specificTips.push(`El metal <b>${a2.sym}</b> debe perder exactamente <b>todos</b> sus electrones de valencia (es decir, ${expected2.count} e⁻).`);
                                    } else {
                                        specificTips.push(`El no metal <b>${a2.sym}</b> debe ganar o compartir la cantidad exacta de electrones necesarios para llegar a 8 (o a 2 en el caso del H, Li o Be).`);
                                    }
                                }
                                hint = `<b>Pista de conteo:</b><br>${specificTips.join('<br>')}`;
                            }
                        }
                        
                        addTutorMessage(`Hay un detalle que revisar en ${errors.join(' y ')}. <br><br>${hint}`);
                        stepElectrons(a1, a2, {a1: action1, c1: ecount1, a2: action2, c2: ecount2});
                    }
                }
            }, 800);
        }

        // --- CONSTRUCCIÓN DE IONES (SOLO IÓNICO / METÁLICO) ---
        function stepBuildIons(a1, a2, isRetry = false) {
            if (!isRetry) currentStepAttempts = 0;
            const isMetallic = currentScenario.type === 'metallic';
            
            safeSetTimeout(() => {
                if (!isRetry) {
                    if (isMetallic) {
                        addTutorMessage("Ahora vamos a construir el catión resultante. Escribe la carga del ión como superíndice usando las dos cajitas.");
                    } else {
                        addTutorMessage("Ahora vamos a construir los iones resultantes. Escribe la carga de cada ión como superíndice usando las dos cajitas.");
                    }
                }

                let html = `
                    <div class="flex flex-col space-y-4 fade-in font-sans text-slate-800">
                        <div class="flex justify-around items-center bg-slate-50 p-6 rounded border border-slate-200">
                            <!-- Ión 1 -->
                            <div class="flex items-start text-4xl font-bold font-serif text-indigo-700 relative">
                                <span>${a1.sym}</span>
                                <div class="flex absolute -right-12 -top-2">
                                    <input type="text" id="i1_b1" maxlength="1" class="w-6 h-6 text-sm text-center border border-slate-400 rounded-l focus:outline-none focus:ring-2 focus:ring-indigo-500 font-sans text-slate-800 bg-white">
                                    <input type="text" id="i1_b2" maxlength="1" class="w-6 h-6 text-sm text-center border-y border-r border-slate-400 rounded-r focus:outline-none focus:ring-2 focus:ring-indigo-500 font-sans text-slate-800 bg-white">
                                </div>
                            </div>`;
                            
                if (!isMetallic) {
                    html += `
                            <!-- Ión 2 -->
                            <div class="flex items-start text-4xl font-bold font-serif text-teal-700 relative ml-8">
                                <span>${a2.sym}</span>
                                <div class="flex absolute -right-12 -top-2">
                                    <input type="text" id="i2_b1" maxlength="1" class="w-6 h-6 text-sm text-center border border-slate-400 rounded-l focus:outline-none focus:ring-2 focus:ring-teal-500 font-sans text-slate-800 bg-white">
                                    <input type="text" id="i2_b2" maxlength="1" class="w-6 h-6 text-sm text-center border-y border-r border-slate-400 rounded-r focus:outline-none focus:ring-2 focus:ring-teal-500 font-sans text-slate-800 bg-white">
                                </div>
                            </div>`;
                }

                html += `
                        </div>
                        <button onclick="checkBuildIons()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded transition-colors font-sans">Formar Iones</button>
                    </div>
                `;
                inputArea.innerHTML = html;
            }, isRetry ? 100 : 1000);
        }

        function checkBuildIons() {
            currentStepAttempts++;
            const a1 = elementsDB[currentScenario.e1];
            const a2 = elementsDB[currentScenario.e2];
            const isMetallic = currentScenario.type === 'metallic';
            
            const i1b1 = document.getElementById('i1_b1').value.trim();
            const i1b2 = document.getElementById('i1_b2').value.trim();
            const i2b1 = isMetallic ? '' : document.getElementById('i2_b1').value.trim();
            const i2b2 = isMetallic ? '' : document.getElementById('i2_b2').value.trim();

            inputArea.innerHTML = '';
            if (isMetallic) {
                addUserMessage(`${a1.sym}<sup>${i1b1}${i1b2}</sup>`);
            } else {
                addUserMessage(`${a1.sym}<sup>${i1b1}${i1b2}</sup> y ${a2.sym}<sup>${i2b1}${i2b2}</sup>`);
            }

            const expectedCharge1 = a1.val; 
            const expectedCharge2 = isMetallic ? 0 : (a2.sym === 'H' ? 1 : 8 - a2.val); 
            
            const validateIon = (b1, b2, charge, sign) => {
                if (charge === 1) {
                    if ((b1 === sign && b2 === '') || (b1 === '' && b2 === sign)) return {ok: true};
                    if (b1 === '1' || b2 === '1') return {ok: false, hint: 'number1'};
                    return {ok: false, hint: 'wrong_sign'};
                } else {
                    if (b1 === charge.toString() && b2 === sign) return {ok: true};
                    if (b1 === sign && b2 === charge.toString()) return {ok: false, hint: 'reversed'};
                    return {ok: false, hint: 'wrong_val'};
                }
            };

            const res1 = validateIon(i1b1, i1b2, expectedCharge1, '+');
            const res2 = isMetallic ? {ok: true} : validateIon(i2b1, i2b2, expectedCharge2, '-');

            safeSetTimeout(() => {
                if (res1.ok && res2.ok) {
                    if (isMetallic) {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Perfecto!</b> Has construido el catión metálico correctamente: <b class="text-red-600 font-bold">${a1.sym}<sup>${expectedCharge1===1?'+':expectedCharge1+'+'}</sup></b>.`);
                        stepMetallicExplanation();
                    } else {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Perfecto!</b> Has construido los iones correctamente: <b class="text-red-600 font-bold">${a1.sym}<sup>${expectedCharge1===1?'+':expectedCharge1+'+'}</sup></b> y <b class="text-red-600 font-bold">${a2.sym}<sup>${expectedCharge2===1?'-':expectedCharge2+'-'}</sup></b>.`);
                        stepAtomsBalance(a1, a2);
                    }
                } else {
                    if (currentStepAttempts >= 3) {
                        let expected1 = expectedCharge1 === 1 ? '+' : `${expectedCharge1}+`;
                        if (isMetallic) {
                            addTutorMessage(`Has agotado tus 3 intentos. El catión correcto es <b class="text-red-600 font-bold">${a1.sym}<sup>${expected1}</sup></b>.`);
                            safeSetTimeout(() => stepMetallicExplanation(), 2500);
                        } else {
                            let expected2 = expectedCharge2 === 1 ? '-' : `${expectedCharge2}-`;
                            addTutorMessage(`Has agotado tus 3 intentos. Los iones correctos son <b class="text-red-600 font-bold">${a1.sym}<sup>${expected1}</sup></b> y <b class="text-red-600 font-bold">${a2.sym}<sup>${expected2}</sup></b>.`);
                            safeSetTimeout(() => stepAtomsBalance(a1, a2), 2500);
                        }
                    } else {
                        let errorMsg = "Fíjate bien, hay algún detalle que ajustar en el catión:";
                        
                        const generateHint = (atom, res, isMetal) => {
                            if (res.ok) return "";
                            let hint = `<br>• <b>${atom.sym}:</b> `;
                            if (res.hint === 'number1') {
                                if (currentStepAttempts === 1) hint += "Revisa cómo has escrito la carga. Hay una convención química sobre si se debe escribir o no el número '1'.";
                                else hint += "Piensa en las convenciones de notación química: ¿solemos escribir el número '1' explícitamente, o se da por sobreentendido?";
                            } else if (res.hint === 'reversed') {
                                if (currentStepAttempts === 1) hint += "El valor de la carga es correcto, pero hay un error de formato al escribirlo. Revisa el orden.";
                                else hint += "El valor numérico es correcto, pero revisa el orden de escritura. La IUPAC indica que primero va la cifra y luego el signo matemático.";
                            } else {
                                const action = isMetal ? 'pierde' : 'gana';
                                if (currentStepAttempts === 1) {
                                    hint += `Piensa en el balance de cargas. Si un átomo neutro ${action} electrones (cargas negativas), ¿cómo quedará cargado el ion?`;
                                } else {
                                    hint += `Revisa la cantidad de electrones deducida en el paso anterior. El número de electrones que ${action} debe ser igual al valor numérico de su carga.`;
                                }
                            }
                            return hint;
                        };

                        if (!res1.ok) {
                            errorMsg += generateHint(a1, res1, a1.type === 'metal');
                        }
                        if (!isMetallic && !res2.ok) {
                            errorMsg += generateHint(a2, res2, a2.type === 'metal');
                        }
                        
                        addTutorMessage(errorMsg);
                        stepBuildIons(a1, a2, true);
                    }
                }
            }, 800);
        }

        function stepMetallicExplanation() {
            const a1 = elementsDB[currentScenario.e1];
            const charge = a1.val === 1 ? '+' : a1.val + '+';
            safeSetTimeout(() => {
                addTutorMessage(`¿Cómo interactúan estos cationes <b class="text-red-600 font-bold">${a1.sym}<sup>${charge}</sup></b>? <br><br>En el enlace metálico, los átomos ceden sus electrones de valencia y se convierten en cationes ordenados en una red cristalina. Los electrones perdidos no pertenecen a un solo átomo, sino que se <b>comparten globalmente</b> formando un <b>"mar de electrones"</b> o "nube electrónica" que envuelve y mantiene fuertemente unidos a los cationes.`);
                
                inputArea.innerHTML = `
                    <div class="flex flex-col space-y-1 fade-in font-sans">
                        <button onclick="checkMetallicExplanation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded transition-colors font-sans">Entendido, avanzar</button>
                    </div>
                `;
            }, 1500);
        }

        function checkMetallicExplanation() {
            inputArea.innerHTML = '';
            const a1 = elementsDB[currentScenario.e1];
            const a2 = elementsDB[currentScenario.e2];
            addUserMessage("Entendido, avanzar");
            safeSetTimeout(() => {
                stepAtomsBalance(a1, a2);
            }, 500);
        }

        // --- EQUILIBRIO DE ÁTOMOS ---
        function stepAtomsBalance(a1, a2, isRetry = false) {
            if (!isRetry) currentStepAttempts = 0;
            const isHomo = currentScenario.e1 === currentScenario.e2;
            const isNone = currentScenario.type === 'none';
            const isMetallic = currentScenario.type === 'metallic';
            const isCovalentAtomic = currentScenario.type === 'covalent_atomic';

            safeSetTimeout(() => {
                if (!isRetry) {
                    if (currentScenario.type === 'ionic') {
                        addTutorMessage(`Sabiendo esto, las cargas totales deben equilibrarse.<br><br>¿Cuántos átomos de <b>${a1.sym}</b> y <b>${a2.sym}</b> necesitas en total para que los electrones perdidos y ganados sean los mismos?`);
                    } else if (isNone) {
                        addTutorMessage("Sabiendo que no forman enlaces, ¿cuántos átomos representarán la fórmula de esta sustancia química?");
                    } else if (isMetallic || isCovalentAtomic) {
                        addTutorMessage("Sabiendo que forman redes infinitas tridimensionales de átomos, ¿cómo se representa la mínima unidad elemental de esta sustancia?");
                    } else {
                        if (isHomo) {
                            addTutorMessage(`Sabiendo esto, deben unirse para compartir los electrones necesarios.<br><br>¿Cuántos átomos en total formarán la sustancia química?`);
                        } else {
                            addTutorMessage(`Sabiendo esto, deben unirse para compartir los electrones necesarios.<br><br>¿Cuántos átomos de <b>${a1.sym}</b> y <b>${a2.sym}</b> formarán la sustancia química?`);
                        }
                    }
                }

                let html = `<div class="flex flex-col space-y-1 fade-in font-sans">
                                <div class="flex justify-center items-end space-x-1 text-2xl font-bold font-serif mb-1 text-slate-700">`;
                
                if (isHomo) {
                    html += `<input type="text" id="sym1" placeholder="Símb." maxlength="2" class="border-b-2 border-indigo-400 bg-transparent w-20 text-2xl text-center mx-1 focus:outline-none text-indigo-800 bg-indigo-50">`;
                    html += `<input type="number" id="qty1" min="1" max="4" value="1" class="border-b-2 border-slate-400 bg-transparent w-10 text-lg text-center mx-1 focus:outline-none text-slate-800 bg-white">`;
                } else {
                    html += `<input type="text" id="sym1" placeholder="Símb 1" maxlength="2" class="border-b-2 border-indigo-400 bg-transparent w-24 text-2xl text-center mx-1 focus:outline-none text-indigo-800 bg-indigo-50">`;
