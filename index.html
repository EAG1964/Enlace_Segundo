            const choiceText = selectEl.options[selectEl.selectedIndex]?.text || '';
            
            if(!userChoice) {
                addTutorMessage("Por favor, selecciona una opción en el desplegable.");
                return;
            }

            inputArea.innerHTML = '';
            addUserMessage(choiceText);

            let expectedChoice = '';
            if (currentScenario.type === 'ionic') expectedChoice = 'red_iones';
            else if (currentScenario.type === 'metallic') expectedChoice = 'red_metalica';
            else if (currentScenario.type === 'none') expectedChoice = 'atomos_sueltos';
            else if (currentScenario.type === 'covalent_atomic') expectedChoice = 'red_atomos';
            else expectedChoice = 'moleculas';

            safeSetTimeout(() => {
                if (userChoice === expectedChoice) {
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Excelente!</b> Has identificado la estructura microscópica. Vamos a verla ahora como un <b>modelo 3D CPK a temperatura ambiente</b>.`);
                    showContinueButton('stepMicroscopic3DModel()', 'Ver modelo 3D');
                } else {
                    if (currentStepAttempts >= 3) {
                        const expectedTextMap = {
                            'red_iones': 'Red cristalina de iones',
                            'moleculas': 'Moléculas',
                            'red_metalica': 'Red cristalina de cationes con e⁻ deslocalizados',
                            'atomos_sueltos': 'Átomos sueltos',
                            'red_atomos': 'Red cristalina de átomos neutros'
                        };
                        addTutorMessage(`Has agotado tus 3 intentos. La estructura correcta es: <b class="text-red-600 font-bold">${expectedTextMap[expectedChoice]}</b>. Vamos a verla en el modelo 3D CPK.`);
                        safeSetTimeout(() => stepMicroscopic3DModel(), 1600);
                    } else {
                        let hint = "";
                        if (currentStepAttempts === 1) {
                            hint = "Esa no es la estructura correcta. Piensa en cómo interactúan las partículas de este tipo de sustancia según los enlaces que acabamos de deducir.";
                        } else {
                            if (currentScenario.type === 'none') hint = "Recuerda: Los gases nobles no se unen a nada, así que piensa cómo se encontrarían sus partículas libremente en el espacio.";
                            else if (currentScenario.type === 'metallic') hint = "Recuerda: Los metales forman sólidas redes cristalinas integradas por cationes inmersos en un mar de electrones compartidos.";
                            else if (currentScenario.type === 'ionic') hint = "Recuerda: Los compuestos iónicos forman grandes estructuras sólidas y ordenadas de cargas positivas y negativas.";
                            else if (currentScenario.type === 'covalent_atomic') hint = "Recuerda: El diamante y el cuarzo son sólidos covalentes que forman redes cristalinas gigantes donde todos los átomos están unidos por fortísimos enlaces covalentes.";
                            else hint = "Recuerda: La gran mayoría de las sustancias covalentes sencillas forman pequeños grupos aislados de átomos unidos entre sí.";
                        }
                        addTutorMessage(`No exactamente. ${hint}`);
                        stepMicroscopicStructure(true); 
                    }
                }
            }, 800);
        }


        // --- MODELO 3D MICROSCÓPICO A TEMPERATURA AMBIENTE ---
        function getMicroscopicExpectedChoice() {
            if (currentScenario.type === 'ionic') return 'red_iones';
            if (currentScenario.type === 'metallic') return 'red_metalica';
            if (currentScenario.type === 'none') return 'atomos_sueltos';
            if (currentScenario.type === 'covalent_atomic') return 'red_atomos';
            return 'moleculas';
        }

        function getMicroscopicChoiceLabel(choice) {
            const labels = {
                atomos_sueltos: 'Átomos aislados',
                red_metalica: 'Red de cationes con mar de e⁻',
                red_iones: 'Iones en red cristalina',
                red_atomos: 'Red covalente atómica',
                moleculas: 'Moléculas independientes'
            };
            return labels[choice] || choice;
        }

        function renderCovalentMolecularMicroModel(formulaHtml) {
            const b = currentScenario.builder;
            const data = typeof getMolecularGeometryData === 'function' ? getMolecularGeometryData() : null;
            const center = b?.center || currentScenario.e1;
            const firstPeriph = b?.periph?.[0] || currentScenario.e2 || currentScenario.e1;
            let mol1 = '', mol2 = '', mol3 = '';
            if (data?.isDiatomic) {
                mol1 = simpleDiatomicMoleculeSVG(135, 105, center, firstPeriph, 'micro3d-float-a');
                mol2 = simpleDiatomicMoleculeSVG(345, 92, center, firstPeriph, 'micro3d-float-b');
                mol3 = simpleDiatomicMoleculeSVG(260, 202, center, firstPeriph, 'micro3d-float-c');
            } else if (data?.geometry === 'tetraedrica') {
                mol1 = simpleTetraMoleculeSVG(145, 115, center, firstPeriph, 'micro3d-float-a micro3d-rotate');
                mol2 = simpleTetraMoleculeSVG(350, 112, center, firstPeriph, 'micro3d-float-b micro3d-rotate');
                mol3 = simpleTetraMoleculeSVG(250, 200, center, firstPeriph, 'micro3d-float-c micro3d-rotate');
            } else if (data?.geometry === 'piramide_triangular') {
                mol1 = simplePyramidMoleculeSVG(150, 86, center, firstPeriph, 'micro3d-float-a micro3d-rotate');
                mol2 = simplePyramidMoleculeSVG(350, 88, center, firstPeriph, 'micro3d-float-b micro3d-rotate');
                mol3 = simplePyramidMoleculeSVG(250, 178, center, firstPeriph, 'micro3d-float-c micro3d-rotate');

                mol1 = simpleAngularMoleculeSVG(140, 86, center, firstPeriph, 'micro3d-float-a micro3d-rotate');
                mol2 = simpleAngularMoleculeSVG(360, 88, center, firstPeriph, 'micro3d-float-b micro3d-rotate');
                mol3 = simpleAngularMoleculeSVG(250, 180, center, firstPeriph, 'micro3d-float-c micro3d-rotate');

                mol1 = simpleLinearTriatomicSVG(145, 105, center, firstPeriph, 'micro3d-float-a micro3d-rotate');
                mol2 = simpleLinearTriatomicSVG(355, 92, center, firstPeriph, 'micro3d-float-b micro3d-rotate');

                mol3 = simpleDiatomicMoleculeSVG(260, 202, center, firstPeriph, 'micro3d-float-c');

            const a = currentScenario.e1, b = currentScenario.e2 || currentScenario.e1;
            const xs = [115, 185, 255, 325, 395];

            let ions = '';
            ys.forEach((y, row) => xs.forEach((x, col) => {

                ions += atomCircleSVG(x, y, 18, positive ? `${a}⁺` : `${b}⁻`, positive ? "#dbeafe" : "#fee2e2", positive ? "#2563eb" : "#dc2626", "micro3d-vibrate");
            }));
            return `
                <div class="micro3d-card fade-in">
                    <div class="micro3d-title">Modelo 3D simplificado a temperatura ambiente</div>
                    <div class="micro3d-subtitle"><b>${formulaHtml}</b> · red cristalina de iones</div>
                    <svg viewBox="0 0 520 315" class="micro3d-svg">
                        <rect x="12" y="12" width="496" height="260" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
                        <g opacity="0.7">
                            <line x1="115" y1="72" x2="395" y2="231" stroke="#cbd5e1"/>
                            <line x1="395" y1="72" x2="115" y2="231" stroke="#cbd5e1"/>
                            <line x1="115" y1="125" x2="395" y2="125" stroke="#cbd5e1"/>
                            <line x1="115" y1="178" x2="395" y2="178" stroke="#cbd5e1"/>
                        </g>
                        ${ions}

        function renderMetallicMicroModel(formulaHtml) {

        function renderDiamondMicroModel(formulaHtml) {
            const nodes = [
                [260,55,'C'], [195,105,'C'], [325,105,'C'], [260,155,'C'],

            ];
            const edges = [[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,6],[5,7],[6,8],[7,8],[3,8]];
            const lines = edges.map(([i,j]) => `<line x1="${nodes[i][0]}" y1="${nodes[i][1]}" x2="${nodes[j][0]}" y2="${nodes[j][1]}" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="${(i+j)%2 ? 0.65 : 1}"/>`).join('');
            const atoms = nodes.map(([x,y,l]) => atomCircleSVG(x,y,15,l,"#e5e7eb","#334155","micro3d-vibrate")).join('');
            return `
                <div class="micro3d-card fade-in">
                    <div class="micro3d-title">Modelo 3D simplificado a temperatura ambiente</div>

                    <svg viewBox="0 0 520 315" class="micro3d-svg">

        function renderSiO2MicroModel(formulaHtml) {
            const si = [[165,115],[260,180],[355,115]];
            const o = [[165,55],[105,145],[220,145],[260,115],[315,145],[415,145],[355,55],[260,245]];
            let lines = '';
            si.forEach(([sx,sy]) => {
                o.forEach(([ox,oy]) => {
                    const d = Math.hypot(sx-ox, sy-oy);
                    if (d < 82) lines += `<line x1="${sx}" y1="${sy}" x2="${ox}" y2="${oy}" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.85"/>`;
                });
            });
            const siAtoms = si.map(([x,y]) => atomCircleSVG(x,y,18,'Si',"#dbeafe","#2563eb","micro3d-vibrate")).join('');
            const oAtoms = o.map(([x,y]) => atomCircleSVG(x,y,14,'O',"#fee2e2","#dc2626","micro3d-vibrate")).join('');
            return `
                <div class="micro3d-card fade-in">
                    <div class="micro3d-title">Modelo 3D simplificado a temperatura ambiente</div>
                    <div class="micro3d-subtitle"><b>${formulaHtml}</b> · red covalente de tetraedros SiO₄ conectados</div>
                    <svg viewBox="0 0 520 315" class="micro3d-svg">
                        <rect x="12" y="12" width="496" height="260" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>

                        <text x="260" y="295" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">No hay moléculas SiO₂ · fórmula de proporción en una red covalente</text>
                    </svg>
                </div>`;

        function renderMicroscopic3DModelOnStage() {
            const formulaHtml = formatChemicalFormulaHTML(currentScenario.form || currentScenario.e1 || '');
            let html = '';
            if (currentScenario.type === 'none') html = renderNobleGasMicroModel(currentScenario.e1, formulaHtml);
            else if (currentScenario.type === 'covalent') html = renderCovalentMolecularMicroModel(formulaHtml);
            else if (currentScenario.type === 'ionic') html = renderIonicMicroModel(formulaHtml);
            else if (currentScenario.type === 'metallic') html = renderMetallicMicroModel(formulaHtml);
            else if (currentScenario.type === 'covalent_atomic') {
                if ((currentScenario.form || '').toLowerCase().includes('sio2') || (currentScenario.e1 === 'Si' && currentScenario.e2 === 'O')) html = renderSiO2MicroModel(formulaHtml);
                else html = renderDiamondMicroModel(formulaHtml);
            }
            stageContent.innerHTML = html + `<div class="mt-1 text-[12px] text-slate-500 text-center max-w-md mx-auto">Representación didáctica: muestra el tipo de estructura y movimiento microscópico, no una celda cristalina exacta.</div>`;
        }


        function disposeMicro3DScene() {
            if (window.__micro3dAnimationId) cancelAnimationFrame(window.__micro3dAnimationId);
            window.__micro3dAnimationId = null;
            if (window.__micro3dRenderer) {
                try { window.__micro3dRenderer.dispose(); } catch(e) {}
                window.__micro3dRenderer = null;
            }
            window.__micro3dSceneState = null;
        }

        function getMicro3DUnitLewisHTML() {
            if (!currentScenario || currentScenario.type !== 'covalent_atomic' || !currentScenario.builder) return '';
            let title = 'Unidad local / conectividad tipo Lewis';
            if ((currentScenario.form || '') === 'C' || (currentScenario.e1 === 'C' && (!currentScenario.e2 || currentScenario.e2 === 'C'))) {
                title = 'Celdilla / conectividad local del diamante';
            } else if ((currentScenario.form || '').toLowerCase().includes('sio2')) {
                title = 'Unidad local de la red SiO₂';
            }
            return `<div class="micro3d-unit-lewis"><div class="micro3d-unit-lewis-title">${title}</div>${generateStaticLewisHTML(currentScenario)}</div>`;
        }

        function isDiamond3DScenario() {
            return currentScenario && currentScenario.type === 'covalent_atomic' && ((currentScenario.form || '') === 'C' || ((currentScenario.e1 === 'C') && (!currentScenario.e2 || currentScenario.e2 === 'C')));
        }

        function isSiO2NetworkScenario() {
            return currentScenario && currentScenario.type === 'covalent_atomic' && ((currentScenario.form || '') === 'SiO2');
        }

        function isSiCNetworkScenario() {
            return currentScenario && currentScenario.type === 'covalent_atomic' && ((currentScenario.form || '') === 'SiC');
        }

        function isC3N4NetworkScenario() {
            return currentScenario && currentScenario.type === 'covalent_atomic' && ((currentScenario.form || '') === 'C3N4');
        }

        function renderMicroscopic3DThreeStage() {
            disposeMicro3DScene();
            const formulaHtml = formatChemicalFormulaHTML(currentScenario.form || currentScenario.e1 || '');
            let label = 'Modelo microscópico 3D';
            if (currentScenario.type === 'ionic') label = 'red iónica tridimensional';
            else if (currentScenario.type === 'metallic') label = 'red de cationes con mar de e⁻';
            else if (currentScenario.type === 'covalent_atomic') label = 'red covalente tridimensional';
            else if (currentScenario.type === 'covalent') label = 'moléculas independientes en 3D';
            else if (currentScenario.type === 'none') label = 'átomos aislados en movimiento';

            stageContent.innerHTML = `
                <div class="micro3d-three-card fade-in ${isDiamond3DScenario() ? 'micro3d-diamond-compact' : ''}">
                    <div class="micro3d-three-title">${getMicro3DHeaderText()}</div>
                    <div class="micro3d-three-subtitle">${getMicro3DSubtitleText()}</div>
                    <div id="micro3d-three-container" style="height:${isDiamond3DScenario() ? '220px' : (isSiO2NetworkScenario() ? '236px' : (isSiCNetworkScenario() ? '236px' : (isC3N4NetworkScenario() ? '246px' : '230px')))};">
                        <div class="micro3d-overlay" id="micro3d-overlay-text"></div>
                    </div>
                    <div id="micro3d-legend" class="micro3d-legend"></div>
                    <div class="micro3d-note">Representación didáctica 3D: resalta la geometría local y la conectividad de la red, no una celda cristalográfica exacta.</div>
                </div>`;
            safeSetTimeout(initMicro3DThreeScene, 80);
        }

        function initMicro3DThreeScene() {
            const container = document.getElementById('micro3d-three-container');
            if (!container || typeof THREE === 'undefined') {
                renderMicroscopic3DModelOnStage();
                return;
            }

            disposeMicro3DScene();

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a1128, 0.028);

            const width = container.clientWidth || 500;
            const height = container.clientHeight || 315;
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
            if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);
            window.__micro3dRenderer = renderer;

            const ambient = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambient);
            const dir = new THREE.DirectionalLight(0xffffff, 1.35);
            dir.position.set(18, 28, 22);
            scene.add(dir);
            const point = new THREE.PointLight(0x60a5fa, 1.2, 90);
            point.position.set(-12, 4, -14);
            scene.add(point);

            const root = new THREE.Group();
            scene.add(root);

            const state = {
                scene, camera, renderer, root,
                ions: [], electrons: [], molecules: [], atoms: [],
                theta: Math.PI / 4, phi: Math.PI / 2.45, radius: 30,
                isDragging: false, previous: { x: 0, y: 0 },
                boundingBox: 12,
                kind: currentScenario.type
            };
            window.__micro3dSceneState = state;

            buildMicro3DObjects(state);
            // Escalado visual global del modelo 3D.
            // En las redes iónicas se ajusta automáticamente para que no se salga de la ventana.
            if (currentScenario.type === 'ionic') {
                state.root.scale.setScalar(getIonicModelScale());
                state.radius = getIonicModelCameraRadius();
                state.phi = Math.PI / 2.62;
            } else {
                state.root.scale.setScalar(currentScenario.type === 'metallic' ? 1.55 : (isSiCNetworkScenario() ? 1.35 : (isC3N4NetworkScenario() ? 1.95 : 2.0)));
                if (currentScenario.type === 'metallic') {
                    state.radius = 26.0;
                    state.phi = Math.PI / 2.62;
                }
                if (isDiamond3DScenario()) {
                    state.radius = 22.8;
                    state.phi = Math.PI / 2.78;
                }
                if (isSiO2NetworkScenario()) {
                    state.radius = 39;
                    state.phi = Math.PI / 2.55;
                }
                if (isSiCNetworkScenario()) {
                    state.radius = 31.5;
                    state.phi = Math.PI / 2.72;
                }
                if (isC3N4NetworkScenario()) {
                    state.radius = 27.5;
                    state.phi = Math.PI / 2.58;
                }
                if (isLargeSolidDiatomicScenario()) {
                    state.root.scale.setScalar(1.62);
                    state.radius = 35.0;
                    state.phi = Math.PI / 2.58;
                }
            }
            if (typeof getCompactMolecule3DScale === 'function' && currentScenario.type === 'covalent' && ['CO2','CS2','H2O','H2S','SF2','PH3','PCl3','PF3','PBr3','PI3'].includes(currentScenario.form)) {
                state.radius = Math.max(state.radius || 0, ['CS2','PCl3','PBr3','PI3'].includes(currentScenario.form) ? 34.0 : 30.0);
                state.phi = Math.PI / 2.60;
            }
            updateMicro3DCamera(state);

            container.addEventListener('mousedown', (e) => {
                state.isDragging = true;
                state.previous = { x: e.offsetX, y: e.offsetY };
            });
            container.addEventListener('mousemove', (e) => {
                if (!state.isDragging) return;
                state.theta -= (e.offsetX - state.previous.x) * 0.008;
                state.phi -= (e.offsetY - state.previous.y) * 0.008;
                updateMicro3DCamera(state);
                state.previous = { x: e.offsetX, y: e.offsetY };
            });
            window.addEventListener('mouseup', () => { if (window.__micro3dSceneState) window.__micro3dSceneState.isDragging = false; });

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    state.isDragging = true;
                    state.previous = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                }
            }, { passive: false });
            container.addEventListener('touchmove', (e) => {
                if (!state.isDragging || e.touches.length !== 1) return;
                e.preventDefault();
                state.theta -= (e.touches[0].pageX - state.previous.x) * 0.010;
                state.phi -= (e.touches[0].pageY - state.previous.y) * 0.010;
                updateMicro3DCamera(state);
                state.previous = { x: e.touches[0].pageX, y: e.touches[0].pageY };
            }, { passive: false });
            window.addEventListener('touchend', () => { if (window.__micro3dSceneState) window.__micro3dSceneState.isDragging = false; });

            const ro = new ResizeObserver(() => {
                const w = container.clientWidth || 500;
                const h = container.clientHeight || 315;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
            ro.observe(container);

            animateMicro3D();
        }

        function updateMicro3DCamera(state) {
            state.phi = Math.max(0.18, Math.min(Math.PI - 0.18, state.phi));
            state.camera.position.x = state.radius * Math.sin(state.phi) * Math.cos(state.theta);
            state.camera.position.y = state.radius * Math.cos(state.phi);
            state.camera.position.z = state.radius * Math.sin(state.phi) * Math.sin(state.theta);
            state.camera.lookAt(0, 0, 0);
        }

        function makeMicroSphere(label, radius, color, metalness = 0.25, roughness = 0.35) {
            const geo = new THREE.SphereGeometry(radius, 28, 28);
            const mat = new THREE.MeshStandardMaterial({
                color,
                roughness,
                metalness,
                emissive: new THREE.Color(color).multiplyScalar(0.08)
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData.label = label;
            return mesh;
        }

        function makeMicroLine(a, b, color = 0xffffff, opacity = 0.25, width = 1) {
            const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
            const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity, linewidth: width });
            return new THREE.Line(geo, mat);
        }

        function buildMicro3DObjects(state) {
            const overlay = document.getElementById('micro3d-overlay-text');
            if (currentScenario.type === 'metallic') {
                if (overlay) overlay.innerHTML = '';
                buildMetal3D(state);
            } else if (currentScenario.type === 'ionic') {
                if (overlay) {
                    const cat = currentScenario.e1 || 'Na';
                    const an = currentScenario.e2 || 'Cl';
                    const catColor = colorHexToCss(getCPKAtomStyle(cat).color);
                    const anColor = colorHexToCss(getCPKAtomStyle(an).color);
                    const catCharge = getSimpleIonChargeText(cat, true);
                    const anCharge = getSimpleIonChargeText(an, false);
                    overlay.innerHTML = '';
                }
                buildIonic3D(state);
            } else if (currentScenario.type === 'covalent_atomic') {
                if (overlay) overlay.innerHTML = '';
                if ((currentScenario.form || '').toLowerCase().includes('sio2') || (currentScenario.e1 === 'Si' && currentScenario.e2 === 'O')) {
                    buildSiO23D(state);
                } else if ((currentScenario.form || '') === 'SiC') {
                    buildSiC3D(state);
                } else if ((currentScenario.form || '') === 'C3N4') {
                    buildC3N43D(state);
                } else {
                    buildDiamond3D(state);
                }
            } else if (currentScenario.type === 'covalent') {
                if (overlay) {
                    const ph = getMolecularPhysicalStateRT(currentScenario);
                    const phTxt = ph === 'liquid' ? 'líquido: moléculas próximas' : (ph === 'solid' ? 'sólido molecular: moléculas juntas' : 'gas: moléculas separadas');
                    overlay.innerHTML = '';
                }
                buildMolecular3D(state);
            } else {
                if (overlay) overlay.innerHTML = '';
                buildNobleGas3D(state);
            }
        }

        function buildMetal3D(state) {
            const sym = currentScenario.e1 || 'M';
            const grid = 5, spacing = 1.58, offset = (grid * spacing) / 2 - spacing / 2;
            const lineGroup = new THREE.Group();
            const basePositions = [];
            for (let x = 0; x < grid; x++) for (let y = 0; y < grid; y++) for (let z = 0; z < grid; z++) {
                const base = new THREE.Vector3(x * spacing - offset, y * spacing - offset, z * spacing - offset);
                const st = getCPKAtomStyle(sym);
                // En redes metálicas usamos color CPK del metal para los cationes.
                const ion = makeMicroSphere(sym, 0.74, st.color, 0.65, 0.26);
                ion.position.copy(base);
                state.root.add(ion);
                state.ions.push({ mesh: ion, basePos: base, phase: Math.random() * Math.PI * 2, speed: 0.045 + Math.random() * 0.03 });
                basePositions.push(base);
            }
            for (let i = 0; i < basePositions.length; i++) {
                for (let j = i + 1; j < basePositions.length; j++) {
                    const dist = basePositions[i].distanceTo(basePositions[j]);
                    if (dist < spacing + 0.05) lineGroup.add(makeMicroLine(basePositions[i], basePositions[j], 0xffffff, 0.12));
                }
            }
            state.root.add(lineGroup);
            state.boundingBox = (grid * spacing) / 2 + 0.35;
            const electronGeo = new THREE.SphereGeometry(0.22, 10, 10);
            const electronMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            for (let i = 0; i < 120; i++) {
                const e = new THREE.Mesh(electronGeo, electronMat);
                e.position.set((Math.random() - 0.5) * state.boundingBox * 1.25, (Math.random() - 0.5) * state.boundingBox * 1.25, (Math.random() - 0.5) * state.boundingBox * 1.25);
                state.root.add(e);
                state.electrons.push({ mesh: e, velocity: new THREE.Vector3((Math.random()-0.5)*0.45, (Math.random()-0.5)*0.45, (Math.random()-0.5)*0.45) });
            }
        }

        function buildIonic3D(state) {
            const cat = currentScenario.e1 || 'Ca';
            const an = currentScenario.e2 || 'P';
            const catSt = getIonicVisualStyle(cat, true);
            const anSt = getIonicVisualStyle(an, false);
            const grid = 4;
            const spacing = Math.max(1.45, Math.min(1.95, catSt.radius + anSt.radius + 0.10));
            const offset = (grid * spacing) / 2 - spacing / 2;
            const basePositions = [];
            const lineGroup = new THREE.Group();

            for (let x = 0; x < grid; x++) for (let y = 0; y < grid; y++) for (let z = 0; z < grid; z++) {
                const positive = (x + y + z) % 2 === 0;
                const ionSym = positive ? cat : an;
                const st = positive ? catSt : anSt;
                const label = `${ionSym}${getSimpleIonChargeText(ionSym, positive)}`;
                const mesh = makeMicroSphere(label, st.radius, st.color, 0.18, 0.42);
                const base = new THREE.Vector3(x * spacing - offset, y * spacing - offset, z * spacing - offset);
                mesh.position.copy(base);
                state.root.add(mesh);
                state.ions.push({ mesh, basePos: base, phase: Math.random() * Math.PI * 2, speed: 0.030 + Math.random() * 0.020 });
                basePositions.push(base);
            }

            for (let i = 0; i < basePositions.length; i++) {
                for (let j = i + 1; j < basePositions.length; j++) {
                    const dist = basePositions[i].distanceTo(basePositions[j]);
                    if (dist < spacing + 0.08) {
                        lineGroup.add(makeMicroLine(basePositions[i], basePositions[j], 0xffffff, 0.09));
                    }
                }
            }
            state.root.add(lineGroup);
            state.boundingBox = offset + Math.max(catSt.radius, anSt.radius) + 0.25;
        }

        function buildDiamond3D(state) {
            const symA = currentScenario.e1 || 'C';
            const symB = (currentScenario.e2 && currentScenario.e2 !== currentScenario.e1) ? currentScenario.e2 : symA;

            // Red tipo diamante / blenda de cinc: coordinación tetraédrica exacta.
            // Todos los enlaces generados tienen la misma longitud y los ángulos locales son 109,5°.
            const a = 5.8; // parámetro de red visual ampliado para que el diamante se vea más grande en pantalla
            const nx = 2, ny = 2, nz = 2; // 64 átomos en total
            const basisA = [
                [0, 0, 0],
                [0, 0.5, 0.5],
                [0.5, 0, 0.5],
                [0.5, 0.5, 0]
            ];
            const basisB = [
                [0.25, 0.25, 0.25],
                [0.25, 0.75, 0.75],
                [0.75, 0.25, 0.75],
                [0.75, 0.75, 0.25]
            ];
            const allAtoms = [];
            const atomKeySet = new Set();

            function addAtomRecord(sym, sublattice, fx, fy, fz) {
                const px = fx * a;
                const py = fy * a;
                const pz = fz * a;
                const key = `${sublattice}|${fx.toFixed(4)}|${fy.toFixed(4)}|${fz.toFixed(4)}`;
                if (atomKeySet.has(key)) return;
                atomKeySet.add(key);
                allAtoms.push({ sym, sublattice, pos: new THREE.Vector3(px, py, pz) });
            }

            for (let ix = 0; ix < nx; ix++) {
                for (let iy = 0; iy < ny; iy++) {
                    for (let iz = 0; iz < nz; iz++) {
                        basisA.forEach(([x, y, z]) => addAtomRecord(symA, 'A', ix + x, iy + y, iz + z));
                        basisB.forEach(([x, y, z]) => addAtomRecord(symB, 'B', ix + x, iy + y, iz + z));
                    }
                }
            }

            // Centrar el conjunto.
            const min = new THREE.Vector3(Infinity, Infinity, Infinity);
            const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
            allAtoms.forEach(aRec => {
                min.min(aRec.pos);
                max.max(aRec.pos);
            });
            const center = min.clone().add(max).multiplyScalar(0.5);
            allAtoms.forEach(aRec => {
                aRec.pos.sub(center);
                aRec.pos.y += 3.25; // desplaza el diamante hacia arriba para que quede mejor encajado en la ventana
            });

            // Crear esferas.
            allAtoms.forEach(aRec => {
                const st = getCPKAtomStyle(aRec.sym);
                const atom = makeMicroSphere(aRec.sym, st.radius * 0.84, st.color, 0.10, 0.28);
                atom.position.copy(aRec.pos);
                state.root.add(atom);
                state.atoms.push({ mesh: atom, basePos: aRec.pos.clone(), phase: Math.random() * Math.PI * 2, speed: 0.011 });
                aRec.mesh = atom;
            });

            // Generar enlaces solo entre vecinos más próximos A-B.
            const nn = a * Math.sqrt(3) / 4;
            const thresh = nn * 1.08;
            for (let i = 0; i < allAtoms.length; i++) {
                for (let j = i + 1; j < allAtoms.length; j++) {
                    if (allAtoms[i].sublattice === allAtoms[j].sublattice) continue;
                    const d = allAtoms[i].pos.distanceTo(allAtoms[j].pos);
                    if (d <= thresh) {
                        state.root.add(makeMicroLine(allAtoms[i].pos, allAtoms[j].pos, 0xf8fafc, 0.92, 0.82));
                    }
                }
            }
        }

        function buildSiC3D(state) {
            // El carborundo adopta una red 3D tetraédrica tipo diamante / blenda de cinc.
            // Reutilizamos la misma geometría que el diamante, pero con Si y C alternados.
            buildDiamond3D(state);
        }

        function buildC3N43D(state) {
            const cSym = 'C';
            const nSym = 'N';
            const cStyle = getCPKAtomStyle(cSym);
            const nStyle = getCPKAtomStyle(nSym);

            // Modelo 3D didáctico conectado para C3N4:
            // - todos los C tienen el mismo tamaño;
            // - todos los N tienen el mismo tamaño;
            // - el C central tiene geometría tetraédrica exacta (4 N a ~109,5°);
            // - cada N del primer entorno se une a 3 C en total;
            // - se añaden N más externos para sugerir continuidad de red sin fragmentarla.
            const C_RADIUS_SCALE = 0.62;
            const N_RADIUS_SCALE = 0.54;
            const tetraDirs = [
                new THREE.Vector3(1, 1, 1).normalize(),
                new THREE.Vector3(-1, -1, 1).normalize(),
                new THREE.Vector3(-1, 1, -1).normalize(),
                new THREE.Vector3(1, -1, -1).normalize()
            ];

            const atomRecords = [];
            const bondRecords = [];
            const guideRecords = [];
            const atomKeyMap = new Map();
            const bondKeySet = new Set();

            function keyFor(v) {
                return `${v.x.toFixed(3)}|${v.y.toFixed(3)}|${v.z.toFixed(3)}`;
            }
            function addAtomRecord(type, pos, highlight = false) {
                const key = `${type}|${keyFor(pos)}`;
                if (atomKeyMap.has(key)) return atomKeyMap.get(key);
                const rec = { type, pos: pos.clone(), highlight };
                atomRecords.push(rec);
                atomKeyMap.set(key, rec);
                return rec;
            }
            function addBondRecord(aRec, bRec, opacity = 0.8, width = 1) {
                const ka = `${aRec.type}|${keyFor(aRec.pos)}`;
                const kb = `${bRec.type}|${keyFor(bRec.pos)}`;
                const key = ka < kb ? `${ka}__${kb}` : `${kb}__${ka}`;
                if (bondKeySet.has(key)) return;
                bondKeySet.add(key);
                bondRecords.push({ a: aRec, b: bRec, opacity, width });
            }
            function choosePerp(u) {
                const ref = Math.abs(u.z) < 0.85 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
                const e1 = new THREE.Vector3().crossVectors(u, ref).normalize();
                const e2 = new THREE.Vector3().crossVectors(u, e1).normalize();
                return [e1, e2];
            }
            function otherTetraDirections(u) {
                u = u.clone().normalize();
                const [e1, e2] = choosePerp(u);
                const cosT = -1 / 3;
                const sinT = 2 * Math.sqrt(2) / 3;
                return [0, 2 * Math.PI / 3, 4 * Math.PI / 3].map(phi => {
                    const perp = e1.clone().multiplyScalar(Math.cos(phi)).add(e2.clone().multiplyScalar(Math.sin(phi)));
                    return u.clone().multiplyScalar(cosT).add(perp.multiplyScalar(sinT)).normalize();
                });
            }
            function trigonalCarbonDirectionsAroundN(nPos, parentCPos) {
                const towardParent = parentCPos.clone().sub(nPos).normalize();
                const [e1, e2] = choosePerp(towardParent);
                const tilt = 0.28;
                const side = Math.sqrt(1 - tilt * tilt);
                const dirs = [0, 2 * Math.PI / 3, 4 * Math.PI / 3].map(phi => {
                    const perp = e1.clone().multiplyScalar(Math.cos(phi)).add(e2.clone().multiplyScalar(Math.sin(phi)));
                    return towardParent.clone().multiplyScalar(tilt).add(perp.multiplyScalar(side)).normalize();
                });
                return [dirs[1], dirs[2]];
            }

            const c0Pos = new THREE.Vector3(0, 0, 0);
            const c0 = addAtomRecord('C', c0Pos, true);
            const CN = 2.55;
            const NC = 2.05;
            const firstNs = [];

            tetraDirs.forEach(dir => {
                const np = c0Pos.clone().add(dir.clone().multiplyScalar(CN));
                const nRec = addAtomRecord('N', np, false);
                firstNs.push(nRec);
                addBondRecord(c0, nRec, 0.95, 1.8);
            });

            // Cada N del primer entorno se une a dos carbonos más: N enlazado a 3 C.
            firstNs.forEach(nRec => {
                const extraCDirs = trigonalCarbonDirectionsAroundN(nRec.pos, c0Pos);
                extraCDirs.forEach(d => {
                    const cp = nRec.pos.clone().add(d.clone().multiplyScalar(NC));
                    const cRec = addAtomRecord('C', cp, false);
                    addBondRecord(cRec, nRec, 0.62, 1.1);

                    // En cada uno de estos C, 3 N adicionales en las otras direcciones tetraédricas.
                    const u = nRec.pos.clone().sub(cp).normalize();
                    const extNDirections = otherTetraDirections(u);
                    extNDirections.forEach(ndir => {
                        const n2p = cp.clone().add(ndir.clone().multiplyScalar(CN * 0.92));
                        const n2Rec = addAtomRecord('N', n2p, false);
                        addBondRecord(cRec, n2Rec, 0.30, 0.8);
                    });
                });
            });

            // Guías suaves entre los 4 N del entorno tetraédrico central.
            for (let i = 0; i < firstNs.length; i++) {
                for (let j = i + 1; j < firstNs.length; j++) {
                    guideRecords.push({ a: firstNs[i].pos.clone(), b: firstNs[j].pos.clone() });
                }
            }

            // Dibujar guías primero.
            guideRecords.forEach(g => {
                state.root.add(makeMicroLine(g.a, g.b, 0x93c5fd, 0.17, 0.5));
            });

            bondRecords.forEach(b => {
                state.root.add(makeMicroLine(b.a.pos, b.b.pos, 0xf8fafc, b.opacity, b.width));
            });

            atomRecords.forEach((rec, idx) => {
                const style = rec.type === 'C' ? cStyle : nStyle;
                const scale = rec.type === 'C' ? C_RADIUS_SCALE : N_RADIUS_SCALE;
                const atom = makeMicroSphere(rec.type, style.radius * scale, style.color, 0.10, 0.28);
                atom.position.copy(rec.pos);
                if (rec.highlight) {
                    const ringGeo = new THREE.RingGeometry(style.radius * scale * 1.26, style.radius * scale * 1.40, 40);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, side: THREE.DoubleSide });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.copy(rec.pos);
                    state.root.add(ring);
                    state.atoms.push({ mesh: ring, basePos: rec.pos.clone(), phase: Math.random() * Math.PI * 2, speed: 0.006, amp: 0.018, isRing: true });
                }
                state.root.add(atom);
                const amp = rec.highlight ? 0.020 : 0.024;
                state.atoms.push({ mesh: atom, basePos: rec.pos.clone(), phase: Math.random() * Math.PI * 2, speed: 0.010 + (idx % 4) * 0.0006, amp });
            });
        }

        function buildSiO23D(state) {
            const siSym = 'Si';
            const oSym = 'O';

            // Red de SiO2 basada en una red tetraédrica de Si.
            // Cada Si queda unido a 4 O con geometría tetraédrica exacta (109,5° alrededor del Si).
            // Cada O se coloca como oxígeno puente entre 2 Si, de modo que la estequiometría global sea SiO2.
            // Nota: para respetar simultáneamente la estequiometría 1:2 y la conectividad tetraédrica,
            // el número total de átomos no puede coincidir exactamente con el del diamante si este tiene solo C.
            const a = 5.2;
            const nx = 2, ny = 2, nz = 2;
            const basisA = [
                [0, 0, 0],
                [0, 0.5, 0.5],
                [0.5, 0, 0.5],
                [0.5, 0.5, 0]
            ];
            const basisB = [
                [0.25, 0.25, 0.25],
                [0.25, 0.75, 0.75],
                [0.75, 0.25, 0.75],
                [0.75, 0.75, 0.25]
            ];
            const siAtoms = [];
            const oAtoms = [];
            const bondPairs = [];
            const siKeySet = new Set();
            const oKeySet = new Set();
            const bondKeySet = new Set();

            function roundedKey(v) {
                return `${v.x.toFixed(4)}|${v.y.toFixed(4)}|${v.z.toFixed(4)}`;
            }
            function addSiRecord(fx, fy, fz) {
                const key = `${fx.toFixed(4)}|${fy.toFixed(4)}|${fz.toFixed(4)}`;
                if (siKeySet.has(key)) return;
                siKeySet.add(key);
                siAtoms.push({ pos: new THREE.Vector3(fx * a, fy * a, fz * a) });
            }

            for (let ix = 0; ix < nx; ix++) {
                for (let iy = 0; iy < ny; iy++) {
                    for (let iz = 0; iz < nz; iz++) {
                        basisA.forEach(([x, y, z]) => addSiRecord(ix + x, iy + y, iz + z));
                        basisB.forEach(([x, y, z]) => addSiRecord(ix + x, iy + y, iz + z));
                    }
                }
            }

            // Centrar primero los Si.
            const min = new THREE.Vector3(Infinity, Infinity, Infinity);
            const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
            siAtoms.forEach(rec => { min.min(rec.pos); max.max(rec.pos); });
            const center = min.clone().add(max).multiplyScalar(0.5);
            siAtoms.forEach(rec => rec.pos.sub(center));

            // Vecinos Si-Si de la red tetraédrica base.
            const nn = a * Math.sqrt(3) / 4;
            const thresh = nn * 1.05;
            for (let i = 0; i < siAtoms.length; i++) {
                for (let j = i + 1; j < siAtoms.length; j++) {
                    const d = siAtoms[i].pos.distanceTo(siAtoms[j].pos);
                    if (d <= thresh) {
                        const mid = siAtoms[i].pos.clone().add(siAtoms[j].pos).multiplyScalar(0.5);
                        const oKey = roundedKey(mid);
                        let oIndex = oAtoms.findIndex(o => roundedKey(o.pos) === oKey);
                        if (oIndex === -1) {
                            oIndex = oAtoms.length;
                            oAtoms.push({ pos: mid });
                        }
                        bondPairs.push({ siIndex: i, oIndex });
                        bondPairs.push({ siIndex: j, oIndex });
                    }
                }
            }

            const siStyle = getCPKAtomStyle(siSym);
            const oStyle = getCPKAtomStyle(oSym);
            siAtoms.forEach(rec => {
                const atom = makeMicroSphere(siSym, siStyle.radius * 0.76, siStyle.color, 0.10, 0.30);
                atom.position.copy(rec.pos);
                state.root.add(atom);
                state.atoms.push({ mesh: atom, basePos: rec.pos.clone(), phase: Math.random() * Math.PI * 2, speed: 0.010 });
            });
            oAtoms.forEach(rec => {
                const atom = makeMicroSphere(oSym, oStyle.radius * 0.58, oStyle.color, 0.10, 0.30);
                atom.position.copy(rec.pos);
                state.root.add(atom);
                state.atoms.push({ mesh: atom, basePos: rec.pos.clone(), phase: Math.random() * Math.PI * 2, speed: 0.012 });
            });

            bondPairs.forEach(({ siIndex, oIndex }) => {
                const key = `${siIndex}__${oIndex}`;
                if (bondKeySet.has(key)) return;
                bondKeySet.add(key);
                state.root.add(makeMicroLine(siAtoms[siIndex].pos, oAtoms[oIndex].pos, 0xf8fafc, 0.88, 0.64));
            });
        }

        function buildNobleGas3D(state) {
            const sym = currentScenario.e1 || 'Ne';
            state.boundingBox = 9.2;
            for (let i = 0; i < 14; i++) {
                const st = getCPKAtomStyle(sym);
                const a = makeMicroSphere(sym, st.radius * (0.95 + Math.random()*0.12), st.color, 0.04, 0.34);
                a.position.set((Math.random()-0.5)*16.0, (Math.random()-0.5)*11.5, (Math.random()-0.5)*14.0);
                const dir = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5));
                if (dir.length() < 0.001) dir.set(1, 0, 0);
                dir.normalize().multiplyScalar(0.095 + Math.random() * 0.025);
                state.root.add(a);
                // Noble gas atoms move in straight lines at constant speed between wall collisions.
                state.electrons.push({ mesh: a, velocity: dir, phaseState: 'noble_gas_atom' });
            }
        }

        function getCPKAtomStyle(sym) {
            const styles = {
                H:  { color: 0xffffff, radius: 0.46 },
                C:  { color: 0x5f5f5f, radius: 0.78 },
                N:  { color: 0x0000ff, radius: 0.72 },
                O:  { color: 0xff0d0d, radius: 0.70 },
                F:  { color: 0x7fe34a, radius: 0.66 },
                Cl: { color: 0x1ff01f, radius: 0.92 },
                Br: { color: 0xa62929, radius: 1.03 },
                I:  { color: 0x940094, radius: 1.18 },
                P:  { color: 0xff8000, radius: 1.02 },
                S:  { color: 0xffff30, radius: 1.00 },
                Si: { color: 0xd1a16b, radius: 1.05 },
                He: { color: 0xd9ffff, radius: 0.62 }, // cian muy claro
                Ne: { color: 0x9be7ff, radius: 0.72 }, // azul cielo claro
                Ar: { color: 0x66d6c9, radius: 0.88 }, // cian verdoso
                Kr: { color: 0x34b3d1, radius: 0.98 }, // turquesa intenso
                Xe: { color: 0x2f7f9f, radius: 1.08 }, // azul petróleo
                Rn: { color: 0x1f5f78, radius: 1.16 }, // azul petróleo oscuro
                Li: { color: 0xcc80ff, radius: 1.10 },
                Na: { color: 0xab5cf2, radius: 1.15 },
                K:  { color: 0x8f40d4, radius: 1.22 },
                Rb: { color: 0x702eb0, radius: 1.28 },
                Cs: { color: 0x57178f, radius: 1.34 },
                Be: { color: 0xc2ff00, radius: 0.96 },
                Mg: { color: 0x8aff00, radius: 1.05 },
                Ca: { color: 0x3dff00, radius: 1.15 },
                Sr: { color: 0x00ff00, radius: 1.22 },
                Ba: { color: 0x00c900, radius: 1.30 },
                Al: { color: 0xbfa6a6, radius: 1.05 }
            };
            return styles[sym] || { color: 0xb0b7c3, radius: 0.82 };
        }

        function makeCPKAtom(sym) {
            const st = getCPKAtomStyle(sym);
            const geo = new THREE.SphereGeometry(st.radius, 36, 36);
            const emissiveBoost = sym === 'H' ? 0.08 : (sym === 'F' ? 0.11 : 0.06);
            const mat = new THREE.MeshStandardMaterial({
                color: st.color,
                roughness: 0.36,
                metalness: 0.03,
                emissive: new THREE.Color(st.color).multiplyScalar(emissiveBoost)
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData.sym = sym;
            return mesh;
        }

        function getMolecularPhysicalStateRT(sc) {
            const f = sc.form || '';
            if (['I2', 'P4', 'S8', 'NI3', 'CI4', 'CBr4', 'SiI4'].includes(f)) return 'solid';
            if (['H2O', 'Br2'].includes(f)) return 'liquid';
            return 'gas';
        }

        function isLargeSolidDiatomicScenario() {
            if (!currentScenario || currentScenario.type !== 'covalent') return false;
            const phase = getMolecularPhysicalStateRT(currentScenario);
            if (phase !== 'solid') return false;
            const b = currentScenario.builder || {};
            const center = b.center || currentScenario.e1 || '';
            const periph = (b.periph && b.periph[0]) || currentScenario.e2 || currentScenario.e1 || '';
            const data = typeof getMolecularGeometryData === 'function' ? getMolecularGeometryData() : null;
            const isDiatomic = !!(data?.isDiatomic || ((b.periph || []).length === 1 && center === periph));
            if (!isDiatomic) return false;
            const maxR = Math.max(getCPKAtomStyle(center).radius, getCPKAtomStyle(periph).radius);
            return maxR >= 1.15;
        }

        function getDiatomicLonePairCap(pos) {
            if (!currentScenario || currentScenario.type !== 'covalent') return null;
            const b = currentScenario.builder || {};
            const data = typeof getMolecularGeometryData === 'function' ? getMolecularGeometryData() : null;
            const isDiatomic = !!(data?.isDiatomic || ((b.periph || []).length === 1));
            if (!isDiatomic) return null;
            const exp = b.expectedLp || {};
            if (pos === 'center') return Number.isFinite(exp.center) ? exp.center : null;
            const idx = Number(pos);
            if (!Number.isNaN(idx) && Array.isArray(exp.periph) && Number.isFinite(exp.periph[idx])) return exp.periph[idx];
            if (Array.isArray(exp.periph) && Number.isFinite(exp.periph[0])) return exp.periph[0];
            return null;
        }

        function getDiatomicScaleForPhase(phase, maxRadius) {
            if (phase === 'solid') {
                if (maxRadius >= 1.15) return 0.78;
                if (maxRadius >= 1.00) return 0.88;
                return 1.00;
            }
            if (phase === 'liquid') {
                if (maxRadius >= 1.00) return 0.92;
                return 1.00;
            }
            if (maxRadius <= 0.60) return 1.34;
            if (maxRadius <= 0.72) return 1.28;
            if (maxRadius <= 0.82) return 1.24;
            if (maxRadius <= 0.98) return 1.16;
            if (maxRadius <= 1.08) return 1.06;
            return 0.96;
        }


        function getCompactMolecule3DScale(formula, kind, phase, maxRadius) {
            const f = formula || '';
            if (['CO2', 'CS2'].includes(f)) return maxRadius >= 1.0 ? 0.78 : 0.88;
            if (['H2O', 'H2S', 'SF2', 'OF2', 'OCl2', 'SCl2'].includes(f)) return maxRadius >= 1.0 ? 0.86 : 0.96;
            if (['PH3', 'PCl3', 'PF3', 'PBr3', 'PI3', 'NH3', 'NF3', 'NCl3', 'NBr3', 'NI3'].includes(f)) return maxRadius >= 1.0 ? 0.82 : 0.94;
            if (kind === 'diatomic') return getDiatomicScaleForPhase(phase, maxRadius);
            return phase === 'gas' ? 1.35 : (phase === 'liquid' ? 0.98 : 0.95);
        }

        function makeSpaceFillingMoleculeGroup(kind, center, periph) {
            const g = new THREE.Group();
            const centerStyle = getCPKAtomStyle(center);
            const periphStyle = getCPKAtomStyle(periph);
            const centralAtom = makeCPKAtom(center);

            const addAtom = (pos, label) => {
                const a = makeCPKAtom(label);
                a.position.set(pos[0], pos[1], pos[2]);
                g.add(a);
            };

            const bondDist = Math.max(0.70, 0.82 * (centerStyle.radius + periphStyle.radius));

            if (kind === 'diatomic') {
                const a = makeCPKAtom(center);
                const b = makeCPKAtom(periph);
                a.position.set(-bondDist / 2, 0, 0);
                b.position.set( bondDist / 2, 0, 0);
                g.add(a); g.add(b);
                return g;
            }

            g.add(centralAtom);

            if (kind === 'lineal') {
                addAtom([-bondDist, 0, 0], periph);
                addAtom([ bondDist, 0, 0], periph);
            } else if (kind === 'angular') {
                const angle = 104.5 * Math.PI / 180;
                addAtom([ Math.sin(angle/2) * bondDist, -Math.cos(angle/2) * bondDist, 0], periph);
                addAtom([-Math.sin(angle/2) * bondDist, -Math.cos(angle/2) * bondDist, 0], periph);
            } else if (kind === 'pyramid') {
                const dirs = [
                    new THREE.Vector3(-0.78, -0.42, 0.46),
                    new THREE.Vector3( 0.78, -0.42, 0.46),
                    new THREE.Vector3( 0.00, -0.42,-0.92)
                ];
                dirs.forEach(v => {
                    v.normalize().multiplyScalar(bondDist);
                    addAtom([v.x, v.y, v.z], periph);
                });
            } else {
                const dirs = [
                    new THREE.Vector3( 1,  1,  1),
                    new THREE.Vector3(-1, -1,  1),
                    new THREE.Vector3(-1,  1, -1),
                    new THREE.Vector3( 1, -1, -1)
                ];
                dirs.forEach(v => {
                    v.normalize().multiplyScalar(bondDist);
                    addAtom([v.x, v.y, v.z], periph);
                });
            }
            return g;
        }

        function getLegendAtomSymbols() {
            const uniq = [];
            const add = s => { if (s && !uniq.includes(s)) uniq.push(s); };
            if (currentScenario.type === 'none') {
                add(currentScenario.e1);
            } else if (currentScenario.type === 'metallic') {
                add(currentScenario.e1);
            } else if (currentScenario.type === 'ionic') {
                add(currentScenario.e1);
                add(currentScenario.e2);
            } else if (currentScenario.type === 'covalent_atomic') {
                add(currentScenario.e1);
                if (currentScenario.e2 && currentScenario.e2 !== currentScenario.e1) add(currentScenario.e2);
            } else if (currentScenario.type === 'covalent') {
                const b = currentScenario.builder || {};
                add(b.center || currentScenario.e1);
                if (Array.isArray(b.periph) && b.periph.length) b.periph.forEach(add);
                else add(currentScenario.e2);
            }
            return uniq.filter(Boolean);
        }

        function getMicro3DStateText() {
            if (currentScenario.type === 'ionic' || currentScenario.type === 'metallic' || currentScenario.type === 'covalent_atomic') return 'sólido';
            if (currentScenario.type === 'none') return 'gaseoso';
            const ph = getMolecularPhysicalStateRT(currentScenario);
            if (ph === 'liquid') return 'líquido';
            if (ph === 'solid') return 'sólido';
            return 'gaseoso';
        }

        function getMicro3DHeaderText() {
            return `Modelo 3D microscópico a temperatura ambiente, Estado ${getMicro3DStateText()}`;
        }

        function getSimpleIonChargeText(sym, isCation) {
            const el = elementsDB[sym];
            if (!el) return isCation ? '+' : '−';
            if (isCation) {
                const n = el.val || 1;
                return n === 1 ? '+' : `${n}+`;
            }
            const n = sym === 'H' ? 1 : Math.max(1, 8 - (el.val || 7));
            return n === 1 ? '−' : `${n}−`;

        function getIonicVisualStyle(sym, isCation) {

            const an = {

            };
            const table = isCation ? cat : an;
            if (table[sym]) return table[sym];
            const fallback = getCPKAtomStyle(sym);
            return { color: fallback.color, radius: Math.max(0.60, Math.min(1.00, fallback.radius * (isCation ? 0.72 : 0.92))), name: getCPKColorName(sym) };
        }

        function getIonicModelScale() {
            const cat = getIonicVisualStyle(currentScenario.e1 || 'Na', true);
            const an = getIonicVisualStyle(currentScenario.e2 || 'Cl', false);
            const maxR = Math.max(cat.radius, an.radius);
            if (maxR >= 1.12) return 1.46;
            if (maxR >= 1.00) return 1.54;
            if (maxR >= 0.86) return 1.66;
            return 1.80;

        function getIonicModelCameraRadius() {

        function getMicro3DSubtitleText() {

            if (currentScenario.type === 'metallic') return `Red metálica de cationes CPK de ${formulaHtml}. ${legend}. e⁻ deslocalizados: cian`;

                if (formulaPlain === 'SiC') return `Red covalente 3D tipo diamante de ${formulaHtml}. ${legend}`;
                if (formulaPlain === 'C3N4') return `Red covalente 3D de ${formulaHtml}. C Td: 4 N a 109,5° · N unido a 3 C. ${legend}`;
                if (formulaPlain === 'SiO2') return `Red covalente 3D tipo cuarzo de ${formulaHtml}. ${legend}`;

                function addMolecularStateContainer(state, phase) {
            const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
            if (phase === 'liquid') {
                const radius = 8.2;
                const height = 9.5;
                const top = new THREE.Mesh(
                    new THREE.TorusGeometry(radius, 0.05, 10, 64),
                    new THREE.MeshBasicMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.35 })
                );
                top.rotation.x = Math.PI / 2;
                top.position.y = 4.2;
                state.root.add(top);
                const bottom = top.clone();
                bottom.position.y = -4.8;
                state.root.add(bottom);
                for (let i = 0; i < 10; i++) {
                    const a = new THREE.Vector3(radius*Math.cos(i*Math.PI*2/10), -4.8, radius*Math.sin(i*Math.PI*2/10));
                    const b = new THREE.Vector3(radius*Math.cos(i*Math.PI*2/10), 4.2, radius*Math.sin(i*Math.PI*2/10));
                    state.root.add(makeMicroLine(a, b, 0x93c5fd, 0.12));
                }
            } else if (phase === 'solid') {
                const s = 8.5;
                const pts = [
                    [-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],
                    [-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]
                ].map(p => new THREE.Vector3(...p));
                [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([i,j]) => {
                    state.root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts[i], pts[j]]), mat));
                });
            }
        }

        function buildMolecular3D(state) {
            const b = currentScenario.builder || {};
            const data = typeof getMolecularGeometryData === 'function' ? getMolecularGeometryData() : null;
            const center = b.center || currentScenario.e1 || 'A';
            const periph = (b.periph && b.periph[0]) || currentScenario.e2 || currentScenario.e1 || 'B';
            let kind = 'diatomic';
            if (data?.isDiatomic) kind = 'diatomic';
            else if (data?.geometry === 'lineal') kind = 'lineal';
            else if (data?.geometry === 'angular') kind = 'angular';
            else if (data?.geometry === 'piramide_triangular') kind = 'pyramid';
            else if (data?.geometry === 'tetraedrica') kind = 'tetra';

            const phase = getMolecularPhysicalStateRT(currentScenario);
            state.molecularPhase = phase;
            addMolecularStateContainer(state, phase);
            const maxMolecularAtomRadius = Math.max(getCPKAtomStyle(center).radius, getCPKAtomStyle(periph).radius);
            const isLargeSolidDiatomic = phase === 'solid' && kind === 'diatomic' && maxMolecularAtomRadius >= 1.15;

            let placements = [];
            let count = 0;
            if (phase === 'gas') {
                if (kind === 'diatomic') {
                    placements = [
                        [-7.6, 4.0, 1.0], [-6.2, 1.4, -4.8], [-5.0, -3.2, 4.4],
                        [-3.5, 4.8, 3.2], [-2.2, -1.6, 5.6], [-0.6, 2.0, -5.2],
                        [1.1, -4.2, -1.8], [2.8, 4.5, 4.3], [4.4, -2.8, -4.2],
                        [5.9, 2.9, -2.8], [7.2, -1.0, 2.4], [6.6, -4.3, 5.0],
                        [0.3, 5.4, 0.8], [-7.0, -0.5, -0.8]
                    ];
                } else {
                    placements = [
                        [-7.0, 3.4, 0.8], [-5.9, -2.6, -4.6], [-4.0, 5.0, 3.6],
                        [-2.5, -4.2, 3.1], [-1.0, 1.6, -5.5], [0.8, 5.1, 5.0],
                        [2.0, -3.6, -1.9], [3.8, 3.7, 4.4], [5.2, -2.4, -4.9],
                        [6.8, 0.0, 2.9], [0.0, -0.8, 0.0]
                    ];
                }
                count = placements.length;
                state.boundingBox = 11.5;
            } else if (phase === 'liquid') {
                count = currentScenario.form === 'H2O' ? 34 : 24;
                const radius = 7.0, yMin = -4.0, yMax = 3.5;
                for (let i = 0; i < count; i++) {
                    const rr = Math.sqrt(Math.random()) * radius;
                    const th = Math.random() * Math.PI * 2;
                    placements.push([rr*Math.cos(th), yMin + Math.random()*(yMax-yMin), rr*Math.sin(th)]);
                }
                state.boundingBox = 8.0;
            } else {
                const xs = isLargeSolidDiatomic ? [-4.6, 0, 4.6] : [-5.2, 0, 5.2];
                const ys = isLargeSolidDiatomic ? [-3.3, 1.0, 5.3] : [-3.8, 1.2, 6.0];
                const zs = isLargeSolidDiatomic ? [-3.8, 0.8, 4.4] : [-4.3, 1.0, 5.2];
                xs.forEach(x => ys.forEach(y => zs.forEach(z => {
                    if (placements.length < 18) placements.push([x, y - (isLargeSolidDiatomic ? 1.3 : 1.8), z]);
                })));
                count = placements.length;
                state.boundingBox = isLargeSolidDiatomic ? 9.8 : 8.6;
            }

            placements.forEach((p, i) => {
                const m = makeSpaceFillingMoleculeGroup(kind, center, periph);
                const scale = getCompactMolecule3DScale(currentScenario.form, kind, phase, maxMolecularAtomRadius);
                m.scale.setScalar(scale);
                m.position.set(...p);
                m.rotation.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
                state.root.add(m);

                let velocityScale = phase === 'gas' ? 0.08 : (phase === 'liquid' ? 0.035 : 0.004);
                state.molecules.push({
                    mesh: m,
                    basePos: new THREE.Vector3(...p),
                    phase: Math.random()*Math.PI*2,
                    speed: phase === 'solid' ? 0.002 : 0.012 + Math.random()*0.010,
                    phaseState: phase,
                    velocity: new THREE.Vector3(
                        (Math.random()-0.5)*velocityScale,
                        (Math.random()-0.5)*velocityScale,
                        (Math.random()-0.5)*velocityScale
                    ),
                    rotVelocity: new THREE.Vector3(
                        (Math.random()-0.5)*velocityScale*0.65,
                        (Math.random()-0.5)*velocityScale*0.65,
                        (Math.random()-0.5)*velocityScale*0.65
                    )
                });
            });
        }


        function animateMicro3D() {
            const state = window.__micro3dSceneState;
            if (!state) return;
            window.__micro3dAnimationId = requestAnimationFrame(animateMicro3D);
            const t = performance.now() * 0.001;

            state.ions.forEach(obj => {
                const amp = 0.12;
                obj.mesh.position.x = obj.basePos.x + Math.sin(t * 4 + obj.phase) * amp;
                obj.mesh.position.y = obj.basePos.y + Math.cos(t * 4.4 + obj.phase) * amp;
                obj.mesh.position.z = obj.basePos.z + Math.sin(t * 3.7 + obj.phase) * amp;
            });
            state.atoms.forEach(obj => {
                const amp = 0.045;
                obj.mesh.position.x = obj.basePos.x + Math.sin(t * 3 + obj.phase) * amp;
                obj.mesh.position.y = obj.basePos.y + Math.cos(t * 3.3 + obj.phase) * amp;
                obj.mesh.position.z = obj.basePos.z + Math.sin(t * 2.8 + obj.phase) * amp;
            });
            state.molecules.forEach(obj => {
                if (obj.phaseState === 'gas') {
                    obj.mesh.position.add(obj.velocity);
                    obj.mesh.rotation.x += obj.rotVelocity.x;
                    obj.mesh.rotation.y += obj.rotVelocity.y;
                    obj.mesh.rotation.z += obj.rotVelocity.z;
                    ['x','y','z'].forEach(axis => {
                        if (Math.abs(obj.mesh.position[axis]) > state.boundingBox) {
                            obj.mesh.position[axis] = Math.sign(obj.mesh.position[axis]) * state.boundingBox;
                            obj.velocity[axis] *= -1;
                        }
                    });
                } else if (obj.phaseState === 'liquid') {
                    obj.velocity.x += (Math.random()-0.5)*0.006;
                    obj.velocity.y += (Math.random()-0.5)*0.004;
                    obj.velocity.z += (Math.random()-0.5)*0.006;
                    obj.velocity.multiplyScalar(0.985);
                    if (obj.velocity.length() > 0.075) obj.velocity.normalize().multiplyScalar(0.075);
                    obj.mesh.position.add(obj.velocity);
                    obj.mesh.rotation.x += obj.rotVelocity.x;
                    obj.mesh.rotation.y += obj.rotVelocity.y;
                    obj.mesh.rotation.z += obj.rotVelocity.z;

                    const r = Math.sqrt(obj.mesh.position.x*obj.mesh.position.x + obj.mesh.position.z*obj.mesh.position.z);
                    const maxR = 7.2;
                    if (r > maxR) {
                        obj.mesh.position.x *= maxR/r;
                        obj.mesh.position.z *= maxR/r;
                        obj.velocity.x *= -0.65;
                        obj.velocity.z *= -0.65;
                    }
                    if (obj.mesh.position.y < -4.5) { obj.mesh.position.y = -4.5; obj.velocity.y = Math.abs(obj.velocity.y)*0.75; }
                    if (obj.mesh.position.y > 4.0) { obj.mesh.position.y = 4.0; obj.velocity.y = -Math.abs(obj.velocity.y)*0.75; }
                } else {
                    obj.mesh.position.x = obj.basePos.x + Math.sin(t * 3.0 + obj.phase) * 0.055;
                    obj.mesh.position.y = obj.basePos.y + Math.cos(t * 3.2 + obj.phase) * 0.045;
                    obj.mesh.position.z = obj.basePos.z + Math.sin(t * 2.7 + obj.phase) * 0.055;
                    obj.mesh.rotation.y += 0.0015;
                    obj.mesh.rotation.x += 0.0008;
                }
            });
            state.electrons.forEach(el => {
                if (el.phaseState === 'noble_gas_atom') {
                    // Ideal-gas didactic motion: straight trajectory, constant speed, elastic wall bounce.
                    el.mesh.position.add(el.velocity);
                    ['x','y','z'].forEach(axis => {
                        if (Math.abs(el.mesh.position[axis]) > state.boundingBox) {
                            el.mesh.position[axis] = Math.sign(el.mesh.position[axis]) * state.boundingBox;
                            el.velocity[axis] *= -1;
                        }
                    });
                    return;
                }
                el.velocity.x += (Math.random()-0.5)*0.018;
                el.velocity.y += (Math.random()-0.5)*0.018;
                el.velocity.z += (Math.random()-0.5)*0.018;
                if (el.velocity.length() > 0.20) el.velocity.normalize().multiplyScalar(0.20);
                el.mesh.position.add(el.velocity);
                ['x','y','z'].forEach(axis => {
                    if (Math.abs(el.mesh.position[axis]) > state.boundingBox) {
                        el.mesh.position[axis] = Math.sign(el.mesh.position[axis]) * state.boundingBox;
                        el.velocity[axis] *= -0.65;
                    }
                });
            });

            if (!state.isDragging) {
                if (currentScenario.type !== 'none') state.theta -= 0.0015;
                updateMicro3DCamera(state);
            }
            state.renderer.render(state.scene, state.camera);
        }

        function checkFormulaType() {

            inputArea.innerHTML = '';
            addUserMessage(typeLabels[selectedType]);

            const isHomo = currentScenario.e1 === currentScenario.e2;

            const isNone = currentScenario.type === 'none';
            const isMetallic = currentScenario.type === 'metallic';
            const isCovalentAtomic = currentScenario.type === 'covalent_atomic';

            let expectedType = '';
            if (isIonic || (isCovalentAtomic && !isHomo)) expectedType = 'unidad';
            else if (isNone || isMetallic || (isCovalentAtomic && isHomo)) expectedType = 'simbolo';
            else expectedType = 'molecular';

                if (selectedType === expectedType) {
                    let clarification = '';
                    if (isMetallic) {
                        clarification = '<br><br><b>Aclaración:</b> en un metal escribimos el <b>símbolo químico</b>, por ejemplo Fe, Cu o Na. Ese símbolo representa una <b>red metálica</b>, no una molécula aislada.';
                    } else if (isCovalentAtomic && isHomo) {
                        clarification = '<br><br><b>Aclaración:</b> en una sustancia covalente atómica elemental también puede escribirse solo el <b>símbolo químico</b>, por ejemplo C o Si, pero representa una <b>red covalente atómica</b>, no una red metálica.';
                    } else if (isNone) {
                        clarification = '<br><br><b>Aclaración:</b> en un gas noble escribimos el <b>símbolo químico</b>, por ejemplo Ne o Ar, pero representa <b>átomos aislados</b>, no una red.';
                    } else if (isIonic || (isCovalentAtomic && !isHomo)) {
                        clarification = '<br><br><b>Aclaración:</b> en las redes iónicas o covalentes atómicas con varios elementos, la fórmula indica la <b>proporción mínima</b> de la red, no una molécula aislada.';
                    }
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Correcto!</b> Efectivamente es una <b class="text-red-600 font-bold">${typeLabels[selectedType]}</b>.${clarification}<br><br>Ahora vamos a clasificar el <b>tipo de sustancia</b> que hemos formado.`);

                } else {
                    if (currentStepAttempts >= 3) {
                        addTutorMessage(`Has agotado tus 3 intentos. La respuesta correcta es <b class="text-red-600 font-bold">${typeLabels[expectedType]}</b>.`);
                        safeSetTimeout(() => stepSubstanceType(), 2000);
                    } else {
                        let hint = "";
                        if (currentStepAttempts === 1) {
                            hint = "Ese no es el tipo de fórmula correcto. Piensa si la estructura que elegiste antes forma moléculas aisladas, redes infinitas de repetición o átomos sueltos. Ojo: Fe, C y Ne pueden escribirse como símbolo químico, pero Fe representa una red metálica, C una red covalente atómica y Ne átomos aislados.";
                        } else {
                            if (isNone) {
                                hint = "Recuerda: Los gases nobles no se enlazan ni forman redes. Piensa en la forma más básica de designar a un elemento químico aislado.";
                            } else if (isMetallic) {
                                hint = "Recuerda: En los metales no hay moléculas aisladas. En el simulador usaremos como fórmula el símbolo químico del metal, por ejemplo Fe, Cu o Na. La notación Feₙ puede servir para explicar la red extendida, pero aquí no será la respuesta obligatoria.";
                            } else if (isCovalentAtomic && isHomo) {
                                hint = "Recuerda: Las redes atómicas infinitas de un único elemento se simplifican al máximo y se representan por su símbolo químico elemental.";
                            } else if (isIonic || (isCovalentAtomic && !isHomo)) {
                                hint = "Recuerda: Las redes cristalinas tridimensionales no forman moléculas individuales aisladas, su fórmula indica la proporción mínima de la red.";
                            } else {
                                hint = "Recuerda: Las sustancias formadas por pequeños grupos aislados de átomos se representan mediante fórmulas que indican el número exacto de átomos en ese grupo.";
                            }
                        }
                        addTutorMessage(`No exactamente. ${hint}`);
                        stepFormulaType(true);
                    }
                }
            }, 800);
        }

        // --- GEOMETRÍA Y POLARIDAD MOLECULAR (SOLO COVALENTES MOLECULARES) ---
        function getMolecularGeometryData() {
            if (!currentScenario || currentScenario.type !== 'covalent' || !currentScenario.builder) return null;

            const b = currentScenario.builder;
            const isDiatomic = b.periph.length === 1;
            const center = b.center;
            const centralLp = b.expectedLp.center || 0;
            const bondedAtoms = b.periph.length;
            const electronDomains = bondedAtoms + centralLp;

            let electronGeometry = 'lineal';
            let molecularGeometry = 'lineal';
            let angle = '180';
            let angleText = '180°';

            if (isDiatomic) {
                electronGeometry = 'lineal';
                molecularGeometry = 'lineal';
                angle = '180';
                angleText = '180°';
            } else if (electronDomains === 2) {
                electronGeometry = 'lineal';
                molecularGeometry = 'lineal';
                angle = '180';
                angleText = '180°';
            } else if (electronDomains === 3 && centralLp === 0) {
                electronGeometry = 'plano_triangular';
                molecularGeometry = 'plano_triangular';
                angle = '120';
                angleText = '120°';
            } else if (electronDomains === 3 && centralLp === 1) {
                electronGeometry = 'plano_triangular';
                molecularGeometry = 'angular';
                angle = 'menor120';
                angleText = '< 120°';
            } else if (electronDomains === 4 && centralLp === 0) {
                electronGeometry = 'tetraedrica';
                molecularGeometry = 'tetraedrica';
                angle = '109_5';
                angleText = '109,5°';
            } else if (electronDomains === 4 && centralLp === 1) {
                electronGeometry = 'tetraedrica';
                molecularGeometry = 'piramide_triangular';
                angle = 'aprox107';
                angleText = '≈ 107°';
            } else if (electronDomains === 4 && centralLp === 2) {
                electronGeometry = 'tetraedrica';
                molecularGeometry = 'angular';
                angle = 'aprox104_5';
                angleText = '≈ 104,5°';
            }

            const allSamePeripheral = b.periph.every(sym => sym === b.periph[0]);
            let individualBondsPolar = false;

            b.periph.forEach(sym => {
                if (isBondConsideredPolar(center, sym)) individualBondsPolar = true;
            });

            let moleculePolar = false;
            if (isDiatomic) {
                moleculePolar = individualBondsPolar;
            } else if (!individualBondsPolar) {
                moleculePolar = false;
            } else if (centralLp > 0) {
                moleculePolar = true;
            } else if ((molecularGeometry === 'lineal' || molecularGeometry === 'plano_triangular' || molecularGeometry === 'tetraedrica') && allSamePeripheral) {
                moleculePolar = false;
            } else {
                moleculePolar = true;
            }

            const formulaPolarityOverrides = {
                CO2: { bonds: true, molecule: false },
                CS2: { bonds: true, molecule: false },
                H2O: { bonds: true, molecule: true },
                H2S: { bonds: true, molecule: true },
                SF2: { bonds: true, molecule: true },
                OF2: { bonds: true, molecule: true },
                OCl2: { bonds: true, molecule: true },
                SCl2: { bonds: true, molecule: true },
                NH3: { bonds: true, molecule: true },
                NF3: { bonds: true, molecule: true },
                NCl3: { bonds: true, molecule: true },
                NBr3: { bonds: true, molecule: true },
                NI3: { bonds: true, molecule: true },
                PH3: { bonds: true, molecule: true },
                PF3: { bonds: true, molecule: true },
                PCl3: { bonds: true, molecule: true },
                PBr3: { bonds: true, molecule: true },
                PI3: { bonds: true, molecule: true },
                CH4: { bonds: true, molecule: false },
                CF4: { bonds: true, molecule: false },
                CCl4: { bonds: true, molecule: false },
                CBr4: { bonds: true, molecule: false },
                CI4: { bonds: true, molecule: false },
                SiH4: { bonds: true, molecule: false },
                SiF4: { bonds: true, molecule: false },
                SiCl4: { bonds: true, molecule: false },
                SiBr4: { bonds: true, molecule: false },
                SiI4: { bonds: true, molecule: false }
            };
            if (formulaPolarityOverrides[currentScenario.form]) {
                individualBondsPolar = formulaPolarityOverrides[currentScenario.form].bonds;
                moleculePolar = formulaPolarityOverrides[currentScenario.form].molecule;
            }

            // Fosfina: pirámide trigonal con momento dipolar experimental pequeño pero no nulo.
            if (currentScenario.form === 'PH3') {
                individualBondsPolar = true;
                moleculePolar = true;
            }

            return {
                center,
                expectedFocus: isDiatomic ? 'any' : center,
                isDiatomic,
                bondedAtoms,
                centralLp,
                electronDomains,
                electronGeometry,
                geometry: molecularGeometry,
                molecularGeometry,
                angle,
                angleText,
                individualBondsPolar,
                moleculePolar
            };
        }
