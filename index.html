                    html += `<input type="number" id="qty1" min="1" max="4" value="1" class="border-b-2 border-slate-400 bg-transparent w-10 text-lg text-center mx-1 focus:outline-none text-slate-800 bg-white">`;
                    html += `<input type="text" id="sym2" placeholder="Símb 2" maxlength="2" class="border-b-2 border-indigo-400 bg-transparent w-24 text-2xl text-center mx-1 focus:outline-none text-indigo-800 bg-indigo-50">`;
                    html += `<input type="number" id="qty2" min="1" max="4" value="1" class="border-b-2 border-slate-400 bg-transparent w-10 text-lg text-center mx-1 focus:outline-none text-slate-800 bg-white">`;
                }

                html += `       </div>
                                <button onclick="checkBalance()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-1.5 rounded">Fórmula Química</button>
                            </div>`;
                
                inputArea.innerHTML = html;

            }, isRetry ? 100 : 1000);
        }

        function checkBalance() {
            const isHomo = currentScenario.e1 === currentScenario.e2;
            const isIonic = currentScenario.type === 'ionic';
            const isNone = currentScenario.type === 'none';
            const isMetallic = currentScenario.type === 'metallic';
            const isCovalentAtomic = currentScenario.type === 'covalent_atomic';

            const sym1Raw = document.getElementById('sym1').value.trim();
            const sym2Raw = isHomo ? '' : document.getElementById('sym2').value.trim();
            const q1 = parseInt(document.getElementById('qty1').value) || 1;
            const q2 = isHomo ? 0 : parseInt(document.getElementById('qty2').value || 1);

            if (!sym1Raw || (!isHomo && !sym2Raw)) {
                addTutorMessage("Por favor, rellena las casillas con los símbolos químicos antes de comprobar.");
                return;
            }

            currentStepAttempts++;
            
            inputArea.innerHTML = '';
            
            let displayForm = isHomo
                ? `${sym1Raw}${q1 > 1 ? `<sub>${q1}</sub>` : ''}`
                : `${sym1Raw}${q1 > 1 ? `<sub>${q1}</sub>` : ''}${sym2Raw}${q2 > 1 ? `<sub>${q2}</sub>` : ''}`;
            
            addUserMessage(`Fórmula propuesta: ${displayForm}`);

            const expectedSym1 = currentScenario.e1;
            const expectedSym2 = currentScenario.e2;
            let expectedQty1 = 1;
            let expectedQty2 = 0;
            
            if (isCovalentAtomic && isHomo) {
                expectedQty1 = 1;
            } else if (isHomo) {
                expectedQty1 = (currentScenario.c1 || 1) + (currentScenario.c2 || 0);
            } else {
                expectedQty1 = currentScenario.c1;
                expectedQty2 = currentScenario.c2;
            }

            safeSetTimeout(() => {
                let isOrderReversed = false;
                let areSymsWrong = false;
                let areQtysWrong = false;
                let caseError = false;

                const sym1Lo = sym1Raw.toLowerCase();
                const sym2Lo = sym2Raw.toLowerCase();
                const expected1Lo = expectedSym1.toLowerCase();
                const expected2Lo = expectedSym2.toLowerCase();

                if (isHomo) {
                    if (sym1Lo !== expected1Lo) {
                        areSymsWrong = true;
                    } else {
                        if (sym1Raw !== expectedSym1) {
                            caseError = true;
                        }
                        if (q1 !== expectedQty1) {
                            areQtysWrong = true;
                        }
                    }
                } else {
                    const matchDirectLo = (sym1Lo === expected1Lo && sym2Lo === expected2Lo);
                    const matchReverseLo = (sym1Lo === expected2Lo && sym2Lo === expected1Lo);

                    if (!matchDirectLo && !matchReverseLo) {
                        areSymsWrong = true;
                    } else if (matchReverseLo) {
                        isOrderReversed = true;
                        if (sym1Raw !== expectedSym2 || sym2Raw !== expectedSym1) {
                            caseError = true;
                        }
                        if (q1 !== expectedQty2 || q2 !== expectedQty1) {
                            areQtysWrong = true;
                        }
                    } else {
                        if (sym1Raw !== expectedSym1 || sym2Raw !== expectedSym2) {
                            caseError = true;
                        }
                        if (q1 !== expectedQty1 || q2 !== expectedQty2) {
                            areQtysWrong = true;
                        }
                    }
                }

                let correctForm = isHomo
                    ? `${expectedSym1}${expectedQty1 > 1 ? `<sub>${expectedQty1}</sub>` : ''}`
                    : `${expectedSym1}${expectedQty1 > 1 ? `<sub>${expectedQty1}</sub>` : ''}${expectedSym2}${expectedQty2 > 1 ? `<sub>${expectedQty2}</sub>` : ''}`;

                const proceedToNextStep = (finalForm) => {
                    if (isIonic || isNone || isMetallic) stepMassCalculation(currentScenario.c1, currentScenario.c2);
                    else stepSubstanceOrCompound(finalForm);
                };

                if (!isOrderReversed && !areSymsWrong && !areQtysWrong && !caseError) {
                    if (isMetallic) {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Excelente deducción!</b> La fórmula del metal en el simulador es el <b>símbolo químico</b>: <b class="text-red-600 font-bold">${displayForm}</b>.<br><br>Nota: también puede hablarse de una red metálica extendida como Mₙ, pero aquí la fórmula que pedimos es el símbolo del elemento.`);
                    } else if (isCovalentAtomic && isHomo) {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Excelente deducción!</b> La fórmula obtenida es <b class="text-red-600 font-bold">${displayForm}</b>.<br><br>Aclaración: se escribe como símbolo químico, pero no es un metal; representa una <b>red covalente atómica</b>, como ocurre con C en diamante/grafito o Si.`);
                    } else if (isNone) {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Excelente deducción!</b> La fórmula obtenida es <b class="text-red-600 font-bold">${displayForm}</b>.<br><br>Aclaración: se escribe como símbolo químico porque es un <b>gas noble</b> formado por átomos aislados, no por moléculas ni redes.`);
                    } else {
                        addTutorMessage(`<b class="text-red-600 font-bold">¡Excelente deducción!</b> La fórmula obtenida es <b class="text-red-600 font-bold">${displayForm}</b>.`);
                    }
                    proceedToNextStep(displayForm);
                } else {
                    if (currentStepAttempts >= 3) {
                        let totalAtoms = expectedQty1 + expectedQty2;
                        let msg = '';
                        if (isMetallic) {
                            msg = `Has agotado tus 3 intentos. En un metal, la fórmula que usamos en el simulador es el <b>símbolo químico</b> del elemento.<br>La fórmula correcta es <b class="text-red-600 font-bold">${correctForm}</b>.`;
                        } else {
                            msg = isHomo
                                ? `Has agotado tus 3 intentos. Para esta sustancia necesitamos ${expectedQty1} átomo${expectedQty1 > 1 ? 's' : ''} de ${expectedSym1}.<br>La fórmula correcta es <b class="text-red-600 font-bold">${correctForm}</b>.`
                                : `Has agotado tus 3 intentos. Para equilibrar el enlace necesitamos ${expectedQty1} de ${expectedSym1} y ${expectedQty2} de ${expectedSym2}.<br>La fórmula correcta es <b class="text-red-600 font-bold">${correctForm}</b>.`;
                        }
                        addTutorMessage(msg);
                        safeSetTimeout(() => proceedToNextStep(correctForm), 2500);
                    } else {
                        let hint = "Casi. Necesitamos equilibrarlo bien. Inténtalo de nuevo.";
                        
                        if (currentStepAttempts === 1) {
                            if (areSymsWrong) {
                                hint = isHomo 
                                    ? `Revisa el símbolo químico. No coincide con el elemento con el que estamos trabajando.`
                                    : `Revisa los símbolos químicos. Alguno de los que has escrito no corresponde a los elementos que estamos uniendo.`;
                            } else if (caseError) {
                                hint = "<b>Revisa la escritura:</b> Ten cuidado con cómo se escriben los símbolos químicos de los elementos. Recuerda usar la mayúscula adecuada para comenzar.";
                            } else if (isOrderReversed) {
                                hint = "<b>Revisa el order:</b> Los símbolos de los elementos son correctos, pero fíjate sutilmente en el orden en que se colocan. ¿Cuál debe ir a la izquierda?";
                            } else if (areQtysWrong) {
                                hint = "<b>Revisa la proporción:</b> Los símbolos y su orden son correctos. Evalúa sutilmente la proporción numérica en la que se combinan para que la sustancia sea estable y neutra.";
                                if (isNone) {
                                    hint += "<br><br><b>Pista:</b> Recuerda que estos átomos ya son estables.";
                                } else if (isMetallic) {
                                    hint += "<br><br><b>Pista:</b> En este simulador, la fórmula de un metal es su símbolo químico: Fe, Cu, Na... No escribas subíndices ni Mₙ como respuesta.";
                                } else if (isCovalentAtomic) {
                                    hint += "<br><br><b>Pista:</b> Recuerda que estas sustancias forman inmensas redes gigantes, por lo que su fórmula se simplifica para indicar la unidad mínima de representación.";
                                } else if (isHomo) {
                                    hint += "<br><br><b>Pista:</b> Piensa en cuántos electrones le faltan a uno solo y cuántos pueden aportarse entre ellos para estabilizarse formando un par.";
                                } else if (!isIonic) {
                                    hint += "<br><br><b>Pista:</b> El átomo que necesita compartir <b>menos</b> electrones será el más numeroso.";
                                } else {
                                    hint += "<br><br><b>Pista:</b> El átomo que intercambia <b>menos</b> electrones se necesitará en mayor cantidad.";
                                }
                            }
                        } else if (currentStepAttempts === 2) {
                            if (areSymsWrong) {
                                hint = isHomo 
                                    ? `Asegúrate de escribir el símbolo correcto para el átomo implicado (${expectedSym1}).` 
                                    : `Asegúrate de usar los símbolos correctos de los elementos que estamos enlazando (${expectedSym1} y ${expectedSym2}).`;
                            } else if (caseError) {
                                hint = "<b>Error de mayúsculas:</b> Los símbolos químicos de la tabla periódica son sensibles a las mayúsculas. La primera letra SIEMPRE debe ser mayúscula y la segunda (si existe) SIEMPRE minúscula. Por ejemplo: escribe <b>Ba</b> (no 'ba' ni 'BA') o <b>Cl</b> (no 'cl' ni 'CL').";
                            } else if (isOrderReversed) {
                                hint = "<b>Norma de orden (IUPAC):</b> Al escribir una fórmula química, el elemento menos electronegativo (el más metálico o catión) se coloca siempre a la izquierda, y el más electronegativo (no metal o anión) a la derecha. ¡Inviértelos!";
                            } else if (areQtysWrong) {
                                hint = "<b>Error de proporción:</b> No has equilibrado bien las cantidades de átomos.";
                                if (isNone) {
                                    hint += "<br><br><b>Truco:</b> Recuerda que estos átomos ya son estables y no se unen (proporción = 1).";
                                } else if (isMetallic) {
                                    hint += "<br><br><b>Truco:</b> Para metales, escribe solo el símbolo químico del elemento, por ejemplo Fe. No uses Fe₂ ni Feₙ como respuesta del simulador.";
                                } else if (isCovalentAtomic && isHomo) {
                                    hint += "<br><br><b>Truco:</b> Se escribe como símbolo químico, pero estructuralmente es una red covalente atómica, no un metal ni un gas noble.";
                                } else if (isCovalentAtomic && !isHomo) {
                                    hint += "<br><br><b>Truco:</b> Piensa en que por cada átomo de Silicio (que requiere compartir 4 electrones) necesitaremos los correspondientes de Oxígeno/Carbono según la proporción.";
                                } else if (isHomo) {
                                    hint += "<br><br><b>Truco:</b> Las sustancias simples de estos no metales son siempre diatómicas.";
                                } else {
                                    hint += "<br><br><b>Truco:</b> Intenta cruzar los números (regla del aspa). Los electrones que necesita el primero, ponlos como cantidad de átomos del segundo.";
                                }
                            }
                        }
                        
                        addTutorMessage(hint);
                        stepAtomsBalance(elementsDB[currentScenario.e1], elementsDB[currentScenario.e2], true);
                    }
                }
            }, 600);
        }

        // --- SUSTANCIA VS COMPUESTO ---
        function stepSubstanceOrCompound(displayForm, isRetry = false) {
            if (!isRetry) currentStepAttempts = 0;
            
            safeSetTimeout(() => {
                if (!isRetry) {
                    addTutorMessage(`Esta sustancia química que acabamos de formar (<b>${displayForm}</b>), ¿es una sustancia simple o un compuesto químico?`);
                }

                inputArea.innerHTML = `
                    <div class="flex flex-col space-y-1 fade-in font-sans">
                        <select id="substTypeSelect" class="border border-slate-300 rounded px-2 py-1 focus:ring-2 outline-none w-full text-sm bg-white text-slate-800">
                            <option value="">Selecciona...</option>
                            <option value="simple">Sustancia simple o elemento químico</option>
                            <option value="compuesto">Compuesto químico</option>
                        </select>
                        <button onclick="checkSubstanceOrCompound('${displayForm}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 rounded transition-colors font-sans">Comprobar</button>
                    </div>
                `;
            }, isRetry ? 100 : 1000);
        }

        function checkSubstanceOrCompound(displayForm) {
            currentStepAttempts++;
            const selectEl = document.getElementById('substTypeSelect');
            const selectedType = selectEl.value;

            if (!selectedType) {
                addTutorMessage("Por favor, selecciona una opción.");
                return;
            }

            inputArea.innerHTML = '';
            addUserMessage(selectedType === 'simple' ? 'Sustancia simple o elemento químico' : 'Compuesto químico');

            const isHomo = currentScenario.e1 === currentScenario.e2;
            const isNone = currentScenario.type === 'none';
            const isMetallic = currentScenario.type === 'metallic';
            const isIonic = currentScenario.type === 'ionic';
            const isCovalentAtomic = currentScenario.type === 'covalent_atomic';
            const expectedType = (isHomo || (isCovalentAtomic && currentScenario.e1 === currentScenario.e2)) ? 'simple' : 'compuesto';

            const proceedToNextStep = () => {
                if (isIonic || isNone || isMetallic) stepMassCalculation(currentScenario.c1 || 1, currentScenario.c2 || 0);
                else startInteractiveLewis(displayForm);
            };

            safeSetTimeout(() => {
                if (selectedType === expectedType) {
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Correcto!</b> Efectivamente es un${expectedType === 'simple' ? 'a <b class="text-red-600 font-bold">sustancia simple o elemento químico</b>' : ' <b class="text-red-600 font-bold">compuesto químico</b>'}.`);
                    proceedToNextStep();
                } else {
                    if (currentStepAttempts >= 3) {
                        addTutorMessage(`Has agotado tus 3 intentos. La respuesta correcta es que es un${expectedType === 'simple' ? 'a <b class="text-red-600 font-bold">sustancia simple o elemento químico</b>' : ' <b class="text-red-600 font-bold">compuesto químico</b>'}.`);
                        safeSetTimeout(() => proceedToNextStep(), 2000);
                    } else {
                        let hint = "";
                        if (isNone) {
                            hint = "Recuerda que esta sustancia está formada por átomos del mismo elemento químico.";
                        } else if (isHomo || (isCovalentAtomic && currentScenario.e1 === currentScenario.e2)) {
                            hint = "Recuerda que esta sustancia está formada por átomos del mismo elemento químico.";
                        } else {
                            hint = "Recuerda que esta sustancia está formada por la unión de átomos de elementos químicos diferentes.";
                        }
                        addTutorMessage(`No exactamente. ${hint}`);
                        stepSubstanceOrCompound(displayForm, true);
                    }
                }
            }, 800);
        }

        // --- CONSTRUCTOR INTERACTIVO DE LEWIS ---
        function startInteractiveLewis(displayForm) {
            currentStepAttempts = 0;
            safeSetTimeout(() => {
                if (currentScenario.type === 'covalent_atomic') {
                    if ((currentScenario.form || '') === 'SiO2') {
                        addTutorMessage(`Dado que es una <b>red covalente gigante</b>, construye en la pizarra la <b>unidad local tetraédrica</b>: un <b>Si</b> central unido a <b>4 O</b>.<br><br><b>Importante:</b> cada <b>O</b> es un <b>oxígeno puente</b>, así que además de unirse al Si central seguirá conectado a <b>otro Si</b> de la red. Por eso la unidad local parece <b>SiO<sub>4</sub></b>, pero la <b>fórmula global</b> sigue siendo <b>SiO<sub>2</sub></b> (<b>SiO<sub>4</sub>/2 = SiO<sub>2</sub></b>).`);
                    } else if ((currentScenario.form || '') === 'SiC') {
                        addTutorMessage(`El <b>carborundo (SiC)</b> es una <b>red covalente gigante</b> del tipo <b>diamante / blenda de cinc</b>. Construye una <b>unidad local tetraédrica</b>: un <b>Si</b> central unido a <b>4 C</b>.<br><br>Recuerda que en la red real cada <b>C</b> seguirá unido a otros <b>Si</b>, así que la <b>proporción global</b> se mantiene como <b>SiC</b>.`);
                    } else if ((currentScenario.form || '') === 'C3N4') {
                        addTutorMessage(`Trabajamos con un modelo didáctico de <b>C<sub>3</sub>N<sub>4</sub> denso/superduro 3D</b>. Construye una <b>unidad local</b> con un <b>C</b> central <b>tetraédrico (sp<sup>3</sup>)</b> unido a <b>4 N</b>.<br><br>En la red 3D, cada <b>N</b> debe entenderse como un átomo <b>tricoordinado</b>, unido a <b>3 C</b>. Para simplificar el modelo tridimensional, <b>no representamos pares de electrones libres</b>. Por eso la <b>unidad local</b> no coincide exactamente con la <b>fórmula global</b>, que sigue siendo <b>C<sub>3</sub>N<sub>4</sub></b>.`);
                    } else {
                        addTutorMessage(`Dado que es una <b>red covalente gigante</b>, construye la <b>unidad estructural básica</b> (el núcleo central rodeado de sus vecinos inmediatos) en la pizarra.<br><br><b>Ojo:</b> Como los átomos periféricos se conectarán a otros de la red, <b>déjalos solo con los electrones y enlaces estrictamente necesarios para esta unidad</b> (no intentes cerrar su octeto con pares solitarios inventados).`);
                    }
                } else {
                    addTutorMessage(`Dado que es un enlace covalente, <b>construye su Estructura de Lewis</b> en la pizarra de trabajo para que todos cumplan la regla del octeto (o dueto).`);
                }
                
                const b = currentScenario.builder;
                builderState.allAtoms = [];
                let aId = 0;
                builderState.allAtoms.push({ id: `a${aId++}`, sym: b.center });
                b.periph.forEach(sym => { builderState.allAtoms.push({ id: `a${aId++}`, sym: sym }); });
                
                builderState.inventory = [...builderState.allAtoms];
                builderState.placed = { center: null, 0: null, 1: null, 2: null, 3: null };
                builderState.bonds = [0, 0, 0, 0];
                builderState.lp = { center: 0, 0: 0, 1: 0, 2: 0, 3: 0 };
                
                renderBuilderUI();

                inputArea.innerHTML = `
                    <div class="flex flex-col fade-in">
                        <button onclick="checkInteractiveLewis('${displayForm}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 rounded shadow-md transition-colors font-sans">Evaluar mi estructura</button>
                    </div>
                `;
            }, 1000);
        }

        function checkInteractiveLewis(displayForm) {
            currentStepAttempts++;
            const b = currentScenario.builder;
            const isDiatomic = b.periph.length === 1;
            
            if (builderState.inventory.length > 0) {
                addTutorMessage("¡Aún tienes átomos en el inventario! Arrástralos todos a la cuadrícula.");
                return;
            }

            const cPlaced = builderState.placed['center'];
            if (!cPlaced) {
                addTutorMessage("Te falta colocar un átomo en el hueco central de la cuadrícula.");
                return;
            }
            if (!isDiatomic && cPlaced.sym !== b.center) {
                if(currentStepAttempts >= 3) {
                    addTutorMessage("Has agotado tus 3 intentos. Te muestro la Estructura de Lewis correcta.");
                    autoSolveLewis(); freezeLewisBoard();
                    safeSetTimeout(() => stepMassCalculation(currentScenario.c1, currentScenario.c2), 3000);
                    return;
                }
                addTutorMessage(`El átomo que has puesto en el centro (${cPlaced.sym}) no es el correcto. Recuerda que suele ser el que puede formar más enlaces.`);
                return;
            }

            let missingBonds = false; let wrongBonds = false; let bondsToVoid = false; let bondSum = 0;
            let wrongLp = false;
            let totalLp = builderState.lp['center'];
            
            if (builderState.lp['center'] !== b.expectedLp.center) wrongLp = true;

            if (isDiatomic) {
                let pSlot = -1;
                for (let i = 0; i < 4; i++) {
                    if (builderState.placed[i] !== null) pSlot = i;
                }
                
                if (pSlot === -1) {
                    addTutorMessage("Te falta colocar el otro átomo en uno de los huecos periféricos.");
                    return;
                }
                
                const bondLvl = builderState.bonds[pSlot];
                if (bondLvl === 0) missingBonds = true;
                else if (bondLvl !== b.expectedBondLevel) wrongBonds = true;
                bondSum += bondLvl;
                
                for (let i = 0; i < 4; i++) {
                    if (i !== pSlot && builderState.bonds[i] > 0) bondsToVoid = true;
                }
                
                totalLp += builderState.lp[pSlot];
                if (builderState.lp[pSlot] !== b.expectedLp.periph[0]) wrongLp = true;
                
            } else {
                // Orientation-independent Lewis evaluation:
                // top / left / right / bottom positions are equivalent if the atom set,
                // the bond orders, and the lone pairs are chemically correct.
                const occupiedSlots = [];
                for (let i = 0; i < 4; i++) {
                    const atomObj = builderState.placed[i];
                    const bondLvl = builderState.bonds[i];
                    if (atomObj) {
                        occupiedSlots.push(i);
                        if (bondLvl === 0) missingBonds = true;
                        else if (bondLvl !== b.expectedBondLevel) wrongBonds = true;
                        bondSum += bondLvl;
                    } else if (bondLvl > 0) {
                        bondsToVoid = true;
                    }
                }

                const expectedPeriph = Array.isArray(b.periph) ? [...b.periph] : [];
                if (occupiedSlots.length !== expectedPeriph.length) {
                    missingBonds = true;
                }

                const usedExpected = new Set();
                for (const slot of occupiedSlots) {
                    const placedSym = builderState.placed[slot]?.sym;
                    let expectedIdx = -1;
                    for (let j = 0; j < expectedPeriph.length; j++) {
                        if (!usedExpected.has(j) && expectedPeriph[j] === placedSym) {
                            expectedIdx = j;
                            break;
                        }
                    }

                    if (expectedIdx === -1) {
                        wrongBonds = true;
                        totalLp += builderState.lp[slot] || 0;
                        continue;
                    }

                    usedExpected.add(expectedIdx);
                    totalLp += builderState.lp[slot] || 0;
                    const expectedLpForThisAtom = b.expectedLp.periph[expectedIdx] ?? 0;
                    if ((builderState.lp[slot] || 0) !== expectedLpForThisAtom) wrongLp = true;
                }

                if (usedExpected.size !== expectedPeriph.length) {
                    missingBonds = true;
                }
            }

            let errors = [];
            if (bondsToVoid) errors.push("enlaces que no apuntan a ningún átomo");
            else if (missingBonds) errors.push("enlaces que faltan por trazar");
            else if (wrongBonds) errors.push("tipo de enlaces (simples/dobles)");
            if (wrongLp) errors.push("pares solitarios en los átomos");

            inputArea.innerHTML = '';
            addUserMessage(`Estructura propuesta: ${bondSum} enlaces y ${totalLp} pares solitarios.`);

            safeSetTimeout(() => {
                if(errors.length === 0) {
                    let msg = `<b class="text-red-600 font-bold">¡Brillante!</b> Has construido la Estructura de Lewis perfectamente.`;
                    if (currentScenario.type === 'covalent_atomic') {
                        msg += ` <br><br>Al ser una red gigante, imagina que de los átomos periféricos salen más enlaces hacia otros átomos, extendiéndose de forma infinita en las tres dimensiones.`;
                        if ((currentScenario.form || '') === 'SiO2') {
                            msg += ` <br><br>En <b>SiO<sub>2</sub></b>, la unidad local es <b>SiO<sub>4</sub></b>, pero cada oxígeno se comparte con <b>otro Si</b>. Por eso la relación global es <b>SiO<sub>4</sub>/2 = SiO<sub>2</sub></b>.`;
                        }
                    } else {
                        msg += " Se aprecian muy bien los pares compartidos y los libres.";
                    }
                    addTutorMessage(msg);
                    freezeLewisBoard();
                    stepMassCalculation(currentScenario.c1, currentScenario.c2);
                } else {
                    if(currentStepAttempts >= 3) {
                        addTutorMessage("Has agotado tus 3 intentos. Te he generado la Estructura de Lewis correcta en la pizarra.");
                        autoSolveLewis(); freezeLewisBoard();
                        safeSetTimeout(() => stepMassCalculation(currentScenario.c1, currentScenario.c2), 3000);
                    } else {
                        let hint = "Revisa bien si todos los átomos cumplen el octeto (o dueto). Cuenta los electrones que aporta cada enlace y los que quedan libres.";
                        addTutorMessage(`Mmm, hay algo que ajustar en los <b>${errors.join(" y ")}</b>. <br><br>${hint}`);
                        safeSetTimeout(() => {
                            inputArea.innerHTML = `
                                <div class="flex flex-col fade-in">
                                    <button onclick="checkInteractiveLewis('${displayForm}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 rounded shadow-md transition-colors font-sans font-sans">Volver a evaluar</button>
                                </div>
                            `;
                        }, 500);
                    }
                }
            }, 800);
        }

        function renderBuilderUI() {
            let inventoryHtml = builderState.inventory.map(a =>
                `<div id="${a.id}" class="lewis-cell atom-box draggable-atom" draggable="true" ondragstart="handleDragStart(event, '${a.id}')">${a.sym}</div>`
            ).join('');

            let html = `
                <div class="mb-1 w-full px-6 font-sans" id="inventory-area">
                    <div class="text-sm font-semibold text-slate-600 mb-1 text-center"><i class="fas fa-boxes mr-1"></i> Inventario de átomos:</div>
                    <div class="flex flex-wrap gap-3 justify-center items-center min-h-[64px] p-3 border-2 border-dashed border-slate-300 rounded-lg bg-slate-100 shadow-inner dropzone"
                         ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="handleDropEvent(event, 'inventory')">
                         ${inventoryHtml || '<span class="text-slate-400 text-xs italic">Vacío</span>'}
                    </div>
                </div>
            `;

            const getDropzoneHtml = (pos, col, row) => {
                const atom = builderState.placed[pos];
                let atomClass = pos === 'center' ? 'center-atom-placed' : 'periph-atom-placed';
                let content = atom 
                    ? `<div id="${atom.id}" class="w-full h-full rounded-full flex items-center justify-center draggable-atom ${atomClass}" draggable="true" ondragstart="handleDragStart(event, '${atom.id}')" onclick="cycleLp('${pos}')">
                           ${atom.sym} ${drawLp(builderState.lp[pos], pos)}
                       </div>`
                    : '<span class="text-slate-300 text-[10px] tracking-tight">Drop</span>';
                
                return `<div class="lewis-cell atom-box dropzone" style="grid-column: ${col}; grid-row: ${row};"
                             ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="handleDropEvent(event, '${pos}')">
                            ${content}
                        </div>`;
            };

            const getBondHtml = (index, col, row, isHorizontal) => {
                const canBond = builderState.placed['center'] && builderState.placed[index];
                const activeClass = canBond ? 'bond-box-active' : '';
                const drawFunc = isHorizontal ? drawBondH : drawBondV;
                const bondClass = isHorizontal ? 'bond-h' : 'bond-v';
                
                return `<div class="lewis-cell bond-box ${activeClass}" style="grid-column: ${col}; grid-row: ${row};" onclick="cycleBond(${index})">
                            <div class="${bondClass}">
                                ${drawFunc(builderState.bonds[index])}
                            </div>
                        </div>`;
            };

            html += `<div class="lewis-board shadow-sm relative">`;
            html += getDropzoneHtml('center', 3, 3);
            html += getDropzoneHtml(0, 1, 3); // Left
            html += getDropzoneHtml(1, 5, 3); // Right
            html += getDropzoneHtml(2, 3, 5); // Bottom
            html += getDropzoneHtml(3, 3, 1); // Top
            
            html += getBondHtml(0, 2, 3, true);  // Left Bond
            html += getBondHtml(1, 4, 3, true);  // Right Bond
            html += getBondHtml(2, 3, 4, false); // Bottom Bond
            html += getBondHtml(3, 3, 2, false); // Top Bond
            html += "</div>";
            
            html += `<div class="mt-1.5 text-center" id="lewis-reset">
                        <button onclick="resetLewisBoard()" class="text-xs text-red-500 hover:text-red-700 underline px-2 py-1 font-sans"><i class="fas fa-trash-alt mr-1"></i> Limpiar pizarra</button>
                     </div>`;
            
            html += `<div class="text-xs text-slate-500 mt-1 text-center max-w-sm font-sans" id="lewis-instructions">
                        <b>1)</b> Arrastra los átomos a los huecos. <br>
                        <b>2)</b> Clica entre ellos para crear enlaces. <br>
                        <b>3)</b> Clica en <b>cualquier átomo</b> colocado para añadirle sus pares solitarios (··).
                     </div>`;

            document.getElementById('stage-content').innerHTML = `<div class="fade-in w-full flex flex-col items-center">${html}</div>`;
        }

        function drawLp(lpCount, pos, forStatic = false) {
            if (lpCount === 0) return '';
            
            let available = [];
            if (pos === 'center') {
                available = ['top', 'bottom', 'left', 'right'];
                if (builderState.placed[0]) available = available.filter(s => s !== 'left');
                if (builderState.placed[1]) available = available.filter(s => s !== 'right');
                if (builderState.placed[2]) available = available.filter(s => s !== 'bottom');
                if (builderState.placed[3]) available = available.filter(s => s !== 'top');
            } else if (pos == 0) { available = ['top', 'bottom', 'left']; }
              else if (pos == 1) { available = ['top', 'bottom', 'right']; }
              else if (pos == 2) { available = ['bottom', 'left', 'right']; }
              else if (pos == 3) { available = ['top', 'left', 'right']; }

            let html = '';
            const styles = {
                'top': 'top: -4px; left: 50%; transform: translateX(-50%);',
                'bottom': 'bottom: -4px; left: 50%; transform: translateX(-50%);',
                'left': 'left: -4px; top: 50%; transform: translateY(-50%) rotate(90deg);',
                'right': 'right: -4px; top: 50%; transform: translateY(-50%) rotate(90deg);'
            };

            const fallbackSlots = ['top', 'bottom', 'left', 'right'];

            for (let i = 0; i < lpCount; i++) {
                let slot = available[i];
                if (!slot) {
                    const centerDir = pos == 0 ? 'right' : pos == 1 ? 'left' : pos == 2 ? 'top' : pos == 3 ? 'bottom' : '';
                    slot = fallbackSlots.find(s => !available.includes(s) && s !== centerDir);
                    if(!slot) slot = fallbackSlots[i % 4]; 
                }
                html += `<div class="lp-dot" style="${styles[slot]}">··</div>`;
            }
            return html;
        }

        function drawBondH(level) {
            if (level === 0) return '<span class="text-slate-300 text-[10px] tracking-tighter self-center">click</span>';
            let lines = '';
            for(let i=0; i<level; i++) lines += '<div class="bond-line-h"></div>';
            return lines;
        }

        function drawBondV(level) {
            if (level === 0) return '<span class="text-slate-300 text-[10px] tracking-tighter self-center" style="writing-mode: vertical-rl">click</span>';
            let lines = '';
            for(let i=0; i<level; i++) lines += '<div class="bond-line-v"></div>';
            return lines;
        }

        function autoSolveLewis() {
            const b = currentScenario.builder;
            builderState.inventory = [];
            builderState.bonds = [0,0,0,0];
            builderState.lp = { center: b.expectedLp.center, 0: 0, 1: 0, 2: 0, 3: 0 };
            builderState.placed = { center: null, 0: null, 1: null, 2: null, 3: null };

            let unusedAtoms = [...builderState.allAtoms];
            let centerIdx = unusedAtoms.findIndex(a => a.sym === b.center);
            builderState.placed['center'] = unusedAtoms.splice(centerIdx, 1)[0];

            for (let i = 0; i < b.periph.length; i++) {
                let pIdx = unusedAtoms.findIndex(a => a.sym === b.periph[i]);
                let slotIdx = (b.periph.length === 1) ? 1 : i;
                builderState.placed[slotIdx] = unusedAtoms.splice(pIdx, 1)[0];
                builderState.bonds[slotIdx] = b.expectedBondLevel;
                builderState.lp[slotIdx] = b.expectedLp.periph[i];
            }
            renderBuilderUI();
        }

        function freezeLewisBoard() {
            document.querySelectorAll('[draggable="true"]').forEach(el => el.removeAttribute('draggable'));
            document.querySelectorAll('.dropzone').forEach(el => el.classList.remove('dropzone'));
            document.querySelectorAll('.bond-box').forEach(el => el.onclick = null);
            document.querySelectorAll('.bond-box-active').forEach(el => el.classList.remove('bond-box-active', 'cursor-pointer'));
            document.querySelectorAll('.center-atom-placed, .periph-atom-placed').forEach(el => el.onclick = null);
            // Se mantienen las funciones globales para que el siguiente caso vuelva a permitir pares libres.
            
            const invArea = document.getElementById('inventory-area');
            if(invArea) invArea.style.display = 'none';
            const inst = document.getElementById('lewis-instructions');
            if(inst) inst.style.display = 'none';
            const resetBtn = document.getElementById('lewis-reset');
            if(resetBtn) resetBtn.style.display = 'none';
        }

        function generateStaticLewisHTML(scenario) {
            const b = scenario.builder;
            const expectedLp = b.expectedLp;
            const isCovAt = scenario.type === 'covalent_atomic';
            
            const placed = { center: true, 0: b.periph.length > 0, 1: b.periph.length > 1, 2: b.periph.length > 2, 3: b.periph.length > 3 };
            
            if (b.periph.length === 1) {
                placed[0] = false; placed[1] = true; placed[2] = false; placed[3] = false;
            }
            
            const bonds = { 0: placed[0] ? b.expectedBondLevel : 0, 1: placed[1] ? b.expectedBondLevel : 0, 2: placed[2] ? b.expectedBondLevel : 0, 3: placed[3] ? b.expectedBondLevel : 0 };

            function localDrawLp(lpCount, pos) {
                if (lpCount === 0) return '';
                let available = [];
                if (pos === 'center') {
                    available = ['top', 'bottom', 'left', 'right'];
                    if (placed[0]) available = available.filter(s => s !== 'left');
                    if (placed[1]) available = available.filter(s => s !== 'right');
                    if (placed[2]) available = available.filter(s => s !== 'bottom');
                    if (placed[3]) available = available.filter(s => s !== 'top');
                } else if (pos == 0) { available = ['top', 'bottom', 'left']; }
                  else if (pos == 1) { available = ['top', 'bottom', 'right']; }
                  else if (pos == 2) { available = ['bottom', 'left', 'right']; }
                  else if (pos == 3) { available = ['top', 'left', 'right']; }

                let h = '';
                const styles = {
                    'top': 'top: -4px; left: 50%; transform: translateX(-50%);',
                    'bottom': 'bottom: -4px; left: 50%; transform: translateX(-50%);',
                    'left': 'left: -4px; top: 50%; transform: translateY(-50%) rotate(90deg);',
                    'right': 'right: -4px; top: 50%; transform: translateY(-50%) rotate(90deg);'
                };
                for (let i = 0; i < lpCount; i++) {
                    if(available[i]) h += `<div class="lp-dot" style="${styles[available[i]]}">··</div>`;
                }
                return h;
            }

            let html = '<div class="lewis-board shadow-none border-none bg-transparent !p-0 transform scale-90" style="pointer-events: none; margin-bottom: 0;">';

            html += `<div class="lewis-cell atom-box center-atom-placed" style="grid-column: 3; grid-row: 3; border-color: ${isCovAt?'#94a3b8':'#818cf8'};">
                        ${b.center} ${localDrawLp(expectedLp.center, 'center')}
                     </div>`;
            
            const drawH = (lvl) => { let l = ''; for(let i=0; i<lvl; i++) l += '<div class="bond-line-h"></div>'; return `<div class="bond-h">${l}</div>`; };
            const drawV = (lvl) => { let l = ''; for(let i=0; i<lvl; i++) l += '<div class="bond-line-v"></div>'; return `<div class="bond-v">${l}</div>`; };

            if (placed[0]) {
                let dash0 = isCovAt ? `<div style="position:absolute; width: 25px; border-bottom: 3px dashed #94a3b8; right: 100%; top: 50%;"></div>` : '';
                html += `<div class="lewis-cell atom-box periph-atom-placed" style="grid-column: 1; grid-row: 3; position: relative; border-color: ${isCovAt?'#94a3b8':'#cbd5e1'};">${b.periph[0]} ${localDrawLp(expectedLp.periph[0], 0)}${dash0}</div>`;
                html += `<div class="lewis-cell bond-box" style="grid-column: 2; grid-row: 3;">${drawH(bonds[0])}</div>`;
            }
            if (placed[1]) {
                let dash1 = isCovAt ? `<div style="position:absolute; width: 25px; border-bottom: 3px dashed #94a3b8; left: 100%; top: 50%;"></div>` : '';
                html += `<div class="lewis-cell atom-box periph-atom-placed" style="grid-column: 5; grid-row: 3; position: relative; border-color: ${isCovAt?'#94a3b8':'#cbd5e1'};">${b.periph[b.periph.length === 1 ? 0 : 1]} ${localDrawLp(expectedLp.periph[b.periph.length === 1 ? 0 : 1], 1)}${dash1}</div>`;
                html += `<div class="lewis-cell bond-box" style="grid-column: 4; grid-row: 3;">${drawH(bonds[1])}</div>`;
            }
            if (placed[2]) {
                let dash2 = isCovAt ? `<div style="position:absolute; height: 25px; border-left: 3px dashed #94a3b8; top: 100%; left: 50%;"></div>` : '';
                html += `<div class="lewis-cell atom-box periph-atom-placed" style="grid-column: 3; grid-row: 5; position: relative; border-color: ${isCovAt?'#94a3b8':'#cbd5e1'};">${b.periph[2]} ${localDrawLp(expectedLp.periph[2], 2)}${dash2}</div>`;
                html += `<div class="lewis-cell bond-box" style="grid-column: 3; grid-row: 4;">${drawV(bonds[2])}</div>`;
            }
            if (placed[3]) {
                let dash3 = isCovAt ? `<div style="position:absolute; height: 25px; border-left: 3px dashed #94a3b8; bottom: 100%; left: 50%;"></div>` : '';
                html += `<div class="lewis-cell atom-box periph-atom-placed" style="grid-column: 3; grid-row: 1; position: relative; border-color: ${isCovAt?'#94a3b8':'#cbd5e1'};">${b.periph[3]} ${localDrawLp(expectedLp.periph[3], 3)}${dash3}</div>`;
                html += `<div class="lewis-cell bond-box" style="grid-column: 3; grid-row: 2;">${drawV(bonds[3])}</div>`;
            }

            html += '</div>';
            return html;
        }

        function formatChemicalFormulaHTML(formula) {
            return String(formula || '').replace(/(\d+)/g, '<sub>$1</sub>');
        }

        function getLewisExplanationHTML(scenario) {
            if (!scenario || !scenario.builder) return '';
            if ((scenario.form || '') === 'SiO2') {
                return `
                    <div class="mt-2 max-w-[520px] rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] leading-snug text-slate-700">
                        <div class="font-bold text-amber-800 mb-1">Cómo casa esta unidad con la fórmula ${formatChemicalFormulaHTML('SiO2')}</div>
                        <div>La pizarra muestra la <b>unidad local</b>: un <b>Si</b> unido a <b>4 O</b>. Pero cada <b>O</b> es un <b>oxígeno puente</b> y también se une a <b>otro Si</b> de la red.</div>
                        <div class="mt-1"><b>Por eso:</b> <span class="font-mono">SiO<sub>4</sub>/2 = SiO<sub>2</sub></span>. Es decir, la unidad local es tetraédrica, pero la <b>fórmula global</b> de la red sigue siendo <b>SiO<sub>2</sub></b>.</div>
                    </div>`;
            }
            if ((scenario.form || '') === 'SiC') {
                return `
                    <div class="mt-2 max-w-[520px] rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] leading-snug text-slate-700">
                        <div class="font-bold text-amber-800 mb-1">Cómo interpretar la red de ${formatChemicalFormulaHTML('SiC')}</div>
                        <div>En el carborundo, cada <b>Si</b> se une tetraédricamente a <b>4 C</b> y cada <b>C</b> se une tetraédricamente a <b>4 Si</b>.</div>
                        <div class="mt-1">Por eso la red tiene el <b>mismo tipo estructural que el diamante</b> (tipo blenda de cinc), pero con <b>dos especies alternadas</b>. La <b>proporción global</b> sigue siendo <b>1:1</b>, es decir, <b>SiC</b>.</div>
                    </div>`;
            }
            if ((scenario.form || '') === 'C3N4') {
                return `
                    <div class="mt-2 max-w-[520px] rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] leading-snug text-slate-700">
                        <div class="font-bold text-amber-800 mb-1">Modelo didáctico de ${formatChemicalFormulaHTML('C3N4')} denso/superduro 3D</div>
                        <div>En este simulador se usa la idea de una <b>fase 3D densa</b> de nitruro de carbono basada en una <b>red de tetraedros CN<sub>4</sub></b>. Cada <b>C</b> se representa como un centro <b>sp<sup>3</sup> tetraédrico</b>, unido mediante <b>4 enlaces sencillos a 4 N</b>.</div>
                        <div class="mt-1">Cada <b>N</b> se representa como un átomo <b>tricoordinado</b>, enlazado a <b>3 C</b> de la red. Para que el modelo sea más claro, en la vista 3D <b>no se dibujan pares de electrones libres</b>.</div>
                        <div class="mt-1">Didácticamente, la unidad local no coincide exactamente con la fórmula global. Lo importante es entender que la red se extiende en 3D y que la proporción total sigue siendo <b>C<sub>3</sub>N<sub>4</sub></b>.</div>
                    </div>`;
            }
            return '';
        }

        const electronegativityDB = { H: 2.20, C: 2.55, N: 3.04, O: 3.44, F: 3.98, Si: 1.90, P: 2.19, S: 2.58, Cl: 3.16, Br: 2.96, I: 2.66 };

        function isWeakPolarException(symA, symB) {
            const pair = [symA, symB].sort().join('-');
            return pair === 'H-P';
        }

        function isBondConsideredPolar(symA, symB) {
            if (!symA || !symB || symA === symB) return false;
            const diff = Math.abs((electronegativityDB[symA] || 0) - (electronegativityDB[symB] || 0));
            // Algunos enlaces con diferencia de electronegatividad pequeña se tratan como
            // débilmente polares en el simulador para razonar dipolos y geometría.
            // En moléculas simétricas, la molécula puede ser apolar por cancelación vectorial.
            if ((symA === 'C' && symB === 'H') || (symA === 'H' && symB === 'C')) return true;
            if ((symA === 'C' && symB === 'I') || (symA === 'I' && symB === 'C')) return true;
            if (isWeakPolarException(symA, symB)) return true;
            // Umbral didáctico: N-Cl, N-Br y otros enlaces heteronucleares ligeramente polares
            // deben poder generar moléculas polares si la geometría no cancela los dipolos.
            return diff >= 0.05;
        }

        function getBondDipoleSense(symA, symB) {
            const enA = electronegativityDB[symA] || 0;
            const enB = electronegativityDB[symB] || 0;
            return enB >= enA ? 'A_to_B' : 'B_to_A';
        }

        function renderLewisStructureOnStage() {
            if (!currentScenario || !currentScenario.builder || !stageContent) return;
            const formulaHtml = formatChemicalFormulaHTML(currentScenario.form);
            stageContent.innerHTML = `
                <div class="fade-in w-full flex flex-col items-center justify-center lewis-stage-compact">
                    <div class="mb-0.5 text-center">
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-wide">Estructura de Lewis</div>
                        <div class="text-xl font-extrabold text-indigo-700 leading-tight">${formulaHtml}</div>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm px-2 py-1">
                        ${generateStaticLewisHTML(currentScenario)}
                    </div>
                    ${getLewisExplanationHTML(currentScenario)}
                </div>
            `;
        }

        function getAngularAngleCategory(formula) {
            const f = formula || '';
            if (['H2O', 'H2S', 'OF2', 'OCl2', 'SF2', 'SCl2'].includes(f)) return 'angular_ax2e2';
            if (['CO2', 'CS2'].includes(f)) return 'lineal_ax2';
            if (['PH3', 'PCl3', 'PF3', 'PBr3', 'PI3', 'NH3', 'NF3', 'NCl3', 'NBr3', 'NI3'].includes(f)) return 'trigonal_pyramidal_ax3e1';
            return 'angular_ax2e1';
        }

        function getRealBondAngleText(formula, geometry, defaultText) {
            if (geometry === 'lineal') return '180°';
            if (geometry === 'angular') return '≈ 104,5°';
            if (geometry === 'piramidal trigonal') return '≈ 107°';
            return defaultText;
        }

        function renderMolecularGeometryOnStage(showDipoles = false) {
            const data = getMolecularGeometryData();
            if (!data || !currentScenario || !currentScenario.builder || !stageContent) return;

            const b = currentScenario.builder;
            const bondOrder = b.expectedBondLevel || 1;
            const lpCenter = b.expectedLp?.center || 0;
            const lpPeriph = b.expectedLp?.periph || [];

            const W = 460;
            const H = 340;
            const cx = 230;
            const cy = 170;
            const r = 118;

            function positionsForGeometry() {
                if (data.isDiatomic) {
                    return [{ sym: b.center, x: 160, y: cy, pos: 'center' }, { sym: b.periph[0], x: 300, y: cy, pos: 0 }];
                }
                if (data.geometry === 'lineal') {
                    return [
                        { sym: b.center, x: cx, y: cy, pos: 'center' },
                        { sym: b.periph[0], x: cx - r, y: cy, pos: 0 },
                        { sym: b.periph[1], x: cx + r, y: cy, pos: 1 }
                    ].filter(a => a.sym);
                }
                if (data.geometry === 'angular') {
                    const angleCategory = getAngularAngleCategory(currentScenario.form);
                    const angle = 104.5;
                    const half = angle / 2;
                    const a1 = (270 - half) * Math.PI / 180;
                    const a2 = (270 + half) * Math.PI / 180;
                    return [
                        { sym: b.center, x: cx, y: cy - 22, pos: 'center' },
                        { sym: b.periph[0], x: cx + r * Math.cos(a1), y: cy - 22 + r * Math.sin(a1), pos: 0 },
                        { sym: b.periph[1], x: cx + r * Math.cos(a2), y: cy - 22 + r * Math.sin(a2), pos: 1 }
                    ].filter(a => a.sym);
                }
                if (data.geometry === 'plano_triangular') {
                    const angs = [-90, 150, 30];
                    return [{ sym: b.center, x: cx, y: cy, pos: 'center' }, ...b.periph.map((sym, i) => {
                        const a = angs[i] * Math.PI / 180;
                        return { sym, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a), pos: i };
                    })];
                }
                if (data.geometry === 'piramide_triangular') {
                    return [
                        { sym: b.center, x: cx, y: 86, pos: 'center' },
                        { sym: b.periph[0], x: cx - 114, y: 170, pos: 0 },
                        { sym: b.periph[1], x: cx - 42, y: 232, pos: 1 },
                        { sym: b.periph[2], x: cx + 126, y: 166, pos: 2 }
                    ].filter(a => a.sym);
                }
                if (data.geometry === 'tetraedrica') {
                    return [
                        { sym: b.center, x: cx, y: cy - 8, pos: 'center' },
                        { sym: b.periph[0], x: cx, y: cy - 128, pos: 0 },
                        { sym: b.periph[1], x: cx - 124, y: cy + 50, pos: 1 },
                        { sym: b.periph[2], x: cx + 122, y: cy + 36, pos: 2 },
                        { sym: b.periph[3], x: cx + 18, y: cy + 132, pos: 3 }
                    ].filter(a => a.sym);
                }
                return [{ sym: b.center, x: cx, y: cy, pos: 'center' }];
            }

            const pts = positionsForGeometry();
            const centerPt = pts.find(p => p.pos === 'center') || pts[0];
            const periphPts = pts.filter(p => p.pos !== 'center');

            function getBondVisualStyle(posIndex) {
                if (data.geometry === 'piramide_triangular') {
                    if (posIndex === 0) return 'hashed';
                    if (posIndex === 1) return 'wedge';
                    return 'plain';
                }
                if (data.geometry === 'tetraedrica') {
                    if (posIndex === 1) return 'hashed';
                    if (posIndex === 3) return 'wedge';
                    return 'plain';
                }
                return 'plain';
            }

            function bondSvgStyle(x1, y1, x2, y2, order, style) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const ux = dx / len;
                const uy = dy / len;
                const nx = -uy;
                const ny = ux;
                const startPad = 28;
                const endPad = 30;
                const sx = x1 + ux * startPad;
                const sy = y1 + uy * startPad;
                const ex = x2 - ux * endPad;
                const ey = y2 - uy * endPad;
                if (order > 1 || style === 'plain') {
                    const gap = 5;
                    const offsets = order === 1 ? [0] : (order === 2 ? [-gap, gap] : [-gap * 1.4, 0, gap * 1.4]);
                    return offsets.map(o => `<line x1="${sx + nx * o}" y1="${sy + ny * o}" x2="${ex + nx * o}" y2="${ey + ny * o}" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>`).join('');
                }
                if (style === 'wedge') {
                    const startHalf = 2.2;
                    const endHalf = 9.2;
                    return `<polygon points="${sx + nx * startHalf},${sy + ny * startHalf} ${sx - nx * startHalf},${sy - ny * startHalf} ${ex - nx * endHalf},${ey - ny * endHalf} ${ex + nx * endHalf},${ey + ny * endHalf}" fill="#111827" opacity="0.96"/>`;
                }
                if (style === 'hashed') {
                    const segs = 8;
                    let pieces = '';
                    for (let i = 0; i < segs; i++) {
                        const t = (i + 1) / (segs + 1);
                        const px = sx + (ex - sx) * t;
                        const py = sy + (ey - sy) * t;
                        const half = 1.0 + t * 8.0;
                        pieces += `<line x1="${px - nx * half}" y1="${py - ny * half}" x2="${px + nx * half}" y2="${py + ny * half}" stroke="#111827" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>`;
                    }
                    return pieces;
                }
                return '';
            }

            function lonePairMark(x, y, angleDeg = 0) {
                return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="#dc2626" stroke="#ffffff" stroke-width="2.6" paint-order="stroke" font-size="22" font-weight="900" transform="rotate(${angleDeg} ${x} ${y})">··</text>`;
            }

            function lpSvg(x, y, count, pos, refX = null, refY = null) {
                if (!count) return '';
                const marks = [];
                if (pos === 'center' || refX === null || refY === null) {
                    let configs = [
                        { ang: -90, r: 50 },
                        { ang: 0, r: 48 },
                        { ang: 90, r: 48 },
                        { ang: 180, r: 48 }
                    ];
                    // In bent AX2E2 molecules with O or S as central atom, lone pairs are drawn
                    // above and away from the bonding pairs, never between the two bonds.
                    if (data && data.geometry === 'angular' && (b.center === 'O' || b.center === 'S') && count >= 2) {
                        configs = [
                            { ang: 135, r: 48 },
                            { ang: 45, r: 48 },
                            { ang: 90, r: 54 },
                            { ang: 180, r: 48 }
                        ];
                    }
                    configs.slice(0, count).forEach(cfg => {
                        const rad = cfg.ang * Math.PI / 180;
                        const px = x + cfg.r * Math.cos(rad);
                        const py = y + cfg.r * Math.sin(rad);
                        marks.push(lonePairMark(px, py, cfg.ang + 90));
                    });
                    return marks.join('');
                }

                // Pares libres de átomos extremos: pegados al átomo y orientados
                // alrededor del contorno, evitando el lado del enlace.
                const outward = Math.atan2(y - refY, x - refX);
                let relDegs = [];
                if (count === 1) relDegs = [0];
                else if (count === 2) relDegs = [-44, 44];
                else relDegs = [-56, 0, 56];

                // Radio menor para que queden adosados al átomo extremo.
                // El átomo tiene r≈27; 33-36 px deja el par justo fuera del borde.
                const lpRadius = count >= 3 ? 35 : 34;

                relDegs.slice(0, count).forEach(d => {
                    const ang = outward + d * Math.PI / 180;
                    const px = x + lpRadius * Math.cos(ang);
                    const py = y + lpRadius * Math.sin(ang);
                    marks.push(lonePairMark(px, py, ang * 180 / Math.PI + 90));
                });
                return marks.join('');
            }

            function dipoleArrowSvg(centerSym, periphSym, x1, y1, x2, y2) {
                if (!showDipoles || !isBondConsideredPolar(centerSym, periphSym)) return '';
                const dx = x2 - x1;
                const dy = y2 - y1;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                let startX, startY, endX, endY;

                // En PH3 la diferencia de electronegatividad P-H es mínima y el dipolo de enlace
                // debe representarse como muy débil: flecha corta y fina.
                if (currentScenario.form === 'PH3') {
                    const ux = dx / len;
                    const uy = dy / len;
                    const midX = (x1 + x2) / 2;
                    const midY = (y1 + y2) / 2;
                    const arrowLen = 18;
                    const towardPeriph = getBondDipoleSense(centerSym, periphSym) === 'A_to_B';
                    startX = midX - ux * arrowLen / 2;
                    startY = midY - uy * arrowLen / 2;
                    endX = midX + ux * arrowLen / 2;
                    endY = midY + uy * arrowLen / 2;
                    if (!towardPeriph) {
                        const tx = startX, ty = startY;
                        startX = endX; startY = endY;
                        endX = tx; endY = ty;
                    }
                    return `<line x1="${startX}" y1="${startY}" x2="${endX}" y2="${endY}" stroke="#0f766e" stroke-width="1.6" marker-end="url(#dipoleArrow)" stroke-linecap="round"/>`;
                }

                if (getBondDipoleSense(centerSym, periphSym) === 'A_to_B') {
                    startX = x1 + dx / len * 46;
                    startY = y1 + dy / len * 46;
                    endX = x2 - dx / len * 46;
                    endY = y2 - dy / len * 46;
                } else {
                    startX = x2 - dx / len * 46;
                    startY = y2 - dy / len * 46;
                    endX = x1 + dx / len * 46;
                    endY = y1 + dy / len * 46;
                }
                return `<line x1="${startX}" y1="${startY}" x2="${endX}" y2="${endY}" stroke="#0f766e" stroke-width="2.3" marker-end="url(#dipoleArrow)" stroke-linecap="round"/>`;
            }

            function getAngleMarkup() {
                if (periphPts.length < 2) return { arc: '', label: '' };
                let pA = periphPts[0], pB = periphPts[1], radius = 42;
                if (data.geometry === 'plano_triangular') { pA = periphPts[1] || periphPts[0]; pB = periphPts[2] || periphPts[1]; radius = 38; }
                else if (data.geometry === 'angular') { pA = periphPts[0]; pB = periphPts[1]; radius = 36; }
                else if (data.geometry === 'piramide_triangular') { pA = periphPts[1]; pB = periphPts[2]; radius = 32; }
                else if (data.geometry === 'tetraedrica') { pA = periphPts[0]; pB = periphPts[2] || periphPts[1]; radius = 32; }
                else if (data.geometry === 'lineal') { pA = periphPts[0]; pB = periphPts[1]; radius = 34; }
                function angleFromCenter(pt) { return Math.atan2(pt.y - centerPt.y, pt.x - centerPt.x); }
                let a1 = angleFromCenter(pA), a2 = angleFromCenter(pB), delta = a2 - a1;
                while (delta <= -Math.PI) delta += 2 * Math.PI;
                while (delta > Math.PI) delta -= 2 * Math.PI;
                let start = a1, end = a2;
                if (Math.abs(delta) > Math.PI) { if (delta > 0) start = a2, end = a1; else start = a1, end = a2; }
                else if (delta < 0) { start = a2; end = a1; }
                let finalDelta = end - start;
                while (finalDelta < 0) finalDelta += 2 * Math.PI;
                if (finalDelta > Math.PI) { const tmp = start; start = end; end = tmp + 2 * Math.PI; finalDelta = end - start; }
                const x1 = centerPt.x + radius * Math.cos(start);
                const y1 = centerPt.y + radius * Math.sin(start);
                const x2 = centerPt.x + radius * Math.cos(end);
                const y2 = centerPt.y + radius * Math.sin(end);
                const arc = `<path d="M ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2}" fill="none" stroke="#f59e0b" stroke-width="3.2" stroke-linecap="round"/>`;
                const labelText = getRealBondAngleText(currentScenario.form, data.geometry, data.angleText).replace('≈ ', '').replace('< ', '<');
                const mid = start + finalDelta / 2;
                const labelRadius = radius + 48;
                const lx = centerPt.x + labelRadius * Math.cos(mid);
                const ly = centerPt.y + labelRadius * Math.sin(mid);
                const label = `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#d97706" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-size="22" font-weight="900">${labelText}</text>`;
                return { arc, label };
            }

            const bonds = periphPts.map((p, i) => bondSvgStyle(centerPt.x, centerPt.y, p.x, p.y, bondOrder, getBondVisualStyle(p.pos))).join('');
            const bondDipoles = periphPts.map((p, i) => dipoleArrowSvg(b.center, b.periph[i], centerPt.x, centerPt.y, p.x, p.y)).join('');
            const atomSvg = pts.map(p => `<g><circle cx="${p.x}" cy="${p.y}" r="27" fill="${p.pos === 'center' ? '#e0e7ff' : '#f8fafc'}" stroke="${p.pos === 'center' ? '#6366f1' : '#94a3b8'}" stroke-width="3"/><text x="${p.x}" y="${p.y + 1}" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" font-size="22" font-weight="800">${p.sym}</text></g>`).join('');
            const lonePairs = lpSvg(centerPt.x, centerPt.y, lpCenter, 'center') + periphPts.map((p, i) => lpSvg(p.x, p.y, lpPeriph[i] || 0, i, centerPt.x, centerPt.y)).join('');
            const angleMarkup = getAngleMarkup();

            let netDipoleSvg = '';
            if (showDipoles && data.moleculePolar) {
                let startX = centerPt.x, startY = centerPt.y, endX = centerPt.x, endY = centerPt.y, labelX = centerPt.x, labelY = centerPt.y;
                if (data.geometry === 'piramide_triangular') {
                    const netLen = currentScenario.form === 'PH3' ? 42 : 98;
                    startX = centerPt.x;
                    startY = centerPt.y + 8;
                    endX = centerPt.x;
                    endY = centerPt.y + netLen;
                    labelX = endX + 18;
                    labelY = endY + 10;
                } else {
                    let sumX = 0, sumY = 0;
                    periphPts.forEach((p, i) => {
                        const sym = b.periph[i];
                        if (!isBondConsideredPolar(b.center, sym)) return;
                        const dx = p.x - centerPt.x;
                        const dy = p.y - centerPt.y;
                        const len = Math.sqrt(dx * dx + dy * dy) || 1;
                        const towardPeriph = getBondDipoleSense(b.center, sym) === 'A_to_B';
                        const weight = Math.max(Math.abs((electronegativityDB[b.center] || 0) - (electronegativityDB[sym] || 0)), 0.20);
                        sumX += (towardPeriph ? dx / len : -dx / len) * weight;
                        sumY += (towardPeriph ? dy / len : -dy / len) * weight;
                    });
                    const mag = Math.sqrt(sumX * sumX + sumY * sumY) || 1;
                    const ux = sumX / mag;
                    const uy = sumY / mag;
                    endX = centerPt.x + ux * 72;
                    endY = centerPt.y + uy * 72;
                    labelX = endX + ux * 22;
                    labelY = endY + uy * 22;
                }
                const netStrokeWidth = currentScenario.form === 'PH3' ? 2.0 : 2.8;
                const netFontSize = currentScenario.form === 'PH3' ? 17 : 20;
                netDipoleSvg = `<line x1="${startX}" y1="${startY}" x2="${endX}" y2="${endY}" stroke="#7c3aed" stroke-width="${netStrokeWidth}" marker-end="url(#netDipoleArrow)" stroke-linecap="round"/><text x="${labelX}" y="${labelY}" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-size="${netFontSize}" font-weight="900">μ</text>`;
            }

            const shapeLabels = { lineal: 'Lineal', angular: 'Angular', plano_triangular: 'Plano triangular', piramide_triangular: 'Pirámide triangular', tetraedrica: 'Tetraédrica' };
            const displayAngleText = getRealBondAngleText(currentScenario.form, data.geometry, data.angleText);
            const displayShapeLabel = data.geometry === 'angular'
                ? (getAngularAngleCategory(currentScenario.form) === 'angular_ax2e2' ? 'Angular AX₂E₂' : 'Angular AX₂E₁')
                : shapeLabels[data.geometry];
            stageContent.innerHTML = `<div class="fade-in w-full flex flex-col items-center justify-center"><div class="mb-1 text-center"><div class="text-sm font-bold text-slate-500 uppercase tracking-wide">Geometría de la estructura</div><div class="text-2xl font-extrabold text-indigo-700">${formatChemicalFormulaHTML(currentScenario.form)}</div></div><div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width: 420px; height: auto; max-height: 360px;"><defs><marker id="dipoleArrow" markerWidth="5.2" markerHeight="5.2" refX="4.8" refY="2.6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L5.2,2.6 L0,5.2 z" fill="#0f766e"></path></marker><marker id="netDipoleArrow" markerWidth="4.4" markerHeight="4.4" refX="4.0" refY="2.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L4.4,2.2 L0,4.4 z" fill="#7c3aed"></path></marker></defs>${bonds}${angleMarkup.arc}${bondDipoles}${netDipoleSvg}${atomSvg}${lonePairs}${angleMarkup.label}</svg></div><div class="mt-1.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-center"><b>${displayShapeLabel}</b> · ángulo ${displayAngleText}${showDipoles ? '<br><span class="text-teal-700">Flechas verde azulado: momentos dipolares de enlace</span>' : ''}${showDipoles && data.moleculePolar ? '<br><span class="text-violet-700 font-bold">Flecha violeta: momento dipolar molecular</span>' : ''}</div></div>`;
        }

        // --- CÁLCULO DE MASA ATÓMICA O MOLECULAR ---
        function stepMassCalculation(c1, c2, isRetry = false, prevMass = '', prevUnit = '') {
            if (!isRetry) currentStepAttempts = 0;
            const a1 = elementsDB[currentScenario.e1];
            const a2 = elementsDB[currentScenario.e2];
            const isIonic = currentScenario.type === 'ionic';
            const isHomo = currentScenario.e1 === currentScenario.e2;
            const isNone = currentScenario.type === 'none';
            const isMetallic = currentScenario.type === 'metallic';
            const isCovalentAtomic = currentScenario.type === 'covalent_atomic';
            
            let massName = 'masa molecular (<i>M</i><sub>r</sub>)';
            if (isIonic || (isCovalentAtomic && !isHomo)) massName = 'masa de la fórmula (<i>M</i><sub>r</sub>)';
            else if (isNone || isMetallic || (isCovalentAtomic && isHomo)) massName = 'masa atómica (<i>A</i><sub>r</sub>)';

            safeSetTimeout(() => {
                if (!isRetry) {
                    if (isHomo && !isCovalentAtomic) {
                        addTutorMessage(`Ahora calculemos la <b>${massName}</b>. Sabiendo que la masa atómica de ${a1.sym} es ${a1.mass.toFixed(2)} u.<br><br>¿Cuál es la masa total de la fórmula y en qué unidad se mide?`);
                    } else if (isCovalentAtomic && isHomo) {
                        addTutorMessage(`Ahora calculemos la <b>${massName}</b>. Sabiendo que la masa atómica de ${a1.sym} es ${a1.mass.toFixed(2)} u.<br><br>¿Cuál es la masa atómica del elemento en la red y en qué unidad se mide?`);
                    } else {
                        addTutorMessage(`Ahora calculemos la <b>${massName}</b>. Sabiendo que las masas atómicas son:<br>• ${a1.sym}: ${a1.mass.toFixed(2)} u<br>• ${a2.sym}: ${a2.mass.toFixed(2)} u<br><br>¿Cuál es la masa total de la fórmula y en qué unidad se mide?`);
                    }
                }

                inputArea.innerHTML = `
                    <div class="flex flex-col space-y-1 fade-in font-sans text-slate-800">
                        <div class="flex items-center justify-center space-x-2">
                            <input type="text" id="calcMass" value="${prevMass}" placeholder="Ej: 45.02" class="border border-slate-300 rounded p-1.5 w-24 text-center focus:ring-2 outline-none bg-white text-slate-800">
                            <input type="text" id="calcUnit" value="${prevUnit}" placeholder="Unidad" class="border border-slate-300 rounded p-1.5 w-20 text-center focus:ring-2 outline-none bg-white text-slate-800">
                        </div>
                        <button onclick="checkMass(${c1}, ${c2})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded transition-colors font-sans">Verificar Masa</button>
                    </div>
                `;
            }, isRetry ? 100 : 1500);
        }

        function checkMass(c1, c2) {
            const userMassRaw = document.getElementById('calcMass').value.trim();
            const userUnitRaw = document.getElementById('calcUnit').value.trim();

            if (!userMassRaw || !userUnitRaw) {
                addTutorMessage("Por favor, rellena tanto la casilla de la masa como la de la unidad antes de comprobar.");
                return;
            }

            currentStepAttempts++;
            
            const userMass = parseFloat(userMassRaw.replace(',', '.')); 
            const userUnit = userUnitRaw; 

            const a1 = elementsDB[currentScenario.e1];
            const a2_sym = currentScenario.e2;
            const a2 = elementsDB[a2_sym];
            const expectedMass = (c1 * a1.mass + (c2 ? c2 * a2.mass : 0)).toFixed(2);
            
            const isMassCorrect = !isNaN(userMass) && Math.abs(userMass - parseFloat(expectedMass)) < 0.05;
            const isUnitCorrect = userUnit === 'u'; 

            inputArea.innerHTML = '';
            addUserMessage(`${userMassRaw} ${userUnitRaw}`);

            safeSetTimeout(() => {
                if (isMassCorrect && isUnitCorrect) {
                    addTutorMessage(`<b class="text-red-600 font-bold">¡Perfecto!</b> La masa es correcta: <b class="text-red-600 font-bold">${expectedMass.replace('.', ',')} u</b>.`);
                    stepMicroscopicStructure();
                } else {
                    if (currentStepAttempts >= 3) {
                        addTutorMessage(`Has agotado tus 3 intentos. La masa correcta es <b class="text-red-600 font-bold">${expectedMass.replace('.', ',')} u</b>.`);
                        safeSetTimeout(() => stepMicroscopicStructure(), 2500);
                    } else {
                        let errorMsg = "Mmm, revisa la respuesta. ";
                        
                        if (!isUnitCorrect && isMassCorrect) {
                            if (userUnit.toLowerCase() === 'u') {
                                errorMsg += `El valor numérico es correcto, pero <b class="text-amber-600 font-bold">¡cuidado con la notación!</b> El símbolo oficial de la unidad de masa atómica no se admite en mayúsculas.`;
                            } else {
                                errorMsg += `El valor numérico es correcto, pero hay un <b class="text-amber-600 font-bold">error en la unidad</b>. Revisa el símbolo oficial internacional (de una sola letra en minúscula) para la unidad de masa atómica unificada. No se admiten abreviaturas antiguas ni otras unidades.`;
                            }
                        } else if (!isMassCorrect && isUnitCorrect) {
                            if (currentStepAttempts === 1) {
                                errorMsg += `Hay un error en el <b>valor numérico de la masa</b>. ¡Piénsalo un poco más e inténtalo de nuevo!`;
                            } else {
                                const isHomo = currentScenario.e1 === currentScenario.e2;
                                const isCovalentAtomic = currentScenario.type === 'covalent_atomic';
                                if (isHomo || (isCovalentAtomic && isHomo)) {
                                    let totalCount = c1 + (c2 || 0);
                                    let cText = totalCount === 1 ? "1 vez" : `${totalCount} veces`;
                                    errorMsg += `Hay un error numérico. Suma ${cText} la masa de ${a1.sym}. `;
                                } else {
                                    let c1Text = c1 === 1 ? "1 vez" : `${c1} veces`;
                                    let c2Text = c2 === 1 ? "1 vez" : `${c2} veces`;
                                    errorMsg += `Hay un error numérico. Suma ${c1Text} la masa de ${a1.sym} y ${c2Text} la de ${a2.sym}. `;
                                }
                            }
                        } else {
                            if (currentStepAttempts === 1) {
                                errorMsg += `Hay errores tanto en el <b>valor numérico</b> como en la <b>unidad</b>. ¡Revisa ambos!`;
                            } else {
                                const isHomo = currentScenario.e1 === currentScenario.e2;
                                const isCovalentAtomic = currentScenario.type === 'covalent_atomic';
                                if (isHomo || (isCovalentAtomic && isHomo)) {
                                    let totalCount = c1 + (c2 || 0);
                                    let cText = totalCount === 1 ? "1 vez" : `${totalCount} veces`;
                                    errorMsg += `Calcula sumando ${cText} la masa de ${a1.sym}. Además, usa el símbolo oficial de una sola letra minúscula para la unidad.`;
                                } else {
                                    let c1Text = c1 === 1 ? "1 vez" : `${c1} veces`;
                                    let c2Text = c2 === 1 ? "1 vez" : `${c2} veces`;
                                    errorMsg += `Calcula sumando ${c1Text} la masa de ${a1.sym} y ${c2Text} la de ${a2.sym}. Además, usa el símbolo oficial de una sola letra minúscula para la unidad.`;
                                }
                            }
                        }
                        
                        addTutorMessage(errorMsg);
                        stepMassCalculation(c1, c2, true, userMassRaw, userUnitRaw); 
                    }
                }
            }, 800);
        }

        // --- ESTRUCTURA MICROSCÓPICA ---
        function stepMicroscopicStructure(isRetry = false) {
            if (!isRetry) currentStepAttempts = 0;
            safeSetTimeout(() => {
                if (!isRetry) {
                    addTutorMessage("Elige el tipo de <b>estructura microscópica</b> que formará esta sustancia:");
                }
                
                inputArea.innerHTML = `
                    <div class="flex flex-col space-y-1 fade-in font-sans text-slate-800">
                        <select id="microStructure" class="border border-slate-300 rounded px-2 py-1 focus:ring-2 outline-none w-full text-sm bg-white text-slate-800">
                            <option value="">Selecciona la estructura...</option>
                            <option value="atomos_sueltos">Átomos sueltos</option>
                            <option value="red_metalica">Red cristalina de cationes con e⁻ deslocalizados</option>
                            <option value="red_iones">Red cristalina de iones</option>
                            <option value="red_atomos">Red cristalina de átomos neutros</option>
                            <option value="moleculas">Moléculas</option>
                        </select>
                        <button onclick="checkMicroscopicStructure()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-1.5 rounded transition-colors font-sans">Comprobar Estructura</button>
                    </div>
                `;
            }, isRetry ? 100 : 1000);
        }

        function checkMicroscopicStructure() {
            currentStepAttempts++;
            const selectEl = document.getElementById('microStructure');
            const userChoice = selectEl.value;
